<!DOCTYPE html>

<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nova Publicação — KUDURO PRIME</title>

  <style>
    :root{
      --bg:#070707;
      --panel:#111;
      --gold:#f4bf31;
      --gold2:#ffdc6b;
      --text:#fff;
      --muted:#a7a7a7;
      --line:#292929;
      --red:#ff563f;
      --green:#48d597;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .top{
      height:72px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      position:sticky;
      top:0;
      background:rgba(7,7,7,.95);
      backdrop-filter:blur(15px);
      z-index:20;
    }

    .top-in{
      width:min(720px,92%);
      margin:auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .brand{
      font-size:19px;
      font-weight:900;
      letter-spacing:-1px;
    }

    .brand span{
      color:var(--gold);
    }

    .back{
      font-size:14px;
      font-weight:bold;
      color:var(--gold);
    }

    main{
      width:min(720px,92%);
      margin:0 auto;
      padding:35px 0 70px;
    }

    h1{
      margin:0;
      font-size:32px;
    }

    .subtitle{
      color:var(--muted);
      margin:8px 0 28px;
      font-size:14px;
    }

    .card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:18px;
      padding:20px;
    }

    .types{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin-bottom:22px;
    }

    .type{
      background:#0b0b0b;
      border:1px solid var(--line);
      border-radius:12px;
      padding:18px 10px;
      text-align:center;
      cursor:pointer;
      font-weight:800;
      transition:.2s;
    }

    .type:hover{
      border-color:var(--gold);
    }

    .type.active{
      background:linear-gradient(
        145deg,
        rgba(244,191,49,.2),
        rgba(244,191,49,.04)
      );
      border-color:var(--gold);
      color:var(--gold);
    }

    label{
      display:block;
      font-size:12px;
      font-weight:bold;
      margin:20px 0 8px;
      color:#ddd;
    }

    input[type="text"],
    textarea{
      width:100%;
      padding:14px;
      background:#0a0a0a;
      border:1px solid var(--line);
      border-radius:10px;
      color:white;
      outline:none;
      font-family:inherit;
    }

    input:focus,
    textarea:focus{
      border-color:var(--gold);
    }

    textarea{
      resize:vertical;
      min-height:100px;
    }

    .upload{
      min-height:190px;
      border:2px dashed #353535;
      border-radius:14px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px;
      cursor:pointer;
      transition:.2s;
      background:#0b0b0b;
    }

    .upload:hover{
      border-color:var(--gold);
    }

    .upload strong{
      font-size:16px;
    }

    .upload small{
      color:var(--muted);
      margin-top:8px;
    }

    #file{
      display:none;
    }

    .preview{
      display:none;
      width:100%;
      margin-top:16px;
      border-radius:12px;
      overflow:hidden;
      background:#000;
    }

    .preview img,
    .preview video{
      display:block;
      width:100%;
      max-height:420px;
      object-fit:contain;
      background:#000;
    }

    .audio-preview{
      display:none;
      margin-top:16px;
      padding:18px;
      background:#0a0a0a;
      border:1px solid var(--line);
      border-radius:12px;
    }

    .audio-preview audio{
      width:100%;
      margin-top:12px;
    }

    .progress-box{
      display:none;
      margin-top:20px;
    }

    .progress-text{
      display:flex;
      justify-content:space-between;
      font-size:12px;
      margin-bottom:8px;
      color:var(--muted);
    }

    .progress{
      height:8px;
      background:#222;
      border-radius:20px;
      overflow:hidden;
    }

    .progress div{
      height:100%;
      width:0%;
      background:linear-gradient(
        90deg,
        var(--gold),
        var(--gold2)
      );
      transition:.2s;
    }

    .publish{
      width:100%;
      margin-top:24px;
      padding:16px;
      border:0;
      border-radius:11px;
      background:linear-gradient(
        135deg,
        var(--gold2),
        var(--gold)
      );
      color:#17120a;
      font-weight:900;
      font-size:14px;
      cursor:pointer;
    }

    .publish:disabled{
      opacity:.5;
      cursor:not-allowed;
    }

    .message{
      display:none;
      margin-top:16px;
      padding:14px;
      border-radius:10px;
      font-size:13px;
    }

    .message.error{
      display:block;
      background:rgba(255,86,63,.12);
      border:1px solid rgba(255,86,63,.35);
      color:#ff8d7c;
    }

    .message.success{
      display:block;
      background:rgba(72,213,151,.12);
      border:1px solid rgba(72,213,151,.35);
      color:var(--green);
    }

    .info{
      margin-top:20px;
      padding:14px;
      border-radius:10px;
      background:#0c0c0c;
      border:1px solid var(--line);
      color:var(--muted);
      font-size:12px;
      line-height:1.6;
    }

    @media(max-width:600px){
      .types{
        gap:7px;
      }

      .type{
        padding:15px 5px;
        font-size:12px;
      }
    }
  </style>

</head>

  </main>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      collection,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    /* =========================
       CONFIGURAÇÃO FIREBASE
    ========================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyDoitCcLeLDNBNPCP6fG1s_xbHr4UmohSo",

      authDomain:
        "kuduro-prime.firebaseapp.com",

      projectId:
        "kuduro-prime",

      storageBucket:
        "kuduro-prime.firebasestorage.app",

      messagingSenderId:
        "299776559545",

      appId:
        "1:299776559545:web:04aced1ba25391eb3fce68"

    };


    /* =========================
       CONFIGURAÇÃO CLOUDINARY
    ========================= */

    const CLOUDINARY_CLOUD_NAME =
      "ge1ntqqc";

    const CLOUDINARY_UPLOAD_PRESET =
      "kuduro_prime";


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    const types =
      document.querySelectorAll(".type");

    const fileInput =
      document.getElementById("file");

    const preview =
      document.getElementById("preview");

    const audioPreview =
      document.getElementById("audioPreview");

    const audioPlayer =
      document.getElementById("audioPlayer");

    const title =
      document.getElementById("title");

    const caption =
      document.getElementById("caption");

    const publishBtn =
      document.getElementById("publishBtn");

    const message =
      document.getElementById("message");

    const progressBox =
      document.getElementById("progressBox");

    const progressBar =
      document.getElementById("progressBar");

    const progressPercent =
      document.getElementById("progressPercent");

    const progressStatus =
      document.getElementById("progressStatus");


    let selectedType =
      "foto";

    let currentUser =
      null;

    let artistData =
      null;

    let selectedFile =
      null;

    let previewUrl =
      null;


    /* =========================
       AUTENTICAÇÃO
    ========================= */

    onAuthStateChanged(
      auth,
      async (user) => {

        if(!user){

          window.location.href =
            "area-do-artista.html";

          return;

        }

        currentUser =
          user;

        try{

          const artistRef =
            doc(
              db,
              "artists",
              user.uid
            );

          const artistSnap =
            await getDoc(artistRef);

          if(artistSnap.exists()){

            artistData =
              artistSnap.data();

          }else{

            /*
              CONTINUA A USAR
              OS DADOS LOCAIS
            */

            artistData = {

              artistName:
                localStorage.getItem(
                  "kpArtistStageName"
                )
                ||
                localStorage.getItem(
                  "kpArtistName"
                )
                ||
                user.displayName
                ||
                user.email
                  ?.split("@")[0]
                ||
                "Artista",

              username:
                localStorage.getItem(
                  "kpArtistUsername"
                )
                ||
                user.email
                  ?.split("@")[0]
                ||
                "",

              photo:
                localStorage.getItem(
                  "kpArtistPhoto"
                )
                ||
                user.photoURL
                ||
                ""

            };

          }

        }
        catch(error){

          console.error(error);

          artistData = {

            artistName:
              localStorage.getItem(
                "kpArtistStageName"
              )
              ||
              localStorage.getItem(
                "kpArtistName"
              )
              ||
              user.displayName
              ||
              user.email
                ?.split("@")[0]
              ||
              "Artista",

            username:
              localStorage.getItem(
                "kpArtistUsername"
              )
              ||
              user.email
                ?.split("@")[0]
              ||
              "",

            photo:
              localStorage.getItem(
                "kpArtistPhoto"
              )
              ||
              user.photoURL
              ||
              ""

          };

        }

      }
    );


    /* =========================
       ESCOLHER TIPO
    ========================= */

    types.forEach(type => {

      type.addEventListener(
        "click",
        () => {

          selectedType =
            type.dataset.type;

          types.forEach(t =>
            t.classList.remove("active")
          );

          type.classList.add("active");

          selectedFile =
            null;

          fileInput.value =
            "";

          clearPreview();

          updateFileType();

        }
      );

    });


    function updateFileType(){

      const fileLabel =
        document.getElementById("fileLabel");

      const uploadTitle =
        document.getElementById("uploadTitle");

      const uploadInfo =
        document.getElementById("uploadInfo");


      if(selectedType === "foto"){

        fileLabel.textContent =
          "ESCOLHE A FOTO";

        uploadTitle.textContent =
          "🖼️ Escolher foto";

        uploadInfo.textContent =
          "JPG, PNG ou WEBP";

        fileInput.accept =
          "image/*";

      }


      if(selectedType === "video"){

        fileLabel.textContent =
          "ESCOLHE O VÍDEO";

        uploadTitle.textContent =
          "🎬 Escolher vídeo";

        uploadInfo.textContent =
          "Máximo de 5 minutos";

        fileInput.accept =
          "video/*";

      }


      if(selectedType === "musica"){

        fileLabel.textContent =
          "ESCOLHE A MÚSICA";

        uploadTitle.textContent =
          "🎵 Escolher música";

        uploadInfo.textContent =
          "MP3, WAV ou áudio compatível";

        fileInput.accept =
          "audio/*";

      }

    }


    /* =========================
       PRÉ-VISUALIZAÇÃO
    ========================= */

    fileInput.addEventListener(
      "change",
      () => {

        const file =
          fileInput.files[0];

        if(!file)
          return;

        selectedFile =
          file;

        clearPreview();

        selectedFile =
          file;

        previewUrl =
          URL.createObjectURL(file);


        if(selectedType === "foto"){

          preview.innerHTML =
            `<img src="${previewUrl}" alt="Pré-visualização">`;

          preview.style.display =
            "block";

        }


        if(selectedType === "video"){

          const video =
            document.createElement("video");

          video.src =
            previewUrl;

          video.controls =
            true;

          video.preload =
            "metadata";


          video.onloadedmetadata =
            () => {

              if(video.duration > 300){

                showMessage(
                  "❌ O vídeo não pode ter mais de 5 minutos.",
                  "error"
                );

                selectedFile =
                  null;

                fileInput.value =
                  "";

                clearPreview();

                return;

              }

            };


          preview.appendChild(video);

          preview.style.display =
            "block";

        }


        if(selectedType === "musica"){

          audioPlayer.src =
            previewUrl;

          audioPreview.style.display =
            "block";

        }

      }
    );


    function clearPreview(){

      if(previewUrl){

        URL.revokeObjectURL(
          previewUrl
        );

      }

      previewUrl =
        null;

      preview.innerHTML =
        "";

      preview.style.display =
        "none";

      audioPlayer.src =
        "";

      audioPreview.style.display =
        "none";

    }


    /* =========================
       ENVIAR PARA CLOUDINARY
    ========================= */

    function uploadToCloudinary(){

      return new Promise(
        (resolve, reject) => {

          const xhr =
            new XMLHttpRequest();


          let resourceType =
            "auto";


          if(selectedType === "video"){

            resourceType =
              "video";

          }


          /*
            Para música usamos "auto".
            Cloudinary identifica
            o tipo de arquivo.
          */

          const uploadUrl =
            "https://api.cloudinary.com/v1_1/"
            +
            CLOUDINARY_CLOUD_NAME
            +
            "/"
            +
            resourceType
            +
            "/upload";


          xhr.open(
            "POST",
            uploadUrl
          );


          xhr.upload.addEventListener(
            "progress",
            event => {

              if(!event.lengthComputable)
                return;


              const percent =
                Math.round(
                  (
                    event.loaded
                    /
                    event.total
                  )
                  *
                  100
                );


              progressBar.style.width =
                percent + "%";

              progressPercent.textContent =
                percent + "%";

              progressStatus.textContent =
                "A enviar para o Cloudinary...";

            }
          );


          xhr.addEventListener(
            "load",
            () => {

              if(
                xhr.status >= 200
                &&
                xhr.status < 300
              ){

                try{

                  const result =
                    JSON.parse(
                      xhr.responseText
                    );


                  resolve(
                    result.secure_url
                  );

                }
                catch(error){

                  reject(error);

                }

              }else{

                let errorMessage =
                  "Erro ao enviar o arquivo.";

                try{

                  const result =
                    JSON.parse(
                      xhr.responseText
                    );

                  errorMessage =
                    result.error?.message
                    ||
                    errorMessage;

                }
                catch(error){}


                reject(
                  new Error(
                    errorMessage
                  )
                );

              }

            }
          );


          xhr.addEventListener(
            "error",
            () => {

              reject(
                new Error(
                  "Erro de ligação com o Cloudinary."
                )
              );

            }
          );


          const formData =
            new FormData();


          formData.append(
            "file",
            selectedFile
          );


          formData.append(
            "upload_preset",
            CLOUDINARY_UPLOAD_PRESET
          );


          formData.append(
            "folder",
            "kuduro-prime/"
            +
            selectedType
          );


          xhr.send(
            formData
          );

        }
      );

    }


    /* =========================
       PUBLICAR
    ========================= */

    publishBtn.addEventListener(
      "click",
      async () => {

        hideMessage();


        if(!currentUser){

          showMessage(
            "Tens de iniciar sessão.",
            "error"
          );

          return;

        }


        if(!selectedFile){

          showMessage(
            "Escolhe um arquivo para publicar.",
            "error"
          );

          return;

        }


        if(!title.value.trim()){

          showMessage(
            "Escreve um título.",
            "error"
          );

          return;

        }


        publishBtn.disabled =
          true;

        publishBtn.textContent =
          "A PUBLICAR...";

        progressBox.style.display =
          "block";

        progressBar.style.width =
          "0%";

        progressPercent.textContent =
          "0%";


        try{

          /*
            1. ENVIAR ARQUIVO
            PARA CLOUDINARY
          */

          const fileUrl =
            await uploadToCloudinary();


          /*
            2. GUARDAR
            PUBLICAÇÃO NO FIRESTORE
          */

          progressStatus.textContent =
            "A guardar publicação...";


          const artistName =

            artistData?.artistName
            ||
            artistData?.nome
            ||
            localStorage.getItem(
              "kpArtistStageName"
            )
            ||
            localStorage.getItem(
              "kpArtistName"
            )
            ||
            currentUser.displayName
            ||
            currentUser.email
              ?.split("@")[0]
            ||
            "Artista";


          const artistUsername =

            artistData?.username
            ||
            localStorage.getItem(
              "kpArtistUsername"
            )
            ||
            currentUser.email
              ?.split("@")[0]
            ||
            "";


          const artistPhoto =

            artistData?.photo
            ||
            artistData?.foto
            ||
            localStorage.getItem(
              "kpArtistPhoto"
            )
            ||
            currentUser.photoURL
            ||
            "";


          await addDoc(
            collection(
              db,
              "publicacoes"
            ),

            {

              uid:
                currentUser.uid,

              tipo:
                selectedType,

              titulo:
                title.value.trim(),

              legenda:
                caption.value.trim(),

              arquivoUrl:
                fileUrl,

              arquivoNome:
                selectedFile.name,

              nomeArtista:
                artistName,

              username:
                artistUsername,

              fotoArtista:
                artistPhoto,

              createdAt:
                serverTimestamp()

            }

          );


          /*
            3. GUARDAR TAMBÉM
            A MÚSICA NO PERFIL
          */

          if(
            selectedType === "musica"
          ){

            const savedSongs =
              localStorage.getItem(
                "kpArtistSongs"
              );


            let songs =
              [];


            try{

              songs =
                savedSongs
                ?
                JSON.parse(
                  savedSongs
                )
                :
                [];

            }
            catch(error){

              songs =
                [];

            }


            if(
              !Array.isArray(
                songs
              )
            ){

              songs =
                [];

            }


            const cover =
              artistPhoto;


            songs.unshift({

              id:
                Date.now(),

              title:
                title.value.trim(),

              artist:
                artistName,

              artistUsername:
                artistUsername,

              audioUrl:
                fileUrl,

              arquivoUrl:
                fileUrl,

              cover:
                cover,

              caption:
                caption.value.trim(),

              createdAt:
                new Date()
                  .toLocaleDateString(
                    "pt-PT"
                  ),

              timestamp:
                Date.now(),

              views:
                0

            });


            localStorage.setItem(
              "kpArtistSongs",
              JSON.stringify(
                songs
              )
            );

          }


          progressStatus.textContent =
            "Publicado com sucesso!";

          progressBar.style.width =
            "100%";

          progressPercent.textContent =
            "100%";


          showMessage(
            "👑 Publicação publicada com sucesso!",
            "success"
          );


          publishBtn.textContent =
            "✓ PUBLICADO";


          setTimeout(
            () => {

              if(
                selectedType === "musica"
              ){

                window.location.href =
                  "meu-perfil.html";

              }else{

                window.location.href =
                  "feed.html";

              }

            },
            1500
          );


        }
        catch(error){

          console.error(
            "ERRO AO PUBLICAR:",
            error
          );


          let erroTexto =
            "❌ Erro ao publicar: "
            +
            error.message;


          if(
            error.message
              .toLowerCase()
              .includes(
                "preset"
              )
          ){

            erroTexto =
              "❌ Verifica se o Upload Preset 'kuduro_prime' está como Unsigned.";

          }


          showMessage(
            erroTexto,
            "error"
          );


          progressBox.style.display =
            "none";


          publishBtn.disabled =
            false;


          publishBtn.textContent =
            "🚀 PUBLICAR AGORA";

        }

      }
    );


    function showMessage(
      text,
      type
    ){

      message.textContent =
        text;

      message.className =
        "message "
        +
        type;

    }


    function hideMessage(){

      message.style.display =
        "none";

      message.className =
        "message";

    }

  </script>

</body>
</html>
