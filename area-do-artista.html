<script type="module">

/* FIREBASE APP */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


/* FIREBASE AUTH */

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


/* CONFIGURAÇÃO FIREBASE */

const firebaseConfig = {

  apiKey:
  "AIzaSyDoitCcLeLDNBNPCP6fG1s_xbHr4UmohSo",

  authDomain:
  "kuduro-prime.firebaseapp.com",

  projectId:
  "kuduro-prime",

  storageBucket:
  "kuduro-prime.firebasestorage.app",

  messagingSenderId:
  "299776559545",

  appId:
  "1:299776559545:web:04aced1ba25391eb3fce68"

};


/* INICIALIZAR FIREBASE */

const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


/* ELEMENTOS */

const loginForm =
  document.getElementById("loginForm");


const loginBtn =
  document.getElementById("loginBtn");


const mensagem =
  document.getElementById("mensagem");


/* MOSTRAR MENSAGEM */

function showMessage(
  texto,
  tipo
){

  mensagem.textContent =
    texto;

  mensagem.className =
    "mensagem " + tipo;

}


/* VERIFICAR SESSÃO */

onAuthStateChanged(
  auth,
  user => {

    if(user){

      window.location.href =
        "painel-do-artista.html";

    }

  }
);


/* LOGIN */

loginForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const email =
      document
        .querySelector("#email")
        .value
        .trim();


    const pass =
      document
        .querySelector("#password")
        .value;


    if(
      !email ||
      !pass
    ){

      showMessage(
        "Preenche todos os campos.",
        "error"
      );

      return;

    }


    loginBtn.disabled =
      true;


    loginBtn.textContent =
      "A ENTRAR...";


    try{


      await signInWithEmailAndPassword(
        auth,
        email,
        pass
      );


      /* GUARDA O NOME DO ARTISTA */

      localStorage.setItem(
        "kpArtistName",
        email
      );


      /* GUARDA UMA SESSÃO LOCAL */

      localStorage.setItem(
        "kpArtistLoggedIn",
        "true"
      );


      showMessage(
        "Login efetuado! A entrar no teu painel... 👑",
        "success"
      );


      setTimeout(
        () => {

          window.location.href =
            "painel-do-artista.html";

        },
        700
      );


    }
    catch(erro){


      console.error(
        "ERRO NO LOGIN:",
        erro
      );


      let textoErro =
        "Erro ao iniciar sessão.";


      if(
        erro.code ===
        "auth/invalid-credential"
      ){

        textoErro =
          "Email ou palavra-passe incorretos.";

      }


      if(
        erro.code ===
        "auth/user-not-found"
      ){

        textoErro =
          "Esta conta não existe.";

      }


      if(
        erro.code ===
        "auth/wrong-password"
      ){

        textoErro =
          "Palavra-passe incorreta.";

      }


      if(
        erro.code ===
        "auth/invalid-email"
      ){

        textoErro =
          "O email introduzido não é válido.";

      }


      if(
        erro.code ===
        "auth/too-many-requests"
      ){

        textoErro =
          "Muitas tentativas. Tenta novamente mais tarde.";

      }


      showMessage(
        textoErro,
        "error"
      );


      loginBtn.disabled =
        false;


      loginBtn.textContent =
        "🔐 ENTRAR NO PAINEL";

    }

  }
);

</script>
