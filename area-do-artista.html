<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Área do Artista | KUDURO PRIME</title>

<style>
* {
  box-sizing: border-box;
}
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDoitCcLeLDNBNPCP6fG1s_xbHr4UmohSo",
    authDomain: "kuduro-prime.firebaseapp.com",
    projectId: "kuduro-prime",
    storageBucket: "kuduro-prime.firebasestorage.app",
    messagingSenderId: "299776559545",
    appId: "1:299776559545:web:04aced1ba25391eb3fce68"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const loginForm = document.getElementById("loginForm");
  const mensagem = document.getElementById("mensagem");

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    mensagem.textContent = "A entrar...";

    try {
      await signInWithEmailAndPassword(auth, email, password);

      mensagem.textContent = "Login realizado com sucesso! 👑";

      setTimeout(() => {
        window.location.href = "painel-do-artista.html";
      }, 1000);

    } catch (error) {
      mensagem.textContent =
        "E-mail ou palavra-passe incorretos.";
    }
  });
</script>
body {
  margin: 0;
  min-height: 100vh;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #111;
  padding: 20px;
  text-align: center;
  border-bottom: 2px solid #d4af37;
}

.logo {
  color: #d4af37;
  font-size: 30px;
  font-weight: bold;
}

nav {
  margin-top: 15px;
}

nav a {
  color: white;
  margin: 8px;
  text-decoration: none;
  font-size: 14px;
}

nav a:hover {
  color: #d4af37;
}

main {
  min-height: 70vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 20px;
}

.painel {
  width: 100%;
  max-width: 550px;
  background: #151515;
  border: 1px solid #d4af37;
  border-radius: 18px;
  padding: 40px;
  text-align: center;
}

.icone {
  font-size: 60px;
}

h1 {
  color: #d4af37;
  margin-bottom: 15px;
}

p {
  color: #aaa;
  line-height: 1.6;
}

.aviso {
  background: #0d0d0d;
  border: 1px solid #333;
  border-radius: 10px;
  padding: 18px;
  margin: 25px 0;
}

.botao {
  display: inline-block;
  padding: 14px 25px;
  background: #d4af37;
  color: black;
  text-decoration: none;
  font-weight: bold;
  border-radius: 8px;
}

.botao:hover {
  background: #f5c842;
}

footer {
  background: #111;
  text-align: center;
  padding: 25px;
  color: #777;
}

@media (max-width: 600px) {
  .painel {
    padding: 25px 20px;
  }

  h1 {
    font-size: 26px;
  }
}
input {
  width: 100%;
  padding: 14px;
  margin: 8px 0 18px;
  background: #080808;
  color: white;
  border: 1px solid #444;
  border-radius: 8px;
}

label {
  display: block;
  text-align: left;
  color: #d4af37;
  font-weight: bold;
}

form .botao {
  width: 100%;
  border: none;
  cursor: pointer;
  font-size: 16px;
}</style>
</head>

<body>

<header>
  <div class="logo">👑 KUDURO PRIME</div>

  <nav>
    <a href="index.html">INÍCIO</a>
    <a href="artistas.html">ARTISTAS</a>
    <a href="musicas.html">MÚSICAS</a>
    <a href="ranking.html">RANKING</a>
    <a href="eventos.html">EVENTOS</a>
  </nav>
</header>

<main>
  <section class="painel">

  <div class="icone">🔒👤</div>

  <h1>ÁREA DO ARTISTA</h1>

  <p>Entra com os dados de acesso enviados pela equipa do KUDURO PRIME.</p>

  <div class="aviso">
    <form id="loginForm">

      <label>E-MAIL</label>
      <input
        type="email"
        id="email"
        placeholder="O teu e-mail"
        required
      >

      <label>PALAVRA-PASSE</label>
      <input
        type="password"
        id="password"
        placeholder="A tua palavra-passe"
        required
      >

      <button type="submit" class="botao">
        ENTRAR 👑
      </button>

      <p id="mensagem"></p>

    </form>
  </div>

  <br>

  <a href="juntar-se.html" class="botao">
    AINDA NÃO ÉS MEMBRO? CANDIDATA-TE 👑
  </a>

</section>
</main>

<footer>
  © 2026 KUDURO PRIME — O KUDURO VIVE AQUI 👑
</footer>

</body>
</html>
