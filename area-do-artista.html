<script type="module">

/* FIREBASE APP */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


/* FIREBASE AUTH */

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


/* CONFIGURAÇÃO FIREBASE */

const firebaseConfig = {

  apiKey:
    "AIzaSyDoitCcLeLDNBNPCP6fG1s_xbHr4UmohSo",

  authDomain:
    "kuduro-prime.firebaseapp.com",

  projectId:
    "kuduro-prime",

  storageBucket:
    "kuduro-prime.firebasestorage.app",

  messagingSenderId:
    "299776559545",

  appId:
    "1:299776559545:web:04aced1ba25391eb3fce68"

};


/* INICIALIZAR FIREBASE */

const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


/* ELEMENTOS */

const loginForm =
  document.getElementById("loginForm");


const loginBtn =
  document.getElementById("loginBtn");


const mensagem =
  document.getElementById("mensagem");


/* MOSTRAR MENSAGEM */

function showMessage(
  texto,
  tipo
){

  mensagem.textContent =
    texto;

  mensagem.className =
    "mensagem " + tipo;

}


/* VERIFICAR SE JÁ ESTÁ LOGADO */

onAuthStateChanged(
  auth,
  user => {

    if(
      user &&
      !loginBtn.disabled
    ){

      window.location.href =
        "painel-do-artista.html";

    }

  }
);


/* LOGIN */

loginForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const email =
      document
        .getElementById("email")
        .value
        .trim();


    const pass =
      document
        .getElementById("password")
        .value;


    if(
      !email ||
      !pass
    ){

      showMessage(
        "Preenche todos os campos.",
        "error"
      );

      return;

    }


    loginBtn.disabled =
      true;


    loginBtn.textContent =
      "A ENTRAR...";


    try{

      const resultado =
        await signInWithEmailAndPassword(
          auth,
          email,
          pass
        );


      const user =
        resultado.user;


      /* GUARDA SESSÃO LOCAL */

      localStorage.setItem(
        "kpArtistLoggedIn",
        "true"
      );


      /* GUARDA EMAIL */

      localStorage.setItem(
        "kpArtistEmail",
        user.email
      );


      /* SÓ GUARDA O NOME SE AINDA NÃO EXISTIR */

      if(
        !localStorage.getItem(
          "kpArtistName"
        )
      ){

        localStorage.setItem(
          "kpArtistName",
          user.email
        );

      }


      showMessage(
        "Login efetuado! A entrar no teu painel... 👑",
        "success"
      );


      setTimeout(
        () => {

          window.location.href =
            "painel-do-artista.html";

        },
        700
      );


    }
    catch(erro){


      console.error(
        "ERRO NO LOGIN:",
        erro
      );


      let textoErro =
        "Erro ao iniciar sessão.";


      if(
        erro.code ===
        "auth/invalid-credential"
      ){

        textoErro =
          "Email ou palavra-passe incorretos.";

      }
      else if(
        erro.code ===
        "auth/user-not-found"
      ){

        textoErro =
          "Esta conta não existe.";

      }
      else if(
        erro.code ===
        "auth/wrong-password"
      ){

        textoErro =
          "Palavra-passe incorreta.";

      }
      else if(
        erro.code ===
        "auth/invalid-email"
      ){

        textoErro =
          "O email introduzido não é válido.";

      }
      else if(
        erro.code ===
        "auth/too-many-requests"
      ){

        textoErro =
          "Muitas tentativas. Tenta novamente mais tarde.";

      }


      showMessage(
        textoErro,
        "error"
      );


      loginBtn.disabled =
        false;


      loginBtn.textContent =
        "🔐 ENTRAR NO PAINEL";

    }

  }
);

</script>
