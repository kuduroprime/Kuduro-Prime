<!DOCTYPE html>

<html lang="pt">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>
    Área do Artista — KUDURO PRIME
  </title>

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      background:
        radial-gradient(
          circle at top right,
          rgba(244,191,49,.15),
          transparent 35%
        ),
        #070707;

      color:#f7f4ed;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    .box{
      width:min(92%,420px);

      padding:35px 30px;

      border:1px solid #3b2f12;

      border-radius:18px;

      background:
        linear-gradient(
          145deg,
          #151515,
          #0b0b0b
        );

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.5);
    }

    .logo{
      text-align:center;

      color:#f4bf31;

      font-size:28px;

      font-weight:900;

      margin-bottom:8px;
    }

    h1{
      margin:10px 0;

      text-align:center;

      font-size:24px;
    }

    .sub{
      margin:0 0 25px;

      text-align:center;

      color:#aaa59a;

      font-size:13px;

      line-height:1.6;
    }

    label{
      display:block;

      margin:15px 0 7px;

      color:#f4bf31;

      font-size:11px;

      font-weight:900;
    }

    input{
      width:100%;

      padding:14px;

      border:1px solid #2a271f;

      border-radius:9px;

      outline:none;

      background:#0b0b0b;

      color:white;

      font-size:14px;
    }

    input:focus{
      border-color:#f4bf31;
    }

    button{
      width:100%;

      margin-top:22px;

      padding:15px;

      border:0;

      border-radius:9px;

      background:
        linear-gradient(
          135deg,
          #ffdc6b,
          #f4bf31
        );

      color:#17120a;

      font-weight:900;

      cursor:pointer;
    }

    button:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .mensagem{
      display:none;

      margin-top:15px;

      padding:12px;

      border-radius:8px;

      text-align:center;

      font-size:12px;
    }

    .mensagem.error{
      display:block;

      background:
        rgba(255,86,63,.12);

      color:#ff8f7b;

      border:
        1px solid
        rgba(255,86,63,.3);
    }

    .mensagem.success{
      display:block;

      background:
        rgba(72,213,151,.12);

      color:#48d597;

      border:
        1px solid
        rgba(72,213,151,.3);
    }

    .register{
      margin-top:22px;

      text-align:center;

      color:#aaa59a;

      font-size:12px;
    }

    .register a{
      color:#f4bf31;

      font-weight:900;

      text-decoration:none;
    }

  </style>

</head>

<body>

  <main class="box">

```
<div class="logo">
  👑 KUDURO PRIME
</div>


<h1>
  ÁREA DO ARTISTA
</h1>


<p class="sub">
  Entra na tua conta para gerir
  o teu perfil e as tuas músicas.
</p>


<form id="loginForm">


  <label for="email">
    EMAIL
  </label>

  <input
    type="email"
    id="email"
    placeholder="teuemail@email.com"
    required
  >


  <label for="password">
    PALAVRA-PASSE
  </label>

  <input
    type="password"
    id="password"
    placeholder="••••••••"
    required
  >


  <button
    type="submit"
    id="loginBtn"
  >
    🔐 ENTRAR NO PAINEL
  </button>


  <div
    class="mensagem"
    id="mensagem"
  ></div>


</form>


<div class="register">

  Ainda não tens conta?

  <br><br>

  <a href="cadastro.html">
    CRIAR CONTA DE ARTISTA
  </a>

</div>
```

  </main>

  <script type="module">


    /* FIREBASE APP */

    import {

      initializeApp

    }

    from

    "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    /* FIREBASE AUTH */

    import {

      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged

    }

    from

    "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    /* CONFIGURAÇÃO FIREBASE */

    const firebaseConfig = {

      apiKey:
        "AIzaSyDoitCcLeLDNBNPCP6fG1s_xbHr4UmohSo",

      authDomain:
        "kuduro-prime.firebaseapp.com",

      projectId:
        "kuduro-prime",

      storageBucket:
        "kuduro-prime.firebasestorage.app",

      messagingSenderId:
        "299776559545",

      appId:
        "1:299776559545:web:04aced1ba25391eb3fce68"

    };


    /* INICIAR FIREBASE */

    const app =
      initializeApp(
        firebaseConfig
      );


    const auth =
      getAuth(app);


    /* ELEMENTOS */

    const loginForm =
      document.getElementById(
        "loginForm"
      );


    const loginBtn =
      document.getElementById(
        "loginBtn"
      );


    const mensagem =
      document.getElementById(
        "mensagem"
      );


    /* MOSTRAR MENSAGEM */

    function showMessage(
      texto,
      tipo
    ){

      mensagem.textContent =
        texto;


      mensagem.className =
        "mensagem " +
        tipo;

    }


    /* SE JÁ EXISTE SESSÃO */

    onAuthStateChanged(

      auth,

      user => {

        if(
          user
        ){

          /*
            GUARDAR SESSÃO
          */

          localStorage.setItem(

            "kpArtistLoggedIn",

            "true"

          );


          /*
            GUARDAR ID DO ARTISTA
          */

          localStorage.setItem(

            "kpArtistUid",

            user.uid

          );


          /*
            GUARDAR EMAIL
          */

          localStorage.setItem(

            "kpArtistEmail",

            user.email

          );


          /*
            IMPORTANTE:

            NÃO ALTERAR O NOME ARTÍSTICO
            AQUI.

            O cadastro já guarda:

            kpArtistStageName

            Por isso o nome artístico
            continua a ser o mesmo.
          */

        }

      }

    );


    /* LOGIN */

    loginForm.addEventListener(

      "submit",

      async event => {

        event.preventDefault();


        const email =
          document
            .getElementById(
              "email"
            )
            .value
            .trim();


        const password =
          document
            .getElementById(
              "password"
            )
            .value;


        if(

          !email ||
          !password

        ){

          showMessage(

            "Preenche todos os campos.",

            "error"

          );

          return;

        }


        loginBtn.disabled =
          true;


        loginBtn.textContent =
          "A ENTRAR...";


        try{


          /* LOGIN FIREBASE */

          const resultado =

            await signInWithEmailAndPassword(

              auth,

              email,

              password

            );


          const user =
            resultado.user;


          /*
            GUARDAR SESSÃO
          */

          localStorage.setItem(

            "kpArtistLoggedIn",

            "true"

          );


          /*
            GUARDAR UID
          */

          localStorage.setItem(

            "kpArtistUid",

            user.uid

          );


          /*
            GUARDAR EMAIL
          */

          localStorage.setItem(

            "kpArtistEmail",

            user.email

          );


          /*
            RECUPERAR NOME ARTÍSTICO

            NÃO substituímos pelo email.
          */

          if(

            user.displayName

          ){

            localStorage.setItem(

              "kpArtistStageName",

              user.displayName

            );


            localStorage.setItem(

              "kpArtistName",

              user.displayName

            );

          }


          /*
            MENSAGEM
          */

          showMessage(

            "Login efetuado! A entrar no painel... 👑",

            "success"

          );


          /*
            ENTRAR NO PAINEL
          */

          setTimeout(

            () => {

              window.location.replace(

                "painel-do-artista.html"

              );

            },

            700

          );


        }
        catch(
          erro
        ){


          console.error(
            "ERRO NO LOGIN:",
            erro
          );


          let textoErro =
            "Erro ao iniciar sessão.";


          if(

            erro.code ===
            "auth/invalid-credential"

          ){

            textoErro =
              "Email ou palavra-passe incorretos.";

          }


          if(

            erro.code ===
            "auth/invalid-email"

          ){

            textoErro =
              "O email não é válido.";

          }


          if(

            erro.code ===
            "auth/user-disabled"

          ){

            textoErro =
              "Esta conta foi desativada.";

          }


          if(

            erro.code ===
            "auth/too-many-requests"

          ){

            textoErro =
              "Muitas tentativas. Tenta novamente mais tarde.";

          }


          showMessage(

            textoErro,

            "error"

          );


          loginBtn.disabled =
            false;


          loginBtn.textContent =
            "🔐 ENTRAR NO PAINEL";

        }

      }

    );


  </script>

</body>

</html>
