<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Entrar — KUDURO PRIME</title>

  <style>
    :root{
      --bg:#070707;
      --gold:#f4bf31;
      --gold2:#ffdc6b;
      --text:#f7f4ed;
      --muted:#aaa59a;
      --line:#2a271f;
      --green:#48d597;
      --red:#ff563f;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:25px;

      background:
        radial-gradient(circle at 90% 0, rgba(244,191,49,.15), transparent 35%),
        radial-gradient(circle at 0 100%, rgba(244,191,49,.08), transparent 35%),
        var(--bg);

      color:var(--text);
      font-family:Arial, Helvetica, sans-serif;
    }

    .box{
      width:min(100%,480px);
      padding:38px;

      border:1px solid #3b2f12;
      border-radius:20px;

      background:
        linear-gradient(145deg,#151515,#0b0b0b);

      box-shadow:0 25px 70px rgba(0,0,0,.5);
    }

    .logo{
      text-align:center;
      color:var(--gold);
      font-size:28px;
      font-weight:900;
      margin-bottom:10px;
    }

    h1{
      margin:15px 0 8px;
      text-align:center;
      font-size:24px;
    }

    .sub{
      margin:0 0 28px;
      text-align:center;
      color:var(--muted);
      font-size:13px;
      line-height:1.6;
    }

    label{
      display:block;
      margin:16px 0 7px;
      color:var(--gold);
      font-size:10px;
      font-weight:900;
    }

    input{
      width:100%;
      padding:15px;

      border:1px solid var(--line);
      border-radius:9px;
      outline:none;

      background:#0b0b0b;
      color:white;

      font-size:14px;
    }

    input:focus{
      border-color:var(--gold);
      box-shadow:0 0 0 3px rgba(244,191,49,.07);
    }

    button{
      width:100%;
      margin-top:25px;
      padding:15px;

      border:0;
      border-radius:9px;

      background:linear-gradient(135deg,var(--gold2),var(--gold));

      color:#17120a;
      font-size:12px;
      font-weight:900;

      cursor:pointer;
    }

    button:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .mensagem{
      display:none;
      margin-top:15px;
      padding:12px;

      border-radius:8px;
      text-align:center;

      font-size:12px;
      line-height:1.5;
    }

    .mensagem.error{
      display:block;
      background:rgba(255,86,63,.12);
      color:#ff8f7b;
      border:1px solid rgba(255,86,63,.3);
    }

    .mensagem.success{
      display:block;
      background:rgba(72,213,151,.12);
      color:var(--green);
      border:1px solid rgba(72,213,151,.3);
    }

    .divider{
      height:1px;
      margin:28px 0;
      background:var(--line);
    }

    .register-area{
      text-align:center;
    }

    .register-area p{
      margin:0 0 14px;
      color:var(--muted);
      font-size:12px;
    }

    .register-link{
      display:block;
      width:100%;
      padding:14px;

      border:1px solid var(--gold);
      border-radius:9px;

      color:var(--gold);
      background:transparent;

      text-decoration:none;

      font-size:11px;
      font-weight:900;
    }

    .register-link:hover{
      background:#18140a;
    }

    .back-home{
      display:block;
      margin-top:25px;

      text-align:center;
      color:#777;

      text-decoration:none;
      font-size:11px;
    }

    .back-home:hover{
      color:var(--gold);
    }

    @media(max-width:500px){

      body{
        padding:15px;
      }

      .box{
        padding:30px 20px;
      }

      .logo{
        font-size:24px;
      }

      h1{
        font-size:21px;
      }

    }
  </style>
</head>

<body>

  <main class="box">

    <div class="logo">
      👑 KUDURO PRIME
    </div>

    <h1>
      ENTRAR NA ÁREA DO ARTISTA
    </h1>

    <p class="sub">
      Entra com a tua conta e começa a usar
      o KUDURO PRIME.
    </p>

    <form id="loginForm">

      <label for="email">
        GMAIL
      </label>

      <input
        type="email"
        id="email"
        placeholder="teuemail@gmail.com"
        autocomplete="email"
        required
      >

      <label for="password">
        PALAVRA-PASSE
      </label>

      <input
        type="password"
        id="password"
        placeholder="A tua palavra-passe"
        autocomplete="current-password"
        required
      >

      <button
        type="submit"
        id="loginBtn"
      >
        🔐 ENTRAR
      </button>

      <div
        class="mensagem"
        id="mensagem"
      ></div>

    </form>

    <div class="divider"></div>

    <div class="register-area">

      <p>
        Ainda não tens uma conta de artista?
      </p>

      <a
        href="juntar-se.html"
        class="register-link"
      >
        👑 CRIAR CONTA DE ARTISTA
      </a>

    </div>

    <a
      href="index.html"
      class="back-home"
    >
      ← VOLTAR PARA O KUDURO PRIME
    </a>

  </main>


  <!-- =========================================
       FIREBASE LOGIN
  ========================================== -->

  <script type="module">

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
      getAuth,
      setPersistence,
      browserLocalPersistence,
      signInWithEmailAndPassword
    } from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    /* =========================================
       CONFIGURAÇÃO FIREBASE
    ========================================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyDoitCcLeLDNBNPCP6fG1s_xbHr4UmohSo",

      authDomain:
        "kuduro-prime.firebaseapp.com",

      projectId:
        "kuduro-prime",

      storageBucket:
        "kuduro-prime.firebasestorage.app",

      messagingSenderId:
        "299776559545",

      appId:
        "1:299776559545:web:04aced1ba25391eb3fce68"

    };


    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const loginForm =
      document.getElementById("loginForm");


    const loginBtn =
      document.getElementById("loginBtn");


    const mensagem =
      document.getElementById("mensagem");


    /* =========================================
       MENSAGEM
    ========================================= */

    function showMessage(texto, tipo){

      mensagem.textContent = texto;

      mensagem.className =
        "mensagem " + tipo;

    }


    /* =========================================
       GARANTIR QUE A SESSÃO FICA GUARDADA
    ========================================= */

    setPersistence(
      auth,
      browserLocalPersistence
    )
    .then(() => {

      console.log(
        "Firebase: sessão persistente ativada."
      );

    })
    .catch((erro) => {

      console.error(
        "Erro ao ativar persistência:",
        erro
      );

    });


    /* =========================================
       LOGIN
    ========================================= */

    loginForm.addEventListener(
      "submit",
      async function(event){

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        if(!email || !password){

          showMessage(
            "Preenche o Gmail e a palavra-passe.",
            "error"
          );

          return;

        }


        loginBtn.disabled = true;

        loginBtn.textContent =
          "A ENTRAR...";


        try{

          console.log(
            "A tentar entrar:",
            email
          );


          /*
          ======================================
          LOGIN FIREBASE
          ======================================
          */

          const resultado =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            resultado.user;


          console.log(
            "LOGIN FIREBASE OK:",
            user.uid
          );


          /*
          ======================================
          GUARDAR DADOS DA SESSÃO
          ======================================
          */

          localStorage.setItem(
            "kpLoggedIn",
            "true"
          );


          localStorage.setItem(
            "kpArtistLoggedIn",
            "true"
          );


          localStorage.setItem(
            "kpArtistUID",
            user.uid
          );


          localStorage.setItem(
            "kpArtistEmail",
            user.email || email
          );


          /*
          ======================================
          NOME DO ARTISTA
          ======================================
          */

          const artistName =
            user.displayName ||
            localStorage.getItem(
              "kpArtistStageName"
            ) ||
            email.split("@")[0] ||
            "Artista Prime";


          localStorage.setItem(
            "kpArtistStageName",
            artistName
          );


          /*
          ======================================
          MÚSICAS DO ARTISTA
          ======================================
          */

          const songsKey =
            "kpArtistSongs_" + user.uid;


          if(
            !localStorage.getItem(songsKey)
          ){

            localStorage.setItem(
              songsKey,
              "[]"
            );

          }


          /*
          ======================================
          SUCESSO
          ======================================
          */

          showMessage(
            "Login feito com sucesso! 👑 A entrar no feed...",
            "success"
          );


          loginBtn.textContent =
            "✓ ENTRADA CONFIRMADA";


          /*
          ======================================
          IR DIRETAMENTE PARA O FEED

          IMPORTANTE:
          NÃO existe painel-do-artista aqui.
          ======================================
          */

          setTimeout(
            function(){

              console.log(
                "A abrir feed.html..."
              );

              window.location.replace(
                "./feed.html"
              );

            },
            700
          );

        }


        catch(erro){

          console.error(
            "ERRO COMPLETO NO LOGIN:",
            erro
          );


          let textoErro =
            "Não foi possível entrar. Tenta novamente.";


          switch(erro.code){

            case "auth/invalid-credential":

              textoErro =
                "Gmail ou palavra-passe incorretos.";

              break;


            case "auth/user-not-found":

              textoErro =
                "Não existe nenhuma conta com este Gmail.";

              break;


            case "auth/wrong-password":

              textoErro =
                "A palavra-passe está incorreta.";

              break;


            case "auth/invalid-email":

              textoErro =
                "Introduz um Gmail válido.";

              break;


            case "auth/too-many-requests":

              textoErro =
                "Muitas tentativas. Aguarda um pouco.";

              break;


            case "auth/network-request-failed":

              textoErro =
                "Erro de ligação. Verifica a internet.";

              break;


            case "auth/unauthorized-domain":

              textoErro =
                "Este domínio não está autorizado no Firebase.";

              break;


            case "auth/operation-not-allowed":

              textoErro =
                "O login por email ainda não está ativado no Firebase.";

              break;


            case "auth/user-disabled":

              textoErro =
                "Esta conta foi desativada.";

              break;


            default:

              textoErro =
                "Erro Firebase: " +
                (erro.code || "desconhecido");

          }


          showMessage(
            textoErro,
            "error"
          );


          loginBtn.disabled =
            false;


          loginBtn.textContent =
            "🔐 ENTRAR";

        }

      }
    );

  </script>

</body>
</html>
