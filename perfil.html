<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Perfil do Artista | KUDURO PRIME</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #111;
  border-bottom: 2px solid #d4af37;
  padding: 15px 25px;
}

.logo {
  color: #d4af37;
  text-decoration: none;
  font-size: 24px;
  font-weight: bold;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 40px 20px;
}

.voltar {
  color: #d4af37;
  text-decoration: none;
  display: inline-block;
  margin-bottom: 30px;
}

.perfil {
  background: #151515;
  border: 1px solid #333;
  border-radius: 20px;
  padding: 35px;
}

.cabecalho-perfil {
  display: flex;
  align-items: center;
  gap: 25px;
  border-bottom: 1px solid #333;
  padding-bottom: 30px;
}

.foto {
  width: 180px;
  height: 180px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid #d4af37;
}

.nome {
  color: #d4af37;
  font-size: 36px;
  margin: 0 0 10px;
}

.provincia {
  color: #aaa;
  font-size: 18px;
}

.secao {
  margin-top: 35px;
}

.secao h2 {
  color: #d4af37;
}

.secao p {
  color: #ccc;
  line-height: 1.7;
}

.redes {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.redes a {
  background: #222;
  border: 1px solid #444;
  color: white;
  padding: 12px 18px;
  border-radius: 8px;
  text-decoration: none;
}

.redes a:hover {
  border-color: #d4af37;
  color: #d4af37;
}

.musica {
  background: #0d0d0d;
  border: 1px solid #333;
  border-radius: 12px;
  padding: 20px;
}

.musica a {
  color: #d4af37;
  text-decoration: none;
  font-weight: bold;
}

#carregando {
  text-align: center;
  color: #d4af37;
  padding: 60px;
}

@media (max-width: 600px) {

  .cabecalho-perfil {
    flex-direction: column;
    text-align: center;
  }

  .nome {
    font-size: 28px;
  }

  .perfil {
    padding: 20px;
  }
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="logo">👑 KUDURO PRIME</a>
</header>

<main>

<a href="painel-do-artista.html" class="voltar">
← VOLTAR AO PAINEL
</a>

<div id="carregando">
  A carregar perfil... 👑
</div>

<div id="perfil" class="perfil" style="display: none;">

  <div class="cabecalho-perfil">

    <img id="foto" class="foto" src="" alt="Foto do artista">

    <div>
      <h1 id="nome" class="nome"></h1>
      <div id="provincia" class="provincia"></div>
    </div>

  </div>

  <div class="secao">
    <h2>👤 SOBRE O ARTISTA</h2>
    <p id="bio"></p>
  </div>

  <div class="secao">
    <h2>🎵 MÚSICA EM DESTAQUE</h2>

    <div class="musica">
      <a id="musica" href="#" target="_blank">
        ▶ OUVIR MÚSICA
      </a>
    </div>
  </div>

  <div class="secao">
    <h2>🌐 REDES SOCIAIS</h2>

    <div class="redes">

      <a id="whatsapp" href="#" target="_blank">
        💬 WHATSAPP
      </a>

      <a id="instagram" href="#" target="_blank">
        📸 INSTAGRAM
      </a>

      <a id="tiktok" href="#" target="_blank">
        🎵 TIKTOK
      </a>

    </div>
  </div>

</div>

</main>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDoitCcLeLDNBNPCP6fG1s_xbHr4UmohSo",
  authDomain: "kuduro-prime.firebaseapp.com",
  projectId: "kuduro-prime",
  storageBucket: "kuduro-prime.firebasestorage.app",
  messagingSenderId: "299776559545",
  appId: "1:299776559545:web:04aced1ba25391eb3fce68"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const carregando =
  document.getElementById("carregando");

const perfil =
  document.getElementById("perfil");

onAuthStateChanged(auth, async (user) => {

  if (!user) {

    window.location.href =
      "area-do-artista.html";

    return;
  }

  try {

    const perfilRef =
      doc(db, "artistas", user.uid);

    const perfilDoc =
      await getDoc(perfilRef);

    if (!perfilDoc.exists()) {

      window.location.href =
        "criar-perfil.html";

      return;
    }

    const dados = perfilDoc.data();

    document.getElementById("foto").src =
      dados.foto || "";

    document.getElementById("nome").textContent =
      dados.nome || "Artista";

    document.getElementById("provincia").textContent =
      "📍 " + (dados.provincia || "");

    document.getElementById("bio").textContent =
      dados.bio || "";

    const musica =
      document.getElementById("musica");

    if (dados.musica) {

      musica.href = dados.musica;

    } else {

      musica.parentElement.style.display =
        "none";

    }

    const whatsapp =
      document.getElementById("whatsapp");

    if (dados.whatsapp) {

      const numero =
        dados.whatsapp.replace(/\D/g, "");

      whatsapp.href =
        "https://wa.me/" + numero;

    } else {

      whatsapp.style.display = "none";

    }

    const instagram =
      document.getElementById("instagram");

    if (dados.instagram) {

      instagram.href = dados.instagram;

    } else {

      instagram.style.display = "none";

    }

    const tiktok =
      document.getElementById("tiktok");

    if (dados.tiktok) {

      tiktok.href = dados.tiktok;

    } else {

      tiktok.style.display = "none";

    }

    carregando.style.display = "none";

    perfil.style.display = "block";

  } catch (erro) {

    console.error(erro);

    carregando.textContent =
      "Erro ao carregar o perfil.";

  }

});

</script>

</body>
</html>
