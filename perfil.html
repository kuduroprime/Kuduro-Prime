<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Perfil do Artista | KUDURO PRIME</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: rgba(8,8,8,.95);
  border-bottom: 1px solid #333;
  padding: 17px 25px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  color: #d4af37;
  font-size: 25px;
  font-weight: bold;
  text-decoration: none;
}

.voltar {
  color: #d4af37;
  text-decoration: none;
}

.capa {
  min-height: 380px;
  display: flex;
  align-items: end;
  padding: 50px 30px;
  position: relative;

  background:
    linear-gradient(
      0deg,
      #080808 0%,
      rgba(8,8,8,.7) 25%,
      rgba(0,0,0,.15) 100%
    ),
    radial-gradient(
      circle at center,
      #4d3908,
      #151515
    );
}

.capa-conteudo {
  max-width: 1100px;
  width: 100%;
  margin: auto;
  display: flex;
  align-items: end;
  gap: 28px;
}

.foto {
  width: 210px;
  height: 210px;
  border-radius: 50%;
  object-fit: cover;
  border: 5px solid #d4af37;
  box-shadow: 0 0 40px rgba(212,175,55,.25);
}

.tipo {
  font-size: 13px;
  font-weight: bold;
  color: #d4af37;
}

.nome {
  margin: 10px 0;
  font-size: clamp(45px, 7vw, 95px);
  line-height: .95;
}

.local {
  color: #ccc;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 30px 25px 70px;
}

.acoes {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 40px;
}

.botao {
  border: none;
  border-radius: 25px;
  padding: 13px 23px;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
}

.ouvir {
  background: #d4af37;
  color: black;
}

.seguir {
  background: transparent;
  color: white;
  border: 1px solid #777;
}

.compartilhar {
  background: #222;
  color: #d4af37;
  border: 1px solid #444;
}

.secao {
  margin-top: 40px;
}

.secao h2 {
  color: #d4af37;
  font-size: 28px;
}

.bio {
  color: #bbb;
  line-height: 1.8;
  max-width: 800px;
}

.musicas {
  display: grid;
  gap: 10px;
}

.musica {
  background: #121212;
  border: 1px solid #252525;
  border-radius: 10px;
  padding: 15px;
}

.musica:hover {
  border-color: #d4af37;
}

.topo-musica {
  display: flex;
  align-items: center;
  gap: 15px;
}

.numero {
  color: #d4af37;
  font-size: 20px;
  min-width: 25px;
}

.detalhes {
  flex: 1;
}

.titulo {
  font-weight: bold;
  font-size: 17px;
}

.feat {
  color: #aaa;
  font-size: 13px;
  margin-top: 5px;
}

.play {
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  background: #d4af37;
  color: black;
  cursor: pointer;
  font-size: 16px;
}

audio {
  width: 100%;
  margin-top: 14px;
}

.redes {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.rede {
  background: #151515;
  color: white;
  border: 1px solid #333;
  padding: 12px 18px;
  border-radius: 8px;
  text-decoration: none;
}

#carregando {
  padding: 100px 20px;
  text-align: center;
  color: #d4af37;
}

.erro {
  text-align: center;
  padding: 80px 20px;
  color: #ff563f;
}

@media(max-width: 650px) {

  header {
    padding: 15px;
  }

  .capa {
    padding: 35px 20px;
    min-height: 500px;
  }

  .capa-conteudo {
    flex-direction: column;
    align-items: flex-start;
  }

  .foto {
    width: 150px;
    height: 150px;
  }

  .nome {
    font-size: 50px;
  }

  main {
    padding: 25px 15px 60px;
  }
}
</style>
</head>

<body>

<header>

  <a href="index.html" class="logo">
    👑 KUDURO PRIME
  </a>

</header>

<div id="carregando">
  A carregar o perfil do artista... 👑
</div>

<div id="pagina" style="display:none;">

  <section class="capa">

    <div class="capa-conteudo">

      <img
        id="foto"
        class="foto"
        alt="Foto do artista"
      >

      <div>

        <div class="tipo">
          ARTISTA VERIFICADO 👑
        </div>

        <h1
          id="nome"
          class="nome"
        ></h1>

        <div
          id="local"
          class="local"
        ></div>

      </div>

    </div>

  </section>

  <main>

    <div class="acoes">

      <button
        id="ouvirBtn"
        class="botao ouvir"
      >
        ▶ OUVIR
      </button>

      <button
        id="seguirBtn"
        class="botao seguir"
      >
        + SEGUIR
      </button>

      <button
        id="partilharBtn"
        class="botao partilhar"
      >
        ↗ PARTILHAR
      </button>

    </div>

    <section class="secao">

      <h2>👤 SOBRE</h2>

      <p
        id="bio"
        class="bio"
      ></p>

    </section>

    <section class="secao">

      <h2>🎵 MÚSICAS</h2>

      <div
        id="listaMusicas"
        class="musicas"
      ></div>

    </section>

    <section
      id="redesSecao"
      class="secao"
    >

      <h2>🌐 REDES SOCIAIS</h2>

      <div
        id="redes"
        class="redes"
      ></div>

    </section>

  </main>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDoitCcLeLDNBNPCP6fG1s_xbHr4UmohSo",
  authDomain: "kuduro-prime.firebaseapp.com",
  projectId: "kuduro-prime",
  storageBucket: "kuduro-prime.firebasestorage.app",
  messagingSenderId: "299776559545",
  appId: "1:299776559545:web:04aced1ba25391eb3fce68"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const parametros =
  new URLSearchParams(
    window.location.search
  );

const artistaId =
  parametros.get("id");

let primeiroAudio = null;

if (!artistaId) {

  mostrarErro(
    "Perfil de artista não encontrado."
  );

} else {

  carregarPerfil();

}

async function carregarPerfil() {

  try {

    const perfilDoc =
      await getDoc(
        doc(db, "artistas", artistaId)
      );

    if (!perfilDoc.exists()) {

      mostrarErro(
        "Este artista não existe."
      );

      return;

    }

    const dados =
      perfilDoc.data();

    document.getElementById("foto").src =
      dados.foto || "";

    document.getElementById("nome").textContent =
      dados.nome || "Artista";

    document.getElementById("local").textContent =
      "📍 " +
      (dados.provincia || "Angola");

    document.getElementById("bio").textContent =
      dados.bio ||
      "Este artista ainda não adicionou uma biografia.";

    document.title =
      (dados.nome || "Artista") +
      " | KUDURO PRIME";

    carregarRedes(dados);

    const consulta = query(
      collection(db, "musicas"),
      where(
        "artistaId",
        "==",
        artistaId
      )
    );

    const resultado =
      await getDocs(consulta);

    const lista =
      document.getElementById(
        "listaMusicas"
      );

    lista.innerHTML = "";

    if (resultado.empty) {

      lista.innerHTML =
        "<p style='color:#aaa'>Este artista ainda não publicou músicas.</p>";

    } else {

      let numero = 1;

      resultado.forEach(documento => {

        const musica =
          documento.data();

        const item =
          document.createElement("div");

        item.className =
          "musica";

        const topo =
          document.createElement("div");

        topo.className =
          "topo-musica";

        const numeroElemento =
          document.createElement("div");

        numeroElemento.className =
          "numero";

        numeroElemento.textContent =
          numero;

        const detalhes =
          document.createElement("div");

        detalhes.className =
          "detalhes";

        const titulo =
          document.createElement("div");

        titulo.className =
          "titulo";

        titulo.textContent =
          musica.titulo ||
          "Sem título";

        detalhes.appendChild(titulo);

        const participantes = [
          musica.feat1,
          musica.feat2,
          musica.feat3
        ]
        .filter(Boolean);

        if (participantes.length) {

          const feat =
            document.createElement("div");

          feat.className =
            "feat";

          feat.textContent =
            "Feat. " +
            participantes.join(", ");

          detalhes.appendChild(feat);

        }

        const play =
          document.createElement("button");

        play.className =
          "play";

        play.textContent =
          "▶";

        const audio =
          document.createElement("audio");

        audio.controls = true;
        audio.src =
          musica.audioURL;

        if (!primeiroAudio) {
          primeiroAudio = audio;
        }

        play.addEventListener(
          "click",
          () => {

            if (audio.paused) {

              document
                .querySelectorAll("audio")
                .forEach(a => {

                  if (a !== audio) {
                    a.pause();
                  }

                });

              audio.play();

            } else {

              audio.pause();

            }

          }
        );

        topo.appendChild(numeroElemento);
        topo.appendChild(detalhes);
        topo.appendChild(play);

        item.appendChild(topo);
        item.appendChild(audio);

        lista.appendChild(item);

        numero++;

      });

    }

    document
      .getElementById("ouvirBtn")
      .addEventListener(
        "click",
        () => {

          if (primeiroAudio) {

            primeiroAudio.play();

            primeiroAudio
              .scrollIntoView({
                behavior: "smooth",
                block: "center"
              });

          }

        }
      );

    document
      .getElementById("carregando")
      .style.display = "none";

    document
      .getElementById("pagina")
      .style.display = "block";

  } catch(erro){

  console.error("ERRO AO CARREGAR PERFIL:", erro);

  carregando.textContent =
    "Erro: " +
    (erro.code || erro.message || "Desconhecido");

}
  }

}

function carregarRedes(dados) {

  const redes =
    document.getElementById("redes");

  let quantidade = 0;

  if (dados.whatsapp) {

    const link =
      document.createElement("a");

    link.className = "rede";

    const numero =
      dados.whatsapp.replace(
        /\D/g,
        ""
      );

    link.href =
      "https://wa.me/" +
      numero;

    link.target = "_blank";

    link.textContent =
      "💬 WhatsApp";

    redes.appendChild(link);

    quantidade++;

  }

  if (dados.instagram) {

    const link =
      document.createElement("a");

    link.className = "rede";
    link.href = dados.instagram;
    link.target = "_blank";

    link.textContent =
      "📸 Instagram";

    redes.appendChild(link);

    quantidade++;

  }

  if (dados.tiktok) {

    const link =
      document.createElement("a");

    link.className = "rede";
    link.href = dados.tiktok;
    link.target = "_blank";

    link.textContent =
      "🎵 TikTok";

    redes.appendChild(link);

    quantidade++;

  }

  if (!quantidade) {

    document
      .getElementById("redesSecao")
      .style.display = "none";

  }

}

function mostrarErro(texto) {

  const carregando =
    document.getElementById(
      "carregando"
    );

  carregando.className =
    "erro";

  carregando.textContent =
    texto;

}

document
  .getElementById("seguirBtn")
  .addEventListener(
    "click",
    function() {

      if (
        this.textContent ===
        "+ SEGUIR"
      ) {

        this.textContent =
          "✓ A SEGUIR";

      } else {

        this.textContent =
          "+ SEGUIR";

      }

    }
  );

document
  .getElementById("partilharBtn")
  .addEventListener(
    "click",
    async () => {

      try {

        await navigator.clipboard.writeText(
          window.location.href
        );

        alert(
          "Link do perfil copiado!"
        );

      } catch {

        prompt(
          "Copia este link:",
          window.location.href
        );

      }

    }
  );

</script>

</body>
</html>
