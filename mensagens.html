<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mensagens — KUDURO PRIME</title>

  <style>
    :root{
      --bg:#070707;
      --panel:#101010;
      --panel2:#151515;
      --panel3:#1b1b1b;
      --gold:#f4bf31;
      --gold2:#ffdc6b;
      --text:#f7f4ed;
      --muted:#aaa59a;
      --line:#292929;
      --danger:#ff563f;
      --green:#39d98a;
      --blue:#4eb8ff;
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      padding:0;
      width:100%;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      overflow-x:hidden;
    }

    button,
    input,
    textarea{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    /* ==============================
       HEADER
    =============================== */

    .topbar{
      height:70px;
      border-bottom:1px solid var(--line);
      background:#090909;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 22px;
      position:sticky;
      top:0;
      z-index:100;
    }

    .brand{
      font-size:20px;
      font-weight:900;
      letter-spacing:.5px;
    }

    .brand span{
      color:var(--gold);
    }

    .top-actions{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .top-btn{
      border:1px solid var(--line);
      background:var(--panel);
      color:var(--text);
      padding:10px 14px;
      border-radius:10px;
      font-weight:700;
    }

    .top-btn:hover{
      border-color:var(--gold);
      color:var(--gold);
    }

    /* ==============================
       LAYOUT
    =============================== */

    .page{
      height:calc(100vh - 70px);
      display:grid;
      grid-template-columns:300px minmax(0,1fr);
      overflow:hidden;
    }

    /* ==============================
       LEFT
    =============================== */

    .sidebar{
      border-right:1px solid var(--line);
      background:#0b0b0b;
      display:flex;
      flex-direction:column;
      min-width:0;
    }

    .sidebar-head{
      padding:18px;
      border-bottom:1px solid var(--line);
    }

    .sidebar-title{
      font-size:20px;
      font-weight:900;
      margin-bottom:14px;
    }

    .new-message-btn{
      width:100%;
      border:0;
      border-radius:10px;
      padding:12px;
      background:var(--gold);
      color:#111;
      font-weight:900;
    }

    .new-message-btn:hover{
      background:var(--gold2);
    }

    .search-box{
      padding:12px 14px;
      border-bottom:1px solid var(--line);
    }

    .search-box input{
      width:100%;
      border:1px solid var(--line);
      outline:none;
      background:var(--panel);
      color:var(--text);
      padding:11px 12px;
      border-radius:10px;
    }

    .search-box input:focus{
      border-color:var(--gold);
    }

    .conversation-list{
      flex:1;
      overflow-y:auto;
    }

    .conversation-item{
      display:flex;
      align-items:center;
      gap:11px;
      padding:13px 15px;
      border-bottom:1px solid #191919;
      cursor:pointer;
      transition:.15s;
    }

    .conversation-item:hover{
      background:#121212;
    }

    .conversation-item.active{
      background:#171717;
      border-left:3px solid var(--gold);
      padding-left:12px;
    }

    .avatar{
      width:46px;
      height:46px;
      border-radius:50%;
      overflow:hidden;
      background:#222;
      flex:0 0 46px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      color:var(--gold);
      border:1px solid #333;
    }

    .avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .conversation-info{
      min-width:0;
      flex:1;
    }

    .conversation-top{
      display:flex;
      justify-content:space-between;
      gap:8px;
      align-items:center;
    }

    .conversation-name{
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .conversation-time{
      font-size:11px;
      color:var(--muted);
      flex:0 0 auto;
    }

    .conversation-preview{
      margin-top:5px;
      color:var(--muted);
      font-size:13px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .conversation-bottom{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }

    .unread-badge{
      min-width:20px;
      height:20px;
      border-radius:20px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 6px;
      background:var(--gold);
      color:#111;
      font-size:11px;
      font-weight:900;
    }

    .empty-conversations{
      padding:30px 18px;
      text-align:center;
      color:var(--muted);
      line-height:1.5;
    }

    /* ==============================
       CHAT
    =============================== */

    .chat{
      min-width:0;
      display:flex;
      flex-direction:column;
      background:#080808;
    }

    .chat-empty{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:var(--muted);
      padding:30px;
    }

    .chat-empty strong{
      display:block;
      color:var(--text);
      font-size:20px;
      margin-bottom:8px;
    }

    .chat-header{
      min-height:78px;
      border-bottom:1px solid var(--line);
      background:#0d0d0d;
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px 18px;
    }

    .chat-user-info{
      min-width:0;
      flex:1;
    }

    .chat-user-name{
      font-size:17px;
      font-weight:900;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .chat-status-row{
      display:flex;
      align-items:center;
      gap:7px;
      margin-top:4px;
    }

    .online-lamp{
      width:9px;
      height:9px;
      border-radius:50%;
      display:inline-block;
      background:#555;
    }

    .online-lamp.online{
      background:var(--green);
      box-shadow:0 0 8px rgba(57,217,138,.6);
    }

    .online-lamp.offline{
      background:#555;
    }

    .chat-status{
      font-size:12px;
      color:var(--muted);
    }

    .chat-actions{
      display:flex;
      gap:7px;
    }

    .chat-action{
      border:1px solid var(--line);
      background:var(--panel);
      color:var(--text);
      border-radius:9px;
      padding:9px 10px;
    }

    .chat-action:hover{
      border-color:var(--gold);
      color:var(--gold);
    }

    /* ==============================
       MESSAGES
    =============================== */

    .messages{
      flex:1;
      overflow-y:auto;
      padding:20px;
      display:flex;
      flex-direction:column;
      gap:9px;
    }

    .message-row{
      display:flex;
      width:100%;
    }

    .message-row.mine{
      justify-content:flex-end;
    }

    .message-row.theirs{
      justify-content:flex-start;
    }

    .message-bubble{
      max-width:min(72%,620px);
      padding:10px 13px;
      border-radius:15px;
      line-height:1.4;
      word-break:break-word;
      position:relative;
    }

    .mine .message-bubble{
      background:var(--gold);
      color:#111;
      border-bottom-right-radius:4px;
    }

    .theirs .message-bubble{
      background:#1a1a1a;
      border:1px solid #292929;
      color:var(--text);
      border-bottom-left-radius:4px;
    }

    .message-text{
      white-space:pre-wrap;
      font-size:15px;
    }

    .message-meta{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:5px;
      margin-top:5px;
      font-size:10px;
      opacity:.7;
    }

    .message-media{
      max-width:100%;
      border-radius:10px;
      display:block;
    }

    .message-image{
      max-height:350px;
    }

    .message-video{
      max-height:350px;
      width:100%;
    }

    .message-audio{
      max-width:280px;
    }

    .file-link{
      display:inline-flex;
      align-items:center;
      gap:7px;
      border:1px solid currentColor;
      padding:8px 10px;
      border-radius:8px;
      font-weight:700;
    }

    .loading-messages{
      text-align:center;
      color:var(--muted);
      padding:20px;
    }

    /* ==============================
       COMPOSER
    =============================== */

    .composer{
      border-top:1px solid var(--line);
      background:#0d0d0d;
      padding:12px;
    }

    .temporary-bar{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:9px;
      flex-wrap:wrap;
    }

    .temporary-label{
      font-size:12px;
      color:var(--muted);
    }

    .temporary-select{
      border:1px solid var(--line);
      background:var(--panel);
      color:var(--text);
      border-radius:8px;
      padding:6px 9px;
      font-size:12px;
    }

    .composer-row{
      display:flex;
      align-items:flex-end;
      gap:8px;
    }

    .message-input{
      flex:1;
      min-height:45px;
      max-height:140px;
      resize:none;
      border:1px solid var(--line);
      outline:none;
      background:#151515;
      color:var(--text);
      padding:12px;
      border-radius:12px;
    }

    .message-input:focus{
      border-color:var(--gold);
    }

    .send-btn{
      width:48px;
      height:45px;
      border:0;
      border-radius:11px;
      background:var(--gold);
      color:#111;
      font-size:18px;
      font-weight:900;
    }

    .send-btn:hover{
      background:var(--gold2);
    }

    .send-btn:disabled{
      opacity:.5;
      cursor:not-allowed;
    }

    .media-actions{
      display:flex;
      gap:6px;
    }

    .media-btn{
      width:40px;
      height:40px;
      border-radius:9px;
      border:1px solid var(--line);
      background:var(--panel);
      color:var(--text);
    }

    .media-btn:hover{
      border-color:var(--gold);
      color:var(--gold);
    }

    .upload-status{
      display:none;
      margin-top:8px;
      color:var(--muted);
      font-size:12px;
    }

    .upload-status.show{
      display:block;
    }

    /* ==============================
       MODAL
    =============================== */

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.72);
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:500;
    }

    .modal.show{
      display:flex;
    }

    .modal-box{
      width:min(520px,100%);
      max-height:85vh;
      overflow:hidden;
      background:#111;
      border:1px solid var(--line);
      border-radius:15px;
      box-shadow:0 20px 70px rgba(0,0,0,.5);
    }

    .modal-head{
      padding:15px 17px;
      border-bottom:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .modal-title{
      font-size:18px;
      font-weight:900;
    }

    .close-modal{
      border:0;
      background:none;
      color:var(--muted);
      font-size:22px;
    }

    .artist-list{
      max-height:65vh;
      overflow-y:auto;
    }

    .artist-option{
      display:flex;
      align-items:center;
      gap:12px;
      padding:13px 16px;
      border-bottom:1px solid #202020;
      cursor:pointer;
    }

    .artist-option:hover{
      background:#181818;
    }

    .artist-option-info{
      min-width:0;
    }

    .artist-option-name{
      font-weight:800;
    }

    .artist-option-email{
      color:var(--muted);
      font-size:12px;
      margin-top:3px;
    }

    .toast-container{
      position:fixed;
      right:18px;
      bottom:18px;
      z-index:1000;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .toast{
      background:#171717;
      color:var(--text);
      border:1px solid var(--line);
      padding:11px 14px;
      border-radius:10px;
      box-shadow:0 10px 35px rgba(0,0,0,.4);
      font-size:13px;
      max-width:340px;
    }

    .toast.success{
      border-color:var(--green);
    }

    .toast.error{
      border-color:var(--danger);
    }

    /* ==============================
       MOBILE
    =============================== */

    @media(max-width:850px){

      .page{
        grid-template-columns:1fr;
      }

      .sidebar{
        display:none;
      }

      .chat{
        height:calc(100vh - 70px);
      }

      .message-bubble{
        max-width:85%;
      }

      .topbar{
        padding:0 12px;
      }

      .brand{
        font-size:17px;
      }
    }
  </style>
</head>

    <!-- ==============================

    <section class="chat">

      <div

        <div>

          <strong>
            💬 As tuas mensagens

          Escolhe uma conversa ou começa uma nova mensagem.

        </div>

      </div>


      <div
        id="chatContent"
        style="display:none;height:100%;min-height:0;flex-direction:column;">

        <!-- CHAT HEADER -->

        <div class="chat-header">

          <div

          <div class="chat-user-info">

            <div class="chat-status-row">

              <div

                Offline
              </div>

            </div>

          </div>


          <div class="chat-actions">

            <button
              type="button"
              class="chat-action"
              id="profileBtn">
              👤 Perfil
            </button>

          </div>

        </div>


        <!-- MESSAGES -->

        <div
          class="messages"
          id="messages">

          <div class="loading-messages">
            A carregar mensagens...
          </div>

        </div>


        <!-- COMPOSER -->

        <div class="composer">

          <div class="temporary-bar">

            <span class="temporary-label">
              ⏳ Mensagem temporária:
            </span>

            <select
              class="temporary-select"
              id="temporaryMode">

              <option value="off">
                Normal
              </option>

              <option value="24h">
                24 horas
              </option>

              <option value="7d">
                7 dias
              </option>

              <option value="90d">
                90 dias
              </option>

            </select>

          </div>


          <div class="composer-row">

            <div class="media-actions">

              <button
                type="button"
                class="media-btn"
                id="imageBtn"
                title="Imagem">
                🖼️
              </button>

              <button
                type="button"
                class="media-btn"
                id="fileBtn"
                title="Ficheiro">
                📎
              </button>

            </div>


            <textarea
              id="messageInput"
              class="message-input"
              rows="1"
              placeholder="Escreve uma mensagem..."></textarea>


            <button
              type="button"
              class="send-btn"
              id="sendBtn">
              ➤
            </button>

          </div>


          <div
            class="upload-status"
            id="uploadStatus">
            A enviar...
          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- ==============================
       MODAL NOVA MENSAGEM
  =============================== -->

  <div
    class="modal"
    id="artistModal">

    <div class="modal-box">

      <div class="modal-head">

        <div class="modal-title">
          Nova mensagem
        </div>

        <button
          type="button"
          class="close-modal"
          id="closeArtistModal">
          ×
        </button>

      </div>


      <div
        class="search-box"
        style="border-bottom:1px solid var(--line);">

        <input
          type="search"
          id="artistSearch"
          placeholder="Pesquisar artista...">

      </div>


      <div
        class="artist-list"
        id="artistList">

        <div class="empty-conversations">
          A carregar artistas...
        </div>

      </div>

    </div>

  </div>


  <!-- ==============================
       INPUTS ESCONDIDOS
  =============================== -->

  <input
    type="file"
    id="imageInput"
    accept="image/*"
    hidden>

  <input
    type="file"
    id="fileInput"
    hidden>

    class="toast-container"

      );

      setTimeout(() => {

        toast.remove();

      }, 3500);
    }


    /* ==============================
       ESCAPE HTML
    =============================== */

    function escapeHTML(value){

      return String(
        value ?? ""
      )
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
    }


    /* ==============================
       CHAT ID
    =============================== */

    function createChatID(
      uid1,
      uid2
    ){

      return [
        uid1,
        uid2
      ]
      .sort()
      .join("_");

    }

    =============================== */

    function getProfilePhoto(
      artist
    ){

      if(!artist){

      return (
        artist.foto ||

        artist.avatar ||
        artist.imagem ||

    /* ==============================
       AVATAR HTML
    =============================== */

    function avatarHTML(
      artist,
      sizeClass = ""
    ){

      const photo =
        getProfilePhoto(
          artist
        );

      const name =
        getArtistName(
          artist
        );

      const initial =
        name
          .trim()
          .charAt(0)
          .toUpperCase() || "U";


      if(photo){

        return `
          <div class="avatar ${sizeClass}">
            <img
              src="${escapeHTML(photo)}"
              alt="${escapeHTML(name)}"
              onerror="this.parentElement.innerHTML='${initial}'">
          </div>
        `;

      }

      return `
        <div class="avatar ${sizeClass}">
          ${escapeHTML(initial)}
        </div>
      `;

    }


    /* ==============================
       FORMAT DATE
    =============================== */

    function formatDate(
      timestamp
    ){

      if(!timestamp){
        return "";
      }

      let date = null;

      if(
        typeof timestamp.toDate ===
        "function"
      ){

        date =
          timestamp.toDate();

      }else if(
        timestamp instanceof Date
      ){

        date =
          timestamp;

      }else{

        return "";

      }


      const now =
        new Date();

      const sameDay =
        date.toDateString() ===
        now.toDateString();


      if(sameDay){

        return date.toLocaleTimeString(
          "pt-PT",
          {
            hour:"2-digit",
            minute:"2-digit"
          }
        );

      }


      return date.toLocaleDateString(
        "pt-PT",
        {
          day:"2-digit",
          month:"2-digit"
        }
      );

    }


    /* ==============================
       MESSAGE PREVIEW
    =============================== */

    function getMessagePreview(
      data
    ){

      if(!data){
        return "";
      }

      if(
        data.type === "image"
      ){
        return "🖼️ Imagem";
      }

      if(
        data.type === "video"
      ){
        return "🎥 Vídeo";
      }

      if(
        data.type === "audio"
      ){
        return "🎵 Áudio";
      }

      if(
        data.type === "file"
      ){
        return "📎 Ficheiro";
      }

      return (
        data.text ||
        data.lastMessage ||
        ""
      );

    }

          await getDocs(
            collection(

          );

        snap.forEach(

              docSnap.data();


            if(
              data.ativo === false
            ){

            allArtists.push({

    /* ==============================
       CONVERSATIONS LISTENER
    =============================== */

    function listenConversations(){

      if(
        unsubscribeConversations
      ){

        unsubscribeConversations();

        unsubscribeConversations =
          null;

      }


      const q =
        query(
          collection(
            db,
            "conversas"
          ),
          where(
            "participants",
            "array-contains",
            firebaseUser.uid
          )
        );


      unsubscribeConversations =
        onSnapshot(
          q,
          async snapshot => {

            const conversations =
              [];


            for(
              const docSnap
              of snapshot.docs
            ){

              const data =
                docSnap.data();


              const participants =
                Array.isArray(
                  data.participants
                )
                ? data.participants
                : [];


              const otherUID =
                participants.find(
                  uid =>
                    uid !==
                    firebaseUser.uid
                );


              if(!otherUID){
                continue;
              }


              let artist =
                allArtists.find(
                  a =>
                    a.uid ===
                    otherUID
                );


              if(!artist){

                try{

                  const artistSnap =
                    await getDoc(
                      doc(
                        db,
                        "artistas",
                        otherUID
                      )
                    );


                  if(
                    artistSnap.exists()
                  ){

                    artist = {

                      uid:
                        otherUID,

                      ...artistSnap.data()

                    };

                  }

                }catch(error){

                  console.warn(
                    "Erro ao buscar artista:",
                    error
                  );

                }

              }


              if(!artist){

                const names =
                  data.participantNames ||
                  {};

                artist = {

                  uid:
                    otherUID,

                  nome:
                    names[otherUID] ||
                    "Utilizador"

                };

              }


              conversations.push({

                id:
                  docSnap.id,

                data,

                artist,

                otherUID

              });

            }


            conversations.sort(
              (a,b) => {

                const aTime =
                  a.data.lastMessageAt
                    ?.toMillis?.() ||
                  a.data.createdAt
                    ?.toMillis?.() ||
                  0;

                const bTime =
                  b.data.lastMessageAt
                    ?.toMillis?.() ||
                  b.data.createdAt
                    ?.toMillis?.() ||
                  0;

                return bTime - aTime;

              }
            );


            allConversations =
              conversations;


            renderConversations(
              conversationSearch.value
            );

          },

          error => {

            console.error(
              "Erro no listener de conversas:",
              error
            );

            conversationList.innerHTML = `

              <div class="empty-conversations">

                Não foi possível carregar
                as conversas.

              </div>

            `;

            showToast(
              "Erro ao carregar conversas. Verifica as Rules.",
              "error"
            );

          }
        );

    }


    /* ==============================
       RENDER CONVERSATIONS
    =============================== */

    function renderConversations(
      search = ""
    ){

      const term =
        search
          .trim()
          .toLowerCase();


      const filtered =
        allConversations.filter(
          conversation => {

            if(!term){
              return true;
            }


            const name =
              getArtistName(
                conversation.artist
              ).toLowerCase();


            const preview =
              getMessagePreview(
                conversation.data
              ).toLowerCase();


            return (
              name.includes(term) ||
              preview.includes(term)
            );

          }
        );


      if(!filtered.length){

        conversationList.innerHTML = `

          <div class="empty-conversations">

            Ainda não tens conversas.

            <br><br>

            Clica em
            <strong>
              ＋ Nova mensagem
            </strong>
            para começar.

          </div>

        `;

        return;

      }


      conversationList.innerHTML =
        filtered
          .map(
            conversation => {

              const artist =
                conversation.artist;

              const name =
                getArtistName(
                  artist
                );

              const preview =
                getMessagePreview(
                  conversation.data
                ) ||
                "Nenhuma mensagem";

              const time =
                formatDate(
                  conversation.data.lastMessageAt
                );


              const unreadObj =
                conversation.data.unreadCount ||
                {};

              const unread =
                Number(
                  unreadObj[
                    firebaseUser.uid
                  ] || 0
                );


              const active =
                conversation.id ===
                currentChatID
                ? "active"
                : "";


              return `

                <div
                  class="conversation-item ${active}"
                  data-chat-id="${escapeHTML(conversation.id)}"
                  data-uid="${escapeHTML(artist.uid)}">

                  ${avatarHTML(artist)}

                  <div class="conversation-info">

                    <div class="conversation-top">

                      <div class="conversation-name">
                        ${escapeHTML(name)}
                      </div>

                      <div class="conversation-time">
                        ${escapeHTML(time)}
                      </div>

                    </div>


                    <div class="conversation-bottom">

                      <div class="conversation-preview">
                        ${escapeHTML(preview)}
                      </div>

                      ${
                        unread > 0

                        ? `

                          <div class="unread-badge">
                            ${unread > 99 ? "99+" : unread}
                          </div>

                        `

                        : ""

                      }

                    </div>

                  </div>

                </div>

              `;

            }
          )
          .join("");


      document
        .querySelectorAll(
          ".conversation-item"
        )
        .forEach(
          element => {

            element.addEventListener(
              "click",
              async () => {

                const uid =
                  element.dataset.uid;

                const chatID =
                  element.dataset.chatId;


                let artist =
                  allArtists.find(
                    a =>
                      a.uid === uid
                  );


                if(!artist){

                  const conversation =
                    allConversations.find(
                      c =>
                        c.id === chatID
                    );

                  artist =
                    conversation?.artist ||
                    {
                      uid,
                      nome:"Utilizador"
                    };

                }


                await openRealChat(
                  artist,
                  chatID
                );

              }
            );

          }
        );

    }

    /* ==============================
       PRESENCE
    =============================== */

    function listenPresence(
      uid
    ){

      if(
        unsubscribePresence
      ){

        unsubscribePresence();

        unsubscribePresence =
          null;

      }


      unsubscribePresence =
        onSnapshot(
          doc(
            db,
            "perfis",
            uid
          ),
          snapshot => {

            if(
              !snapshot.exists()
            ){

              chatOnline.className =
                "online-lamp offline";

              chatStatus.textContent =
                "Offline";

              return;

            }


            const data =
              snapshot.data();


            const online =
              data.online === true;


            chatOnline.className =
              online
                ? "online-lamp online"
                : "online-lamp offline";


            chatStatus.textContent =
              online
                ? "Online"
                : "Offline";

          },

          error => {

            console.warn(
              "Erro no estado online:",
              error
            );

            chatOnline.className =
              "online-lamp offline";

            chatStatus.textContent =
              "Offline";

          }
        );

    }


    /* ==============================
       LISTEN MESSAGES
    =============================== */

    function listenMessages(
      chatID
    ){

      if(
        unsubscribeMessages
      ){

        unsubscribeMessages();

        unsubscribeMessages =
          null;

      }


      messages.innerHTML = `

        <div class="loading-messages">
          A carregar mensagens...
        </div>

      `;


      const messagesRef =
        collection(
          db,
          "conversas",
          chatID,
          "mensagens"
        );


      const q =
        query(
          messagesRef,
          orderBy(
            "createdAt",
            "asc"
          )
        );


      unsubscribeMessages =
        onSnapshot(
          q,
          snapshot => {

            if(snapshot.empty){

              messages.innerHTML = `

                <div class="loading-messages">
                  Nenhuma mensagem ainda.
                  <br>
                  Envia a primeira mensagem. 🔥
                </div>

              `;

              return;

            }


            messages.innerHTML = "";


            snapshot.forEach(
              messageDoc => {

                renderMessage(
                  messageDoc.id,
                  messageDoc.data()
                );

              }
            );


            scrollMessagesToBottom();

          },

          error => {

            console.error(
              "Erro ao carregar mensagens:",
              error
            );

            messages.innerHTML = `

              <div class="loading-messages">

                Não foi possível carregar
                as mensagens.

              </div>

            `;

            showToast(
              "Erro ao carregar mensagens.",
              "error"
            );

          }
        );

    }


    /* ==============================
       RENDER MESSAGE
    =============================== */

    function renderMessage(
      messageID,
      data
    ){

      const mine =
        data.senderId ===
        firebaseUser.uid;


      const row =
        document.createElement(
          "div"
        );

      row.className =
        "message-row " +
        (
          mine
            ? "mine"
            : "theirs"
        );


      const bubble =
        document.createElement(
          "div"
        );

      bubble.className =
        "message-bubble";


      if(
        data.type ===
        "text"
      ){

        bubble.innerHTML = `

          <div class="message-text">
            ${escapeHTML(
              data.text || ""
            )}
          </div>

        `;

      }else if(
        data.type ===
        "image"
      ){

        bubble.innerHTML = `

          <img
            class="message-media message-image"
            src="${escapeHTML(
              data.url ||
              data.mediaURL ||
              ""
            )}"
            alt="Imagem">

        `;

      }else if(
        data.type ===
        "video"
      ){

        bubble.innerHTML = `

          <video
            class="message-media message-video"
            controls
            preload="metadata">

            <source
              src="${escapeHTML(
                data.url ||
                data.mediaURL ||
                ""
              )}">

          </video>

        `;

      }else if(
        data.type ===
        "audio"
      ){

        bubble.innerHTML = `

          <audio
            class="message-audio"
            controls>

            <source
              src="${escapeHTML(
                data.url ||
                data.mediaURL ||
                ""
              )}">

          </audio>

        `;

      }else if(
        data.type ===
        "file"
      ){

        const url =
          data.url ||
          data.mediaURL ||
          "";

        const name =
          data.fileName ||
          data.name ||
          "Ficheiro";


        bubble.innerHTML = `

          <a
            class="file-link"
            href="${escapeHTML(url)}"
            target="_blank"
            rel="noopener">

            📎
            ${escapeHTML(name)}

          </a>

        `;

      }else{

        bubble.innerHTML = `

          <div class="message-text">
            ${escapeHTML(
              data.text ||
              data.lastMessage ||
              ""
            )}
          </div>

        `;

      }


      const time =
        formatDate(
          data.createdAt
        );


      const meta =
        document.createElement(
          "div"
        );

      meta.className =
        "message-meta";


      meta.innerHTML =
        escapeHTML(
          time
        );


      if(
        mine &&
        data.readBy
      ){

        meta.innerHTML +=
          " ✓";

      }


      bubble.appendChild(
        meta
      );

      row.appendChild(
        bubble
      );

      messages.appendChild(
        row
      );

    }


    /* ==============================
       SCROLL
    =============================== */

    function scrollMessagesToBottom(){

      requestAnimationFrame(
        () => {

          messages.scrollTop =
            messages.scrollHeight;

        }
      );

    }


    /* ==============================
       MARK READ
    =============================== */

    async function markConversationRead(
      chatID
    ){

      if(!firebaseUser){
        return;
      }


      try{

        await updateDoc(
          doc(
            db,
            "conversas",
            chatID
          ),
          {

            [`unreadCount.${firebaseUser.uid}`]:
              0

          }
        );

      }catch(error){

        console.warn(
          "Erro ao marcar conversa como lida:",
          error
        );

      }

    }


    /* ==============================
       TEMPORARY EXPIRATION
    =============================== */

    function getExpirationDate(){

      const mode =
        temporaryMode.value;


      if(mode === "off"){
        return null;
      }


      const date =
        new Date();


      if(mode === "24h"){

        date.setHours(
          date.getHours() + 24
        );

      }else if(
        mode === "7d"
      ){

        date.setDate(
          date.getDate() + 7
        );

      }else if(
        mode === "90d"
      ){

        date.setDate(
          date.getDate() + 90
        );

      }


      return date;

    }


    /* ==============================
       SEND MESSAGE
    =============================== */

    window.sendMessage =
      async function(){

        if(
          sendingMessage
        ){
          return;
        }


        if(
          !firebaseUser
        ){

          showToast(
            "Precisas estar autenticado.",
            "error"
          );

          return;

        }


        if(
          !currentChatUID ||
          !currentChatID
        ){

          showToast(
            "Escolhe uma conversa primeiro.",
            "error"
          );

          return;

        }


        const text =
          messageInput.value
            .trim();


        if(!text){
          return;
        }


        if(text.length > 5000){

          showToast(
            "A mensagem é demasiado grande.",
            "error"
          );

          return;

        }


        sendingMessage =
          true;

        sendBtn.disabled =
          true;


        try{

          await sendFirebaseMessage({

            type:
              "text",

            text

          });


          messageInput.value =
            "";

          autoResizeTextarea();

        }catch(error){

          console.error(
            "ERRO AO ENVIAR TEXTO:",
            error
          );

          showToast(
            "Não foi possível enviar a mensagem: " +
            error.message,
            "error"
          );

        }finally{

          sendingMessage =
            false;

          sendBtn.disabled =
            false;

          messageInput.focus();

        }

      };


    /* ==============================
       SEND FIREBASE MESSAGE
    =============================== */

    async function sendFirebaseMessage(
      data
    ){

      if(
        !firebaseUser ||
        !currentChatUID ||
        !currentChatID
      ){

        throw new Error(
          "Conversa inválida."
        );

      }


      const conversationRef =
        doc(
          db,
          "conversas",
          currentChatID
        );


      const messageRef =
        doc(
          collection(
            db,
            "conversas",
            currentChatID,
            "mensagens"
          )
        );


      const conversationSnap =
        await getDoc(
          conversationRef
        );


      if(
        !conversationSnap.exists()
      ){

        throw new Error(
          "A conversa não existe."
        );

      }


      const conversation =
        conversationSnap.data();


      const participants =
        Array.isArray(
          conversation.participants
        )
        ? conversation.participants
        : [];


      if(
        !participants.includes(
          firebaseUser.uid
        )
      ){

        throw new Error(
          "Não és participante desta conversa."
        );

      }


      if(
        !participants.includes(
          currentChatUID
        )
      ){

        throw new Error(
          "Destinatário inválido."
        );

      }


      const receiverID =
        currentChatUID;


      const preview =
        getMessagePreview(
          data
        );


      const expiration =
        getExpirationDate();


      const batch =
        writeBatch(
          db
        );


      const messageData = {

        type:
          data.type,

        senderId:
          firebaseUser.uid,

        receiverId:
          receiverID,

        temporary:
          temporaryMode.value,

        createdAt:
          serverTimestamp(),

        expirationAt:
          expiration
            ? expiration
            : null

      };


      if(
        data.type ===
        "text"
      ){

        messageData.text =
          data.text;

      }


      if(data.url){

        messageData.url =
          data.url;

      }


      if(data.fileName){

        messageData.fileName =
          data.fileName;

      }


      if(data.name){

        messageData.name =
          data.name;

      }


      batch.set(
        messageRef,
        messageData
      );


      const unreadPath =
        `unreadCount.${receiverID}`;


      const senderUnreadPath =
        `unreadCount.${firebaseUser.uid}`;


      batch.update(
        conversationRef,
        {

          lastMessage:
            preview,

          lastMessageType:
            data.type,

          lastMessageAt:
            serverTimestamp(),

          temporaryMode:
            temporaryMode.value,

          [senderUnreadPath]:
            0,

          [unreadPath]:
            increment(1)

        }
      );


      await batch.commit();

    }


    /* ==============================
       PROFILE BUTTON
    =============================== */

    profileBtn.addEventListener(
      "click",
      () => {

        if(
          !currentChatUID
        ){
          return;
        }


        window.location.href =
          "perfil.html?id=" +
          encodeURIComponent(
            currentChatUID
          );

      }
    );


    /* ==============================
       NEW MESSAGE MODAL
    =============================== */

    function openArtistModal(){

      renderArtists(
        artistSearch.value
      );

      artistModal.classList.add(
        "show"
      );

      setTimeout(
        () =>
          artistSearch.focus(),
        50
      );

    }


    function closeArtistModalWindow(){

      artistModal.classList.remove(
        "show"
      );

    }


    newMessageBtn.addEventListener(
      "click",
      openArtistModal
    );


    closeArtistModal.addEventListener(
      "click",
      closeArtistModalWindow
    );


    artistModal.addEventListener(
      "click",
      event => {

        if(
          event.target ===
          artistModal
        ){

          closeArtistModalWindow();

        }

      }
    );


    artistSearch.addEventListener(
      "input",
      () => {

        renderArtists(
          artistSearch.value
        );

      }
    );


    /* ==============================
       CONVERSATION SEARCH
    =============================== */

    conversationSearch.addEventListener(
      "input",
      () => {

        renderConversations(
          conversationSearch.value
        );

      }
    );


    /* ==============================
       SEND BUTTON
    =============================== */

    sendBtn.addEventListener(
      "click",
      () => {

        window.sendMessage();

      }
    );


    /* ==============================
       ENTER TO SEND
    =============================== */

    messageInput.addEventListener(
      "keydown",
      event => {

        if(
          event.key === "Enter" &&
          !event.shiftKey
        ){

          event.preventDefault();

          window.sendMessage();

        }

      }
    );


    /* ==============================
       AUTO RESIZE
    =============================== */

    function autoResizeTextarea(){

      messageInput.style.height =
        "auto";

      messageInput.style.height =
        Math.min(
          messageInput.scrollHeight,
          140
        ) + "px";

    }


    messageInput.addEventListener(
      "input",
      autoResizeTextarea
    );


    /* ==============================
       TEMPORARY MODE
    =============================== */

    temporaryMode.addEventListener(
      "change",
      async () => {

        if(
          !currentChatID ||
          !firebaseUser
        ){
          return;
        }


        try{

          await updateDoc(
            doc(
              db,
              "conversas",
              currentChatID
            ),
            {

              temporaryMode:
                temporaryMode.value

            }
          );

        }catch(error){

          console.warn(
            "Erro ao atualizar modo temporário:",
            error
          );

        }

      }
    );


    /* ==============================
       MEDIA BUTTONS
    =============================== */

    imageBtn.addEventListener(
      "click",
      () => {

        imageInput.click();

      }
    );


    fileBtn.addEventListener(
      "click",
      () => {

        fileInput.click();

      }
    );


    imageInput.addEventListener(
      "change",
      () => {

        if(
          imageInput.files.length
        ){

          showToast(
            "O envio de imagens será ativado na próxima etapa."
          );

          imageInput.value =
            "";

        }

      }
    );


    fileInput.addEventListener(
      "change",
      () => {

        if(
          fileInput.files.length
        ){

          showToast(
            "O envio de ficheiros será ativado na próxima etapa."
          );

          fileInput.value =
            "";

        }

      }
    );


    /* ==============================
       LOGOUT
    =============================== */

    logoutBtn.addEventListener(
      "click",
      async () => {

        try{

          await setOffline();

        }catch(error){}


        try{

          await signOut(
            auth
          );

          window.location.href =
            "area-do-artista.html";

        }catch(error){

          console.error(
            error
          );

          showToast(
            "Erro ao sair.",
            "error"
          );

        }

      }
    );


    /* ==============================
       AUTH
    =============================== */

    onAuthStateChanged(
      auth,
      async user => {

        if(!user){

          window.location.href =
            "area-do-artista.html";

          return;

        }


        firebaseUser =
          user;


        await loadCurrentProfile();

        await setOnline();

        await loadArtists();

        listenConversations();


        /* ==========================
           ABRIR PERFIL DIRETO
        ========================== */

        const params =
          new URLSearchParams(
            window.location.search
          );


        const targetUID =
          params.get("uid") ||
          params.get("id") ||
          params.get("artistId") ||
          params.get("userId");


        if(targetUID){

          let artist =
            allArtists.find(
              a =>
                a.uid ===
                targetUID
            );


          if(!artist){

            try{

              const snap =
                await getDoc(
                  doc(
                    db,
                    "artistas",
                    targetUID
                  )
                );


              if(
                snap.exists()
              ){

                artist = {

                  uid:
                    targetUID,

                  ...snap.data()

                };

              }

            }catch(error){

              console.error(
                error
              );

            }

          }


          if(artist){

            const chatID =
              createChatID(
                firebaseUser.uid,
                artist.uid
              );


            await startNewConversation(
              artist
            );

          }

        }

      }
    );


    /* ==============================
       BEFORE UNLOAD
    =============================== */

    window.addEventListener(
      "beforeunload",
      () => {

        setOffline();

      }
    );

  </script>
