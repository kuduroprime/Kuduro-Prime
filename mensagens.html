<!DOCTYPE html>

<html lang="pt">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<title>Mensagens — KUDURO PRIME</title>

<style>

:root{
  --bg:#070707;
  --panel:#101010;
  --panel2:#151515;
  --panel3:#1b1b1b;
  --gold:#f4bf31;
  --gold2:#ffdc6b;
  --text:#f7f4ed;
  --muted:#aaa59a;
  --line:#292929;
  --green:#35d46f;
  --danger:#ff563f;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:
    Arial,
    Helvetica,
    sans-serif;
  overflow:hidden;
}


/* =====================================================
   FUNDO ANIMADO — ESTILO WHATSAPP
===================================================== */

body::before{
  content:"";

  position:fixed;

  inset:0;

  z-index:-3;

  pointer-events:none;

  background:
    radial-gradient(
      circle at 15% 20%,
      rgba(244,191,49,.055),
      transparent 24%
    ),
    radial-gradient(
      circle at 85% 75%,
      rgba(244,191,49,.035),
      transparent 28%
    ),
    #070707;
}


/* =====================================================
   PADRÃO DE FUNDO
===================================================== */

body::after{
  content:"";

  position:fixed;

  inset:-120px;

  z-index:-2;

  pointer-events:none;

  opacity:.16;

  background-image:

    radial-gradient(
      circle,
      rgba(244,191,49,.22) 1px,
      transparent 1.5px
    );

  background-size:
    42px 42px;

  transform:
    rotate(-7deg);

  animation:
    backgroundPatternMove
    28s
    linear
    infinite;
}


@keyframes backgroundPatternMove{

  0%{
    transform:
      translate3d(0,0,0)
      rotate(-7deg);
  }

  50%{
    transform:
      translate3d(25px,18px,0)
      rotate(-7deg);
  }

  100%{
    transform:
      translate3d(0,0,0)
      rotate(-7deg);
  }

}


/* =====================================================
   SÍMBOLOS FLUTUANTES
===================================================== */

.app::before{
  content:
    "♩  ♪  ♫  ♬  👑  ♩  ♪  ♫  🎧  ♬  🔥  ♪  ♩  ♫";

  position:fixed;

  top:-80px;
  left:-10%;

  width:120%;

  height:120%;

  z-index:-1;

  pointer-events:none;

  color:
    rgba(244,191,49,.055);

  font-size:26px;

  line-height:100px;

  letter-spacing:32px;

  word-spacing:35px;

  white-space:normal;

  transform:
    rotate(-8deg);

  animation:
    symbolsFloat
    35s
    ease-in-out
    infinite;
}


@keyframes symbolsFloat{

  0%{
    transform:
      translate3d(0,0,0)
      rotate(-8deg);
  }

  25%{
    transform:
      translate3d(-18px,25px,0)
      rotate(-7deg);
  }

  50%{
    transform:
      translate3d(12px,50px,0)
      rotate(-9deg);
  }

  75%{
    transform:
      translate3d(-10px,25px,0)
      rotate(-7deg);
  }

  100%{
    transform:
      translate3d(0,0,0)
      rotate(-8deg);
  }

}


/* =====================================================
   APP
===================================================== */

.app{
  height:100vh;
  display:flex;
  flex-direction:column;

  position:relative;
}


/* =====================================================
   HEADER
===================================================== */

.header{
  height:64px;

  background:
    rgba(11,11,11,.94);

  backdrop-filter:
    blur(10px);

  -webkit-backdrop-filter:
    blur(10px);

  border-bottom:1px solid var(--line);

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 22px;

  flex-shrink:0;

  position:relative;
  z-index:5;
}

.logo{
  color:var(--gold);
  font-size:18px;
  font-weight:1000;
  letter-spacing:.4px;
}

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.header-link{
  text-decoration:none;
  color:var(--text);

  border:1px solid var(--line);
  background:#121212;

  padding:9px 14px;
  border-radius:9px;

  font-size:12px;
  font-weight:900;

  transition:.2s;
}

.header-link:hover{
  border-color:var(--gold);
  color:var(--gold);
}

.logout-btn{
  border:1px solid #3a2724;
  background:#17100f;
  color:#ff8b7b;

  padding:9px 14px;
  border-radius:9px;

  font-size:12px;
  font-weight:900;

  cursor:pointer;
}


/* =====================================================
   MAIN
===================================================== */

.main{
  flex:1;
  min-height:0;

  display:grid;
  grid-template-columns:300px minmax(0,1fr);

  overflow:hidden;

  position:relative;
  z-index:1;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
  background:
    rgba(11,11,11,.88);

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);

  border-right:1px solid var(--line);

  display:flex;
  flex-direction:column;

  min-width:0;
  min-height:0;

  position:relative;
  z-index:2;
}

.sidebar-top{
  padding:18px;
  border-bottom:1px solid var(--line);
}

.new-message-btn{
  width:100%;

  border:0;

  background:
    linear-gradient(
      135deg,
      var(--gold2),
      var(--gold)
    );

  color:#15110a;

  padding:13px 16px;

  border-radius:10px;

  font-size:12px;
  font-weight:1000;

  cursor:pointer;

  transition:.2s;
}

.new-message-btn:hover{
  filter:brightness(1.08);
  transform:translateY(-1px);
}

.conversation-search{
  margin-top:14px;
}

.conversation-search input{
  width:100%;

  background:
    rgba(21,21,21,.88);

  border:1px solid var(--line);

  color:var(--text);

  outline:none;

  padding:11px 12px;

  border-radius:9px;

  font-size:12px;
}

.conversation-search input:focus{
  border-color:#735d22;
}

.conversation-list{
  flex:1;
  overflow-y:auto;
  min-height:0;
}

.conversation-list::-webkit-scrollbar,
.messages::-webkit-scrollbar,
.artist-results::-webkit-scrollbar{
  width:6px;
}

.conversation-list::-webkit-scrollbar-thumb,
.messages::-webkit-scrollbar-thumb,
.artist-results::-webkit-scrollbar-thumb{
  background:#292929;
  border-radius:20px;
}

.empty-conversations{
  padding:30px 18px;
  text-align:center;

  color:var(--muted);

  font-size:12px;
  line-height:1.6;
}

.conversation{
  padding:13px 14px;

  display:flex;
  align-items:center;

  gap:11px;

  border-bottom:1px solid #191919;

  cursor:pointer;

  transition:.18s;
}

.conversation:hover{
  background:#121212;
}

.conversation.active{
  background:#18150d;
  border-left:3px solid var(--gold);
  padding-left:11px;
}

.avatar{
  width:46px;
  height:46px;

  border-radius:50%;

  background:#202020;

  border:1px solid #4b3b18;

  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  flex-shrink:0;

  color:var(--gold);

  font-size:18px;
  font-weight:900;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.conversation-info{
  min-width:0;
  flex:1;
}

.conversation-name{
  display:flex;
  align-items:center;
  gap:6px;

  font-size:13px;
  font-weight:900;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.online-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#555;

  flex-shrink:0;
}

.online-dot.online{
  background:var(--green);
  box-shadow:
    0 0 7px
    rgba(53,212,111,.45);
}

.conversation-preview{
  margin-top:4px;

  color:var(--muted);

  font-size:11px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.conversation-time{
  color:#777;

  font-size:9px;

  flex-shrink:0;
}


/* =====================================================
   CHAT
===================================================== */

.chat{
  min-width:0;
  min-height:0;

  display:flex;
  flex-direction:column;

  background:
    rgba(8,8,8,.72);

  position:relative;
  z-index:2;
}


/* =====================================================
   PADRÃO DENTRO DO CHAT
===================================================== */

.chat::before{
  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  z-index:-1;

  opacity:.18;

  background-image:
    radial-gradient(
      circle,
      rgba(244,191,49,.16) 1px,
      transparent 1.5px
    );

  background-size:
    55px 55px;

  animation:
    chatPattern
    32s
    linear
    infinite;
}


@keyframes chatPattern{

  from{
    background-position:
      0 0;
  }

  to{
    background-position:
      110px 80px;
  }

}


/* =====================================================
   CHAT EMPTY
===================================================== */

.chat-empty{
  flex:1;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  padding:30px;
}

.chat-empty-box{
  max-width:420px;

  padding:25px;

  border-radius:18px;

  background:
    rgba(10,10,10,.58);

  border:
    1px solid
    rgba(244,191,49,.10);

  backdrop-filter:
    blur(5px);
}

.chat-empty-icon{
  font-size:55px;
  margin-bottom:15px;

  animation:
    emptyFloat
    4s
    ease-in-out
    infinite;
}


@keyframes emptyFloat{

  0%,
  100%{
    transform:
      translateY(0);
  }

  50%{
    transform:
      translateY(-7px);
  }

}

.chat-empty h2{
  color:var(--gold);
  font-size:20px;
  margin-bottom:9px;
}

.chat-empty p{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}


/* =====================================================
   CHAT HEADER
===================================================== */

.chat-header{
  height:76px;

  border-bottom:1px solid var(--line);

  background:
    rgba(12,12,12,.92);

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);

  padding:0 20px;

  display:none;
  align-items:center;

  gap:12px;

  flex-shrink:0;

  position:relative;
  z-index:3;
}

.chat-header.show{
  display:flex;
}

.chat-user{
  min-width:0;
  flex:1;
}

.chat-user-name{
  font-size:15px;
  font-weight:1000;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-user-status{
  margin-top:4px;

  color:var(--muted);

  font-size:11px;
}

.chat-profile-btn{
  border:1px solid var(--line);
  background:#151515;

  color:var(--text);

  padding:9px 12px;

  border-radius:8px;

  font-size:10px;
  font-weight:900;

  cursor:pointer;
}

.chat-profile-btn:hover{
  border-color:var(--gold);
  color:var(--gold);
}


/* =====================================================
   MESSAGES
===================================================== */

.messages{
  flex:1;

  min-height:0;

  overflow-y:auto;

  padding:22px;

  display:none;

  flex-direction:column;

  gap:9px;

  position:relative;
  z-index:2;
}

.messages.show{
  display:flex;
}

.message-row{
  display:flex;
  width:100%;
}

.message-row.mine{
  justify-content:flex-end;
}

.message-row.theirs{
  justify-content:flex-start;
}

.message-bubble{
  max-width:min(72%,520px);

  padding:10px 13px;

  border-radius:14px;

  background:
    rgba(23,23,23,.94);

  border:1px solid #262626;

  color:var(--text);

  font-size:13px;

  line-height:1.45;

  word-break:break-word;

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.12);
}

.message-row.mine .message-bubble{
  background:
    linear-gradient(
      135deg,
      rgba(78,60,14,.97),
      rgba(44,34,12,.97)
    );

  border-color:#70591e;

  border-bottom-right-radius:4px;
}

.message-row.theirs .message-bubble{
  border-bottom-left-radius:4px;
}

.message-meta{
  display:flex;

  align-items:center;

  justify-content:flex-end;

  gap:6px;

  margin-top:5px;

  color:#8f8a80;

  font-size:9px;
}

.message-text{
  white-space:pre-wrap;
}

.message-image{
  display:block;

  max-width:100%;

  max-height:350px;

  border-radius:10px;

  object-fit:contain;

  background:#000;
}

.message-file{
  display:flex;

  align-items:center;

  gap:9px;

  padding:9px;

  border:1px solid #333;

  border-radius:9px;

  color:var(--gold);

  text-decoration:none;

  font-size:11px;
}

.message-expired{
  color:#777;

  font-size:11px;

  font-style:italic;
}


/* =====================================================
   COMPOSER
===================================================== */

.composer{
  display:none;

  border-top:1px solid var(--line);

  background:
    rgba(12,12,12,.94);

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);

  padding:12px 15px;

  flex-shrink:0;

  position:relative;
  z-index:3;
}

.composer.show{
  display:block;
}

.temporary-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:9px;
}

.temporary-label{
  color:var(--muted);
  font-size:10px;
  font-weight:800;
}

.temporary-select{
  background:#151515;
  color:var(--text);

  border:1px solid var(--line);

  padding:6px 9px;

  border-radius:7px;

  outline:none;

  font-size:10px;
}

.composer-row{
  display:flex;

  align-items:flex-end;

  gap:8px;
}

.composer-actions{
  display:flex;

  gap:6px;
}

.icon-btn{
  width:39px;
  height:39px;

  border-radius:9px;

  border:1px solid var(--line);

  background:#151515;

  color:var(--text);

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:16px;
}

.icon-btn:hover{
  border-color:var(--gold);
  color:var(--gold);
}

.message-input{
  flex:1;

  min-height:39px;
  max-height:120px;

  resize:none;

  border:1px solid var(--line);

  background:#151515;

  color:var(--text);

  outline:none;

  border-radius:10px;

  padding:10px 12px;

  font-family:inherit;

  font-size:13px;

  line-height:1.4;
}

.message-input:focus{
  border-color:#735d22;
}

.send-btn{
  width:45px;
  height:39px;

  border:0;

  border-radius:9px;

  background:var(--gold);

  color:#16120a;

  cursor:pointer;

  font-size:16px;

  font-weight:1000;
}

.send-btn:hover{
  filter:brightness(1.08);
}

.send-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}


/* =====================================================
   MODAL
===================================================== */

.modal-overlay{
  position:fixed;

  inset:0;

  background:rgba(0,0,0,.78);

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  z-index:1000;
}

.modal-overlay.show{
  display:flex;
}

.modal{
  width:min(520px,100%);

  max-height:min(700px,90vh);

  overflow:hidden;

  display:flex;
  flex-direction:column;

  background:#101010;

  border:1px solid #383838;

  border-radius:15px;

  box-shadow:
    0 25px 80px
    rgba(0,0,0,.6);
}

.modal-header{
  padding:17px 18px;

  border-bottom:1px solid var(--line);

  display:flex;

  align-items:center;

  justify-content:space-between;
}

.modal-title{
  color:var(--gold);

  font-size:15px;
  font-weight:1000;
}

.modal-close{
  border:0;

  background:transparent;

  color:var(--muted);

  cursor:pointer;

  font-size:21px;
}

.modal-close:hover{
  color:var(--text);
}

.modal-search{
  padding:14px 18px;

  border-bottom:1px solid var(--line);
}

.modal-search input{
  width:100%;

  background:#161616;

  border:1px solid var(--line);

  color:var(--text);

  outline:none;

  padding:11px 12px;

  border-radius:9px;

  font-size:12px;
}

.artist-results{
  overflow-y:auto;

  min-height:0;

  padding:8px;
}

.artist-item{
  display:flex;

  align-items:center;

  gap:11px;

  padding:11px;

  border-radius:10px;

  cursor:pointer;

  transition:.18s;
}

.artist-item:hover{
  background:#191919;
}

.artist-item-info{
  min-width:0;
  flex:1;
}

.artist-item-name{
  font-size:13px;
  font-weight:900;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.artist-item-username{
  margin-top:4px;

  color:var(--gold);

  font-size:10px;
}

.artist-empty{
  padding:30px 15px;

  text-align:center;

  color:var(--muted);

  font-size:12px;
}


/* =====================================================
   TOAST
===================================================== */

.toast{
  position:fixed;

  right:20px;
  bottom:20px;

  max-width:360px;

  padding:12px 15px;

  background:#151515;

  border:1px solid #363636;

  border-radius:10px;

  box-shadow:
    0 15px 40px
    rgba(0,0,0,.5);

  color:var(--text);

  font-size:12px;

  z-index:2000;

  transform:translateY(20px);

  opacity:0;

  pointer-events:none;

  transition:.25s;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

.toast.success{
  border-color:#2b633e;
}

.toast.error{
  border-color:#6b3029;
  color:#ffb2a7;
}


/* =====================================================
   LOADING
===================================================== */

.loading{
  position:fixed;

  inset:0;

  background:#070707;

  z-index:3000;

  display:flex;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  gap:13px;
}

.loading.hide{
  display:none;
}

.loading-logo{
  color:var(--gold);

  font-size:21px;

  font-weight:1000;
}

.loading-text{
  color:var(--muted);

  font-size:11px;
}


/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:800px){

  .header{
    padding:0 12px;
  }

  .logo{
    font-size:15px;
  }

  .header-link{
    display:none;
  }

  .main{
    grid-template-columns:1fr;
  }

  .sidebar{
    display:none;
  }

  .chat{
    width:100%;
  }

  .message-bubble{
    max-width:84%;
  }

  .messages{
    padding:15px;
  }

}


/* =====================================================
   REDUZIR ANIMAÇÕES SE O SISTEMA PEDIR
===================================================== */

@media(
  prefers-reduced-motion:reduce
){

  body::after,
  .app::before,
  .chat::before,
  .chat-empty-icon{

    animation:none !important;

  }

}

</style>

</head>

/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHTML(
  value
){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    String(
      value ?? ""
    );

  return div.innerHTML;

}

    data.photoURL ||
    data.imagem ||
    data.photo ||

){

    data.artistName ||

  );

}

  );

}

}


/* =====================================================
   DATA
===================================================== */

function formatDate(
  timestamp
){

  if(!timestamp){
    return "";
  }

  let date;

  if(
    timestamp.toDate
  ){

    date =
      timestamp.toDate();

  }else{

    date =
      new Date(
        timestamp
      );

  }

  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "";

  }

  const now =
    new Date();

  const sameDay =
    date.toDateString() ===
    now.toDateString();

  if(sameDay){

    return date.toLocaleTimeString(
      "pt-PT",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }

  return date.toLocaleDateString(
    "pt-PT",
    {
      day:"2-digit",
      month:"2-digit"
    }
  );

}

){

    return conversation.lastMessage;

  }

  const type =
    conversation.lastMessageType;

  if(type === "image"){
    return "🖼️ Imagem";
  }

  if(type === "file"){
    return "📎 Ficheiro";
  }

  return "Nova conversa";

}

async function loadArtists(){

  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "artistas"
        )
      );

    allArtists =
      [];

    snapshot.forEach(
      artistSnap => {

        const data =
          artistSnap.data();

        const artist =
          {
            uid:
              artistSnap.id,

            ...data
          };

        if(
          artist.uid !==
          firebaseUser.uid
        ){

          allArtists.push(
            artist
          );

        }

      }
    );

    allArtists.sort(
      (
        a,
        b
      ) =>
        getArtistName(a)
          .localeCompare(
            getArtistName(b),
            "pt"
          )
    );

    renderArtists(
      allArtists
    );

  }
  catch(error){

    console.error(
      "Erro ao carregar artistas:",
      error
    );

    artistResults.innerHTML = `
      <div class="artist-empty">
        ⚠️ Não foi possível carregar os artistas.
      </div>
    `;

  }

}

/* =====================================================

===================================================== */

async function startNewConversation(
  artist
){

  if(
    !firebaseUser ||
    !artist ||
    !artist.uid
  ){

    return;

  }

  if(
    artist.uid ===
    firebaseUser.uid
  ){

    showToast(
      "Não podes enviar mensagens para ti mesmo.",
      "error"
    );

    return;

  }

  currentChatUID =
    artist.uid;

  currentChatArtist =
    artist;

  currentChatID =
    createChatID(
      firebaseUser.uid,
      artist.uid
    );

  try{

    const conversationRef =
      doc(
        db,
        "conversas",
        currentChatID
      );

    const conversationSnap =
      await getDoc(
        conversationRef
      );

    if(
      !conversationSnap.exists()
    ){

      const participantNames =
        {};

      participantNames[
        firebaseUser.uid
      ] =
        getArtistName(
          currentUserProfile
        );

      participantNames[
        artist.uid
      ] =
        getArtistName(
          artist
        );

      await setDoc(
        conversationRef,
        {

          usuario1Id:
            [
              firebaseUser.uid,
              artist.uid
            ].sort()[0],

          usuario2Id:
            [
              firebaseUser.uid,
              artist.uid
            ].sort()[1],

          participantes:
            [
              firebaseUser.uid,
              artist.uid
            ].sort(),

          participantNames:
            participantNames,

          createdAt:
            serverTimestamp(),

          lastMessage:
            "",

          lastMessageType:
            "text",

          lastMessageAt:
            serverTimestamp(),

          temporaryMode:
            "off",

          unreadCount:
            {
              [firebaseUser.uid]:
                0,

              [artist.uid]:
                0
            }

        }
      );

    }

    await openRealChat(
      artist
    );

  }
  catch(error){

    console.error(
      "Erro ao criar conversa:",
      error
    );

    showToast(
      "Não foi possível iniciar a conversa: " +
      error.message,
      "error"
    );

  }

}

/* =====================================================
   LISTENER CONVERSAS
===================================================== */

function listenConversations(){

  if(
    unsubscribeConversations
  ){

    unsubscribeConversations();

  }

  if(!firebaseUser){
    return;
  }

  const q =
    query(
      collection(
        db,
        "conversas"
      ),
      where(
        "participantes",
        "array-contains",
        firebaseUser.uid
      ),
      orderBy(
        "lastMessageAt",
        "desc"
      )
    );

  unsubscribeConversations =
    onSnapshot(
      q,
      snapshot => {

        allConversations =
          [];

        snapshot.forEach(
          conversationSnap => {

            allConversations.push(
              {
                id:
                  conversationSnap.id,

                ...conversationSnap.data()
              }
            );

          }
        );

        renderConversations();

      },
      error => {

        console.error(
          "Erro nas conversas:",
          error
        );

        conversationList.innerHTML = `
          <div class="empty-conversations">
            ⚠️ Não foi possível carregar as conversas.
            <br><br>
            ${escapeHTML(
              error.message
            )}
          </div>
        `;

      }
    );

}


/* =====================================================
   RENDERIZAR CONVERSAS
===================================================== */

function renderConversations(){

  const search =
    conversationSearch.value
      .trim()
      .toLowerCase();

  conversationList.innerHTML =
    "";

  let lista =
    allConversations;

  if(search){

    lista =
      lista.filter(
        conversation => {

          const names =
            conversation
              .participantNames ||
            {};

          const otherUID =
            (
              conversation
                .participantes ||
              []
            ).find(
              uid =>
                uid !==
                firebaseUser.uid
            );

          const name =
            names[
              otherUID
            ] ||
            "";

          const preview =
            getMessagePreview(
              conversation
            );

          return (
            name
              .toLowerCase()
              .includes(
                search
              ) ||
            preview
              .toLowerCase()
              .includes(
                search
              )
          );

        }
      );

  }

  if(
    !lista.length
  ){

    conversationList.innerHTML = `
      <div class="empty-conversations">
        ${
          search
            ? "Nenhuma conversa encontrada."
            : "Ainda não tens conversas."
        }
      </div>
    `;

    return;

  }

  lista.forEach(
    conversation => {

      const participants =
        conversation
          .participantes ||
        [];

      const otherUID =
        participants.find(
          uid =>
            uid !==
            firebaseUser.uid
        );

      if(!otherUID){
        return;
      }

      let artist =
        allArtists.find(
          item =>
            item.uid ===
            otherUID
        );

      const names =
        conversation
          .participantNames ||
        {};

      if(!artist){

        artist =
          {
            uid:
              otherUID,

            nome:
              names[
                otherUID
              ] ||
              "Artista Prime"
          };

      }

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "conversation";

      if(
        currentChatID ===
        conversation.id
      ){

        item.classList.add(
          "active"
        );

      }

      const unreadData =
        conversation
          .unreadCount ||
        {};

      const unread =
        Number(
          unreadData[
            firebaseUser.uid
          ] ||
          0
        );

      item.innerHTML = `

        <div class="avatar">
          ${avatarHTML(artist)}
        </div>

        <div class="conversation-info">

          <div class="conversation-name">

            ${escapeHTML(
              getArtistName(
                artist
              )
            )}

            <span
              class="online-dot"
              data-online-user="${escapeHTML(
                otherUID
              )}"
            ></span>

          </div>

          <div class="conversation-preview">

            ${
              unread > 0
                ? "🔴 "
                : ""
            }

            ${escapeHTML(
              getMessagePreview(
                conversation
              )
            )}

          </div>

        </div>

        <div class="conversation-time">
          ${formatDate(
            conversation.lastMessageAt
          )}
        </div>

      `;

      item.addEventListener(
        "click",
        () => {

          openRealChat(
            artist
          );

        }
      );

      conversationList.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   PRESENÇA
===================================================== */

function listenPresence(
  uid
){

  if(
    unsubscribePresence
  ){

    unsubscribePresence();

    unsubscribePresence =
      null;

  }

  const ref =
    doc(
      db,
      "artistas",
      uid
    );

  unsubscribePresence =
    onSnapshot(
      ref,
      snap => {

        if(
          !snap.exists()
        ){

          chatUserStatus.textContent =
            "Offline";

          return;

        }

        const data =
          snap.data();

        const online =
          data.online ===
          true;

        chatUserStatus.textContent =
          online
            ? "Online agora"
            : "Offline";

        const dots =
          document.querySelectorAll(
            `[data-online-user="${uid}"]`
          );

        dots.forEach(
          dot => {

            dot.classList.toggle(
              "online",
              online
            );

          }
        );

      },
      error => {

        console.warn(
          "Erro no listener de presença:",
          error
        );

      }
    );

}


/* =====================================================
   LISTENER MENSAGENS
===================================================== */

function listenMessages(){

  if(
    !firebaseUser ||
    !currentChatID
  ){

    return;

  }

  if(
    unsubscribeMessages
  ){

    unsubscribeMessages();

  }

  const q =
    query(
      collection(
        db,
        "mensagens"
      ),
      where(
        "conversaId",
        "==",
        currentChatID
      ),
      orderBy(
        "createdAt",
        "asc"
      )
    );

  unsubscribeMessages =
    onSnapshot(
      q,
      snapshot => {

        messages.innerHTML =
          "";

        snapshot.forEach(
          messageSnap => {

            const data =
              messageSnap.data();

            renderMessage(
              {
                id:
                  messageSnap.id,

                ...data
              }
            );

          }
        );

        scrollMessagesToBottom();

      },
      error => {

        console.error(
          "Erro nas mensagens:",
          error
        );

        messages.innerHTML = `
          <div
            class="message-expired"
            style="
              text-align:center;
              padding:30px;
            "
          >
            ⚠️ Não foi possível carregar as mensagens.
            <br><br>
            ${escapeHTML(
              error.message
            )}
          </div>
        `;

      }
    );

}


/* =====================================================
   RENDERIZAR MENSAGEM
===================================================== */

function renderMessage(
  data
){

  const row =
    document.createElement(
      "div"
    );

  const mine =
    data.senderId ===
    firebaseUser.uid;

  row.className =
    "message-row " +
    (
      mine
        ? "mine"
        : "theirs"
    );

  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "message-bubble";

  let expired =
    false;

  if(
    data.expirationAt
  ){

    const expiration =
      data.expirationAt.toDate
        ? data.expirationAt.toDate()
        : new Date(
            data.expirationAt
          );

    if(
      expiration.getTime() <=
      Date.now()
    ){

      expired =
        true;

    }

  }

  if(expired){

    bubble.innerHTML = `
      <div class="message-expired">
        ⏳ Esta mensagem expirou.
      </div>
    `;

  }
  else if(
    data.type ===
    "image" &&
    data.url
  ){

    bubble.innerHTML = `

      <img
        class="message-image"
        src="${escapeHTML(
          data.url
        )}"
        alt="Imagem"
      >

      <div class="message-meta">
        ${formatDate(
          data.createdAt
        )}
      </div>

    `;

  }
  else if(
    data.type ===
    "file" &&
    data.url
  ){

    bubble.innerHTML = `

      <a
        class="message-file"
        href="${escapeHTML(
          data.url
        )}"
        target="_blank"
        rel="noopener noreferrer"
      >

        📎

        <span>
          ${escapeHTML(
            data.fileName ||
            "Ficheiro"
          )}
        </span>

      </a>

      <div class="message-meta">
        ${formatDate(
          data.createdAt
        )}
      </div>

    `;

  }
  else{

    bubble.innerHTML = `

      <div class="message-text">
        ${escapeHTML(
          data.text ||
          ""
        )}
      </div>

      <div class="message-meta">

        ${formatDate(
          data.createdAt
        )}

        ${
          mine
            ? "✓"
            : ""
        }

      </div>

    `;

  }

  row.appendChild(
    bubble
  );

  messages.appendChild(
    row
  );

}

/* =====================================================
   EXPIRAÇÃO
===================================================== */

function getExpirationDate(){

  const mode =
    temporaryMode.value;

  if(
    mode ===
    "off"
  ){

    return null;

  }

  const date =
    new Date();

  if(
    mode ===
    "24h"
  ){

    date.setHours(
      date.getHours() +
      24
    );

  }

  else if(
    mode ===
    "7d"
  ){

    date.setDate(
      date.getDate() +
      7
    );

  }

  else if(
    mode ===
    "90d"
  ){

    date.setDate(
      date.getDate() +
      90
    );

  }

  return date;

}


/* =====================================================
   ENVIAR MENSAGEM FIREBASE
===================================================== */

async function sendFirebaseMessage(
  text
){

  if(
    !firebaseUser ||
    !currentChatUID ||
    !currentChatID
  ){

    showToast(
      "Escolhe primeiro uma conversa.",
      "error"
    );

    return;

  }

  const cleanText =
    String(
      text ||
      ""
    ).trim();

  if(!cleanText){
    return;
  }

  if(sendingMessage){
    return;
  }

  sendingMessage =
    true;

  sendBtn.disabled =
    true;

  try{

    const expiration =
      getExpirationDate();

    const messageRef =
      doc(
        collection(
          db,
          "mensagens"
        )
      );

    const conversationRef =
      doc(
        db,
        "conversas",
        currentChatID
      );

    const batch =
      writeBatch(
        db
      );

    const messageData =
      {

        conversaId:
          currentChatID,

        remetenteId:
          firebaseUser.uid,

        destinatarioId:
          currentChatUID,

        senderId:
          firebaseUser.uid,

        receiverId:
          currentChatUID,

        usuarioId:
          firebaseUser.uid,

        type:
          "text",

        text:
          cleanText,

        createdAt:
          serverTimestamp(),

        temporary:
          temporaryMode.value !==
          "off"

      };

    if(expiration){

      messageData.expirationAt =
        expiration;

    }

    batch.set(
      messageRef,
      messageData
    );

    batch.update(
      conversationRef,
      {

        lastMessage:
          cleanText,

        lastMessageType:
          "text",

        lastMessageAt:
          serverTimestamp(),

        temporaryMode:
          temporaryMode.value,

        [
          `unreadCount.${currentChatUID}`
        ]:
          increment(1),

        [
          `unreadCount.${firebaseUser.uid}`
        ]:
          0

      }
    );

    await batch.commit();

    messageInput.value =
      "";

    messageInput.style.height =
      "auto";

    scrollMessagesToBottom();

  }
  catch(error){

    console.error(
      "Erro ao enviar mensagem:",
      error
    );

    showToast(
      "Erro ao enviar mensagem: " +
      error.message,
      "error"
    );

  }
  finally{

    sendingMessage =
      false;

    sendBtn.disabled =
      false;

    messageInput.focus();

  }

}

/* =====================================================
   UPLOAD IMAGEM CLOUDINARY
===================================================== */

imageInput.addEventListener(
  "change",
  async () => {

    const file =
      imageInput.files[0];

    if(!file){
      return;
    }

    if(
      !firebaseUser ||
      !currentChatUID ||
      !currentChatID
    ){

      imageInput.value =
        "";

      return;

    }

    try{

      showToast(
        "A enviar imagem..."
      );

      const formData =
        new FormData();

      formData.append(
        "file",
        file
      );

      formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
      );

      formData.append(
        "folder",
        "kuduro-prime/mensagens"
      );

      const response =
        await fetch(
          CLOUDINARY_IMAGE_URL,
          {
            method:
              "POST",

            body:
              formData
          }
        );

      if(
        !response.ok
      ){

        throw new Error(
          "Falha no upload da imagem."
        );

      }

      const data =
        await response.json();

      if(
        !data.secure_url
      ){

        throw new Error(
          "O Cloudinary não devolveu a imagem."
        );

      }

      const expiration =
        getExpirationDate();

      const messageRef =
        doc(
          collection(
            db,
            "mensagens"
          )
        );

      const conversationRef =
        doc(
          db,
          "conversas",
          currentChatID
        );

      const batch =
        writeBatch(
          db
        );

      const messageData =
        {

          conversaId:
            currentChatID,

          remetenteId:
            firebaseUser.uid,

          destinatarioId:
            currentChatUID,

          senderId:
            firebaseUser.uid,

          receiverId:
            currentChatUID,

          usuarioId:
            firebaseUser.uid,

          type:
            "image",

          url:
            data.secure_url,

          createdAt:
            serverTimestamp(),

          temporary:
            temporaryMode.value !==
            "off"

        };

      if(expiration){

        messageData.expirationAt =
          expiration;

      }

      batch.set(
        messageRef,
        messageData
      );

      batch.update(
        conversationRef,
        {

          lastMessage:
            "🖼️ Imagem",

          lastMessageType:
            "image",

          lastMessageAt:
            serverTimestamp(),

          temporaryMode:
            temporaryMode.value,

          [
            `unreadCount.${currentChatUID}`
          ]:
            increment(1),

          [
            `unreadCount.${firebaseUser.uid}`
          ]:
            0

        }
      );

      await batch.commit();

      showToast(
        "Imagem enviada."
      );

    }
    catch(error){

      console.error(
        "Erro no upload da imagem:",
        error
      );

      showToast(
        "Erro ao enviar imagem: " +
        error.message,
        "error"
      );

    }
    finally{

      imageInput.value =
        "";

    }

  }
);

/* =====================================================
   AUTENTICAÇÃO
   ÚNICO onAuthStateChanged
===================================================== */

let authInicializado =
  false;


/* =====================================================
   PERSISTÊNCIA DA SESSÃO
===================================================== */

async function iniciarAutenticacao(){

  try{

    await setPersistence(
      auth,
      browserLocalPersistence
    );

  }
  catch(error){

    console.error(
      "Erro ao configurar persistência do Firebase:",
      error
    );

  }


  /* ===================================================
     ÚNICO LISTENER DE AUTENTICAÇÃO
  =================================================== */

  onAuthStateChanged(
    auth,
    async user => {

      console.log(
        "Firebase Auth:",
        user
          ? "UTILIZADOR LOGADO: " +
            user.uid
          : "SEM UTILIZADOR"
      );


      /* ===============================================
         UTILIZADOR NÃO LOGADO
      =============================================== */

      if(!user){

        if(
          !authInicializado
        ){

          authInicializado =
            true;

          loadingText.textContent =
            "A verificar sessão...";

          setTimeout(
            () => {

              if(
                !auth.currentUser
              ){

                console.warn(
                  "Nenhuma sessão Firebase encontrada."
                );

                window.location.replace(
                  "area-do-artista.html"
                );

              }

            },
            1200
          );

          return;

        }


        window.location.replace(
          "area-do-artista.html"
        );

        return;

      }


      /* ===============================================
         UTILIZADOR LOGADO
      =============================================== */

      authInicializado =
        true;

      firebaseUser =
        user;

      console.log(
        "Sessão Firebase confirmada:",
        firebaseUser.uid
      );


      try{

        loadingText.textContent =
          "A carregar o teu perfil...";

        await loadCurrentProfile();


        loadingText.textContent =
          "A atualizar presença...";

        await setOnline();


        loadingText.textContent =
          "A carregar artistas...";

        await loadArtists();


        loadingText.textContent =
          "A carregar conversas...";

        listenConversations();


        /* =============================================
           ABRIR PERFIL DIRETO
        ============================================= */

        const params =
          new URLSearchParams(
            window.location.search
          );


        const targetUID =
          params.get("uid") ||
          params.get("id") ||
          params.get("artistId") ||
          params.get("userId");


        if(
          targetUID &&
          targetUID !==
          firebaseUser.uid
        ){

          let artist =
            allArtists.find(
              a =>
                a.uid ===
                targetUID
            );


          if(!artist){

            try{

              const artistSnap =
                await getDoc(
                  doc(
                    db,
                    "artistas",
                    targetUID
                  )
                );


              if(
                artistSnap.exists()
              ){

                artist =
                  {
                    uid:
                      targetUID,

                    ...artistSnap.data()
                  };

              }

            }
            catch(error){

              console.error(
                "Erro ao procurar artista:",
                error
              );

            }

          }


          if(artist){

            await startNewConversation(
              artist
            );

          }
          else{

            showToast(
              "Artista não encontrado.",
              "error"
            );

          }

        }


        loadingScreen.classList.add(
          "hide"
        );

      }
      catch(error){

        console.error(
          "Erro ao iniciar mensagens:",
          error
        );

        loadingText.textContent =
          "Erro ao iniciar mensagens.";

        showToast(
          "Erro ao iniciar o sistema de mensagens: " +
          error.message,
          "error"
        );

        setTimeout(
          () => {

            loadingScreen.classList.add(
              "hide"
            );

          },
          1200
        );

      }

    }
  );

}


/* =====================================================
   INICIAR AUTENTICAÇÃO
===================================================== */
