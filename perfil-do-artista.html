<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Perfil do Artista | KUDURO PRIME</title>

<style>

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(
      circle at top,
      rgba(212, 175, 55, 0.14),
      transparent 35%
    );
  pointer-events: none;
  z-index: -1;
}

/* HEADER */

header {
  height: 70px;
  background: rgba(8, 8, 8, 0.96);
  border-bottom: 1px solid #2b2b2b;
  display: flex;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-interno {
  width: min(1200px, 92%);
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  color: #d4af37;
  text-decoration: none;
  font-size: 22px;
  font-weight: 900;
}

.voltar {
  color: #ccc;
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
}

.voltar:hover {
  color: #d4af37;
}

/* LOADING */

#carregando {
  min-height: 70vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #d4af37;
  font-size: 18px;
}

/* PERFIL */

#perfil {
  display: none;
}

.perfil-capa {
  min-height: 440px;
  display: flex;
  align-items: end;
  position: relative;
  overflow: hidden;

  background:
    linear-gradient(
      to top,
      #080808 0%,
      rgba(8, 8, 8, 0.3) 60%,
      rgba(8, 8, 8, 0.15)
    ),
    linear-gradient(
      120deg,
      rgba(212, 175, 55, 0.25),
      transparent
    );
}

.perfil-capa::before {
  content: "";
  position: absolute;
  inset: 0;

  background-image: var(--capa);

  background-size: cover;
  background-position: center;

  filter: blur(5px);
  opacity: 0.7;
  transform: scale(1.05);
}

.perfil-capa-conteudo {
  width: min(1200px, 92%);
  margin: auto;
  padding: 50px 0;
  position: relative;
  z-index: 2;

  display: flex;
  align-items: end;
  gap: 30px;
}

.foto-artista {
  width: 220px;
  height: 220px;

  border-radius: 50%;
  object-fit: cover;

  border: 5px solid #d4af37;

  background: #151515;

  box-shadow:
    0 10px 40px rgba(0, 0, 0, 0.7);
}

.info-principal {
  flex: 1;
}

.verificado {
  color: #d4af37;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 10px;
}

.verificado span {
  background: #d4af37;
  color: black;

  width: 18px;
  height: 18px;

  border-radius: 50%;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  font-size: 11px;
}

.tipo-artista {
  font-size: 13px;
  color: #ccc;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.nome-artista {
  font-size: clamp(45px, 8vw, 100px);
  line-height: 0.9;
  margin: 12px 0;
  font-weight: 950;
  letter-spacing: -4px;
}

.local-artista {
  color: #ddd;
  font-size: 16px;
}

/* CONTEÚDO */

main {
  width: min(1200px, 92%);
  margin: auto;
  padding: 35px 0 80px;
}

.acoes {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 40px;
}

.botao-ouvir {
  border: none;
  border-radius: 30px;

  background: #d4af37;
  color: black;

  padding: 15px 28px;

  font-size: 14px;
  font-weight: 900;

  cursor: pointer;
}

.botao-ouvir:hover {
  background: #f5cf58;
  transform: scale(1.03);
}

.botao-seguir,
.botao-partilhar {
  background: transparent;
  color: white;

  border: 1px solid #555;

  padding: 14px 22px;

  border-radius: 30px;

  font-size: 13px;
  font-weight: bold;

  cursor: pointer;
}

.botao-seguir:hover,
.botao-partilhar:hover {
  border-color: #d4af37;
  color: #d4af37;
}

.info-musicas {
  color: #999;
  font-size: 14px;
  margin-left: 10px;
}

/* TÍTULOS */

.secao {
  margin-top: 45px;
}

.secao-titulo {
  color: white;
  font-size: 28px;
  font-weight: 900;
  margin: 0 0 20px;
}

/* MÚSICAS */

.lista-musicas {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.musica {
  display: grid;
  grid-template-columns:
    45px
    55px
    1fr
    auto;

  gap: 15px;

  align-items: center;

  padding: 12px 15px;

  border-radius: 10px;

  cursor: pointer;
}

.musica:hover {
  background: #171717;
}

.numero-musica {
  color: #999;
  text-align: center;
  font-size: 14px;
}

.capa-musica {
  width: 52px;
  height: 52px;

  border-radius: 7px;

  background:
    linear-gradient(
      135deg,
      #d4af37,
      #3d2d05
    );

  display: flex;
  align-items: center;
  justify-content: center;

  color: black;
  font-size: 20px;
}

.dados-musica {
  min-width: 0;
}

.titulo-musica {
  color: white;
  font-weight: bold;
  font-size: 16px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.nome-musica-artista {
  color: #999;
  font-size: 13px;
  margin-top: 5px;
}

.acoes-musica {
  display: flex;
  align-items: center;
  gap: 12px;
}

.botao-play-musica {
  width: 45px;
  height: 45px;

  border-radius: 50%;

  background: #d4af37;
  color: black;

  border: none;

  font-size: 16px;

  cursor: pointer;
}

.botao-play-musica:hover {
  transform: scale(1.08);
}

.botao-partilhar-musica {
  background: transparent;
  border: 0;
  color: #aaa;
  font-size: 18px;
  cursor: pointer;
}

.botao-partilhar-musica:hover {
  color: #d4af37;
}

/* SOBRE */

.sobre {
  max-width: 850px;

  color: #c7c7c7;

  line-height: 1.8;

  font-size: 16px;

  white-space: pre-line;
}

/* REDES */

.redes {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.rede {
  padding: 13px 20px;

  border-radius: 8px;

  border: 1px solid #333;

  background: #111;

  color: white;

  text-decoration: none;

  font-size: 13px;
  font-weight: bold;
}

.rede:hover {
  border-color: #d4af37;
  color: #d4af37;
}

/* SEM MÚSICAS */

.sem-musicas {
  background: #111;
  border: 1px solid #252525;

  border-radius: 12px;

  padding: 40px;

  color: #999;

  text-align: center;
}

/* PLAYER FIXO */

.player-fixo {
  position: fixed;

  bottom: 0;
  left: 0;
  right: 0;

  background: rgba(15, 15, 15, 0.98);

  border-top: 1px solid #333;

  padding: 12px 0;

  z-index: 200;

  display: none;
}

.player-interno {
  width: min(1200px, 92%);
  margin: auto;

  display: flex;
  align-items: center;
  gap: 15px;
}

.player-info {
  min-width: 200px;
}

.player-titulo {
  font-size: 14px;
  font-weight: bold;
}

.player-artista {
  color: #999;
  font-size: 12px;
  margin-top: 4px;
}

audio {
  width: 100%;
  height: 40px;
}

#mensagemPartilha {
  position: fixed;

  bottom: 90px;
  left: 50%;

  transform: translateX(-50%);

  background: #d4af37;
  color: black;

  padding: 13px 20px;

  border-radius: 30px;

  font-size: 13px;
  font-weight: bold;

  display: none;

  z-index: 300;
}

/* MOBILE */

@media (max-width: 700px) {

  .perfil-capa {
    min-height: auto;
  }

  .perfil-capa-conteudo {
    padding: 50px 0 35px;

    flex-direction: column;
    align-items: center;

    text-align: center;
  }

  .foto-artista {
    width: 170px;
    height: 170px;
  }

  .nome-artista {
    font-size: 48px;
    letter-spacing: -2px;
  }

  .acoes {
    justify-content: center;
  }

  .info-musicas {
    width: 100%;
    text-align: center;
    margin-left: 0;
  }

  .musica {
    grid-template-columns:
      25px
      45px
      1fr
      auto;

    gap: 10px;

    padding: 10px;
  }

  .capa-musica {
    width: 45px;
    height: 45px;
  }

  .numero-musica {
    font-size: 12px;
  }

  .botao-play-musica {
    width: 40px;
    height: 40px;
  }

  .botao-partilhar-musica {
    display: none;
  }

  .player-interno {
    flex-direction: column;
    align-items: stretch;
    gap: 7px;
  }

  .player-info {
    min-width: 0;
  }

}

</style>
</head>

<body>

<header>

  <div class="header-interno">

    <a href="index.html" class="logo">
      👑 KUDURO PRIME
    </a>

    <a href="painel-do-artista.html" class="voltar">
      ← VOLTAR AO PAINEL
    </a>

  </div>

</header>


<div id="carregando">
  A carregar o perfil do artista... 👑
</div>


<div id="perfil">


  <!-- CAPA -->

  <section
    class="perfil-capa"
    id="perfilCapa"
  >

    <div class="perfil-capa-conteudo">

      <img
        id="foto"
        class="foto-artista"
        src=""
        alt="Foto do artista"
      >

      <div class="info-principal">

        <div class="verificado">
          <span>✓</span>
          ARTISTA DO KUDURO PRIME
        </div>

        <div class="tipo-artista">
          PERFIL DE ARTISTA
        </div>

        <h1
          id="nome"
          class="nome-artista"
        ></h1>

        <div
          id="provincia"
          class="local-artista"
        ></div>

      </div>

    </div>

  </section>


  <main>


    <!-- BOTÕES -->

    <div class="acoes">

      <button
        id="ouvirPrimeira"
        class="botao-ouvir"
      >
        ▶ OUVIR
      </button>

      <button
        id="partilharPerfil"
        class="botao-partilhar"
      >
        ↗ PARTILHAR
      </button>

      <span
        id="infoMusicas"
        class="info-musicas"
      >
        A carregar músicas...
      </span>

    </div>


    <!-- MÚSICAS -->

    <section class="secao">

      <h2 class="secao-titulo">
        🎵 MÚSICAS PUBLICADAS
      </h2>

      <div
        id="listaMusicas"
        class="lista-musicas"
      ></div>

    </section>


    <!-- SOBRE -->

    <section class="secao">

      <h2 class="secao-titulo">
        👤 SOBRE O ARTISTA
      </h2>

      <div
        id="bio"
        class="sobre"
      ></div>

    </section>


    <!-- REDES -->

    <section class="secao">

      <h2 class="secao-titulo">
        🌐 ENCONTRA O ARTISTA
      </h2>

      <div
        id="redes"
        class="redes"
      ></div>

    </section>


  </main>

</div>


<!-- PLAYER -->

<div
  id="playerFixo"
  class="player-fixo"
>

  <div class="player-interno">

    <div class="player-info">

      <div
        id="playerTitulo"
        class="player-titulo"
      >
        Nenhuma música
      </div>

      <div
        id="playerArtista"
        class="player-artista"
      ></div>

    </div>

    <audio
      id="audioPlayer"
      controls
    ></audio>

  </div>

</div>


<div id="mensagemPartilha"></div>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  collection,
  query,
  where,
  orderBy,
  getDocs
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyDoitCcLeLDNBNPCP6fG1s_xbHr4UmohSo",

  authDomain:
  "kuduro-prime.firebaseapp.com",

  projectId:
  "kuduro-prime",

  storageBucket:
  "kuduro-prime.firebasestorage.app",

  messagingSenderId:
  "299776559545",

  appId:
  "1:299776559545:web:04aced1ba25391eb3fce68"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


const carregando =
  document.getElementById("carregando");

const perfil =
  document.getElementById("perfil");

const listaMusicas =
  document.getElementById("listaMusicas");

const audioPlayer =
  document.getElementById("audioPlayer");

const playerFixo =
  document.getElementById("playerFixo");

const playerTitulo =
  document.getElementById("playerTitulo");

const playerArtista =
  document.getElementById("playerArtista");

const mensagemPartilha =
  document.getElementById("mensagemPartilha");


let usuarioAtual = null;
let dadosArtista = null;
let musicasArtista = [];


/* CARREGAR PERFIL */

onAuthStateChanged(
  auth,
  async (user) => {

    if (!user) {

      window.location.href =
        "area-do-artista.html";

      return;

    }

    usuarioAtual = user;

    try {

      const perfilRef =
        doc(
          db,
          "artistas",
          user.uid
        );

      const perfilDoc =
        await getDoc(perfilRef);


      if (!perfilDoc.exists()) {

        window.location.href =
          "criar-perfil.html";

        return;

      }


      dadosArtista =
        perfilDoc.data();


      carregarDadosPerfil();

      await carregarMusicas();


      carregando.style.display =
        "none";

      perfil.style.display =
        "block";


    } catch (erro) {

      console.error(erro);

      carregando.textContent =
        "Erro ao carregar o perfil: " +
        erro.message;

    }

  }
);


/* DADOS DO PERFIL */

function carregarDadosPerfil() {


  const nome =
    dadosArtista.nome ||
    "Artista";


  const foto =
    dadosArtista.foto ||
    "";


  document
    .getElementById("nome")
    .textContent =
      nome;


  document
    .getElementById("bio")
    .textContent =
      dadosArtista.bio ||
      "Este artista ainda não adicionou uma biografia.";


  document
    .getElementById("provincia")
    .textContent =
      "📍 " +
      (
        dadosArtista.provincia ||
        "Angola"
      );


  const fotoElemento =
    document.getElementById("foto");


  fotoElemento.src =
    foto;


  document
    .getElementById("perfilCapa")
    .style
    .setProperty(
      "--capa",
      foto
        ? `url("${foto}")`
        : "none"
    );


  carregarRedes();

}


/* REDES SOCIAIS */

function carregarRedes() {


  const redes =
    document.getElementById("redes");


  redes.innerHTML =
    "";


  /* WHATSAPP */

  if (
    dadosArtista.whatsapp
  ) {

    const numero =
      dadosArtista.whatsapp
      .replace(/\D/g, "");


    const whatsapp =
      document.createElement("a");


    whatsapp.className =
      "rede";


    whatsapp.href =
      "https://wa.me/" +
      numero;


    whatsapp.target =
      "_blank";


    whatsapp.textContent =
      "💬 WHATSAPP";


    redes.appendChild(
      whatsapp
    );

  }


  /* INSTAGRAM */

  if (
    dadosArtista.instagram
  ) {

    const instagram =
      document.createElement("a");


    instagram.className =
      "rede";


    instagram.href =
      dadosArtista.instagram;


    instagram.target =
      "_blank";


    instagram.textContent =
      "📸 INSTAGRAM";


    redes.appendChild(
      instagram
    );

  }


  /* TIKTOK */

  if (
    dadosArtista.tiktok
  ) {

    const tiktok =
      document.createElement("a");


    tiktok.className =
      "rede";


    tiktok.href =
      dadosArtista.tiktok;


    tiktok.target =
      "_blank";


    tiktok.textContent =
      "🎵 TIKTOK";


    redes.appendChild(
      tiktok
    );

  }


  if (
    redes.children.length === 0
  ) {

    redes.innerHTML =
      "<span style='color:#888'>O artista ainda não adicionou redes sociais.</span>";

  }

}


/* CARREGAR MÚSICAS */

async function carregarMusicas() {

  const consulta =
    query(
      collection(
        db,
        "musicas"
      ),

      where(
        "artistaId",
        "==",
        usuarioAtual.uid
      ),

      orderBy(
        "criadoEm",
        "desc"
      )
    );


  const resultado =
    await getDocs(
      consulta
    );


  musicasArtista =
    [];


  resultado.forEach(
    (documento) => {

      musicasArtista.push({
        id:
          documento.id,

        ...documento.data()
      });

    }
  );


  document
    .getElementById("infoMusicas")
    .textContent =
      musicasArtista.length +
      (
        musicasArtista.length === 1
          ? " música publicada"
          : " músicas publicadas"
      );


  mostrarMusicas();

}


/* MOSTRAR MÚSICAS */

function mostrarMusicas() {


  listaMusicas.innerHTML =
    "";


  if (
    musicasArtista.length === 0
  ) {

    listaMusicas.innerHTML =
      `
      <div class="sem-musicas">
        🎵 Ainda não existem músicas publicadas.
      </div>
      `;

    return;

  }


  musicasArtista.forEach(
    (musica, index) => {


      const item =
        document.createElement("article");


      item.className =
        "musica";


      const numero =
        document.createElement("div");


      numero.className =
        "numero-musica";


      numero.textContent =
        index + 1;


      const capa =
        document.createElement("div");


      capa.className =
        "capa-musica";


      capa.textContent =
        "♫";


      const dados =
        document.createElement("div");


      dados.className =
        "dados-musica";


      const titulo =
        document.createElement("div");


      titulo.className =
        "titulo-musica";


      titulo.textContent =
        musica.titulo ||
        "Sem título";


      const artista =
        document.createElement("div");


      artista.className =
        "nome-musica-artista";


      let textoArtista =
        musica.artistaNome ||
        dadosArtista.nome ||
        "Artista";


      const feats =
        [
          musica.feat1,
          musica.feat2,
          musica.feat3
        ]
        .filter(
          feat =>
            feat &&
            feat.trim() !== ""
        );


      if (
        feats.length > 0
      ) {

        textoArtista +=
          " feat. " +
          feats.join(", ");

      }


      artista.textContent =
        textoArtista;


      dados.appendChild(
        titulo
      );


      dados.appendChild(
        artista
      );


      const acoes =
        document.createElement("div");


      acoes.className =
        "acoes-musica";


      const partilhar =
        document.createElement("button");


      partilhar.className =
        "botao-partilhar-musica";


      partilhar.textContent =
        "↗";


      partilhar.title =
        "Partilhar música";


      partilhar.addEventListener(
        "click",
        () => {

          partilharMusica(
            musica,
            textoArtista
          );

        }
      );


      const play =
        document.createElement("button");


      play.className =
        "botao-play-musica";


      play.textContent =
        "▶";


      play.addEventListener(
        "click",
        () => {

          tocarMusica(
            musica,
            textoArtista
          );

        }
      );


      acoes.appendChild(
        partilhar
      );


      acoes.appendChild(
        play
      );


      item.appendChild(
        numero
      );


      item.appendChild(
        capa
      );


      item.appendChild(
        dados
      );


      item.appendChild(
        acoes
      );


      listaMusicas.appendChild(
        item
      );


    }
  );

}


/* TOCAR MÚSICA */

function tocarMusica(
  musica,
  nomeArtista
) {


  if (
    !musica.audioURL
  ) {

    alert(
      "Esta música não tem áudio disponível."
    );

    return;

  }


  audioPlayer.src =
    musica.audioURL;


  playerTitulo.textContent =
    musica.titulo ||
    "Sem título";


  playerArtista.textContent =
    nomeArtista;


  playerFixo.style.display =
    "block";


  audioPlayer.play();


}


/* BOTÃO OUVIR */

document
  .getElementById("ouvirPrimeira")
  .addEventListener(
    "click",
    () => {

      if (
        musicasArtista.length === 0
      ) {

        alert(
          "Este artista ainda não publicou músicas."
        );

        return;

      }


      const primeira =
        musicasArtista[0];


      tocarMusica(
        primeira,
        primeira.artistaNome ||
        dadosArtista.nome ||
        "Artista"
      );


    }
  );


/* PARTILHAR PERFIL */

document
  .getElementById("partilharPerfil")
  .addEventListener(
    "click",
    async () => {


      const nome =
        dadosArtista?.nome ||
        "Artista";


      const texto =
        "Conhece o perfil de " +
        nome +
        " no KUDURO PRIME 👑";


      try {

        if (
          navigator.share
        ) {

          await navigator.share({

            title:
              nome +
              " | KUDURO PRIME",

            text:
              texto,

            url:
              window.location.href

          });

        } else {

          await navigator.clipboard.writeText(
            window.location.href
          );

          mostrarMensagem(
            "🔗 Link do perfil copiado!"
          );

        }

      } catch (erro) {

        console.log(
          "Partilha cancelada ou indisponível."
        );

      }


    }
  );


/* PARTILHAR MÚSICA */

async function partilharMusica(
  musica,
  nomeArtista
) {


  const link =
    musica.audioURL;


  const texto =
    "🎵 " +
    (
      musica.titulo ||
      "Música"
    ) +
    " — " +
    nomeArtista +
    " 👑 KUDURO PRIME";


  try {

    if (
      navigator.share
    ) {

      await navigator.share({

        title:
          musica.titulo ||
          "Música",

        text:
          texto,

        url:
          link

      });

    } else {

      await navigator.clipboard.writeText(
        link
      );

      mostrarMensagem(
        "🔗 Link da música copiado!"
      );

    }

  } catch (erro) {

    console.log(
      "Partilha cancelada."
    );

  }

}


/* MENSAGEM */

function mostrarMensagem(
  texto
) {


  mensagemPartilha.textContent =
    texto;


  mensagemPartilha.style.display =
    "block";


  setTimeout(
    () => {

      mensagemPartilha.style.display =
        "none";

    },
    2500
  );

}

</script>
