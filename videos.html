/* =========================================
   SEGURANÇA HTML
========================================= */

function escapeHTML(value){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value ?? "";

  return div.innerHTML;

}


/* =========================================
   DATA
========================================= */

function formatDate(timestamp){

  if(!timestamp){
    return "";
  }


  if(
    timestamp.seconds
  ){

    const date =
      new Date(
        timestamp.seconds * 1000
      );


    return date.toLocaleDateString(
      "pt-PT"
    );

  }


  if(
    typeof timestamp === "string"
  ){

    const date =
      new Date(timestamp);


    if(
      !Number.isNaN(
        date.getTime()
      )
    ){

      return date.toLocaleDateString(
        "pt-PT"
      );

    }

  }


  return "";

}


/* =========================================
   NÚMEROS
========================================= */

function formatNumber(number){

  number =
    Number(number) || 0;


  return number.toLocaleString(
    "pt-PT"
  );

}


/* =========================================
   DURAÇÃO
========================================= */

function formatDuration(seconds){

  seconds =
    Number(seconds) || 0;


  const hours =
    Math.floor(
      seconds / 3600
    );


  const minutes =
    Math.floor(
      (seconds % 3600) / 60
    );


  const remainingSeconds =
    Math.floor(
      seconds % 60
    );


  if(hours > 0){

    return (

      String(hours)
        .padStart(2,"0")

      + ":"

      +

      String(minutes)
        .padStart(2,"0")

      + ":"

      +

      String(remainingSeconds)
        .padStart(2,"0")

    );

  }


  return (

    String(minutes)
      .padStart(2,"0")

    + ":"

    +

    String(remainingSeconds)
      .padStart(2,"0")

  );

}


/* =========================================
   DATA PARA ORDENAÇÃO
========================================= */

function getVideoDate(video){

  const timestamp =
    video.criadoEm
    ||
    video.atualizadoEm
    ||
    video.dataPublicacao
    ||
    video.dataLancamento
    ||
    video.createdAt
    ||
    video.created_at
    ||
    null;


  if(!timestamp){
    return 0;
  }


  /*
     Timestamp do Firestore
  */

  if(
    typeof timestamp.toMillis ===
    "function"
  ){

    return timestamp.toMillis();

  }


  /*
     Timestamp antigo
  */

  if(
    timestamp.seconds
  ){

    return (
      Number(timestamp.seconds) *
      1000
    );

  }


  /*
     Número
  */

  if(
    typeof timestamp === "number"
  ){

    return timestamp;

  }


  /*
     Data em texto
  */

  if(
    typeof timestamp === "string"
  ){

    const time =
      new Date(timestamp).getTime();


    return Number.isNaN(time)
      ? 0
      : time;

  }


  return 0;

}


/* =========================================
   PEGAR PUBLIC ID
========================================= */

function getPublicId(video){

  /*
     Primeiro tenta o campo
     salvo no Firestore.
  */

  if(
    video.videoPublicId
  ){

    return video.videoPublicId;

  }


  if(
    video.publicId
  ){

    return video.publicId;

  }


  /*
     Para vídeos antigos,
     tenta descobrir pelo URL.
  */

  const videoURL =
    video.videoUrl
    ||
    video.video
    ||
    video.url
    ||
    video.videoURL
    ||
    video.urlVideo
    ||
    "";


  if(!videoURL){

    return "";

  }


  try{

    const url =
      new URL(
        videoURL
      );


    const pathname =
      url.pathname;


    const marker =
      "/video/upload/";


    const index =
      pathname.indexOf(
        marker
      );


    if(index === -1){

      return "";

    }


    let path =
      pathname.substring(
        index + marker.length
      );


    const parts =
      path.split("/");


    while(
      parts.length &&
      (
        parts[0].startsWith("v")
        &&
        /^v\d+$/.test(
          parts[0]
        )
      )
    ){

      parts.shift();

    }


    const transformationWords = [

      "q_auto",
      "f_auto",
      "vc_auto",
      "br_auto",
      "ac_none",
      "fl_progressive"

    ];


    while(

      parts.length &&

      (

        parts[0].includes(",")

        ||

        transformationWords.includes(
          parts[0]
        )

      )

    ){

      parts.shift();

    }


    let publicId =
      parts.join("/");


    publicId =
      publicId.replace(
        /\.(mp4|mov|webm|m4v)$/i,
        ""
      );


    return decodeURIComponent(
      publicId
    );

  }

  catch(error){

    console.error(
      "Erro ao obter Public ID:",
      error
    );

    return "";

  }

}


/* =========================================
   CARREGAR VÍDEOS
========================================= */

async function loadVideos(){

  try{

    /*
       IMPORTANTE:

       Não usamos:

       orderBy("criadoEm","desc")

       diretamente no Firestore.

       Alguns vídeos antigos podem não
       possuir "criadoEm".

       Nesse caso o orderBy pode impedir
       esses documentos de aparecerem.

       Agora buscamos TODOS os documentos
       da coleção "videos".
    */

    const videoCollection =
      collection(
        db,
        "videos"
      );


    const snapshot =
      await getDocs(
        videoCollection
      );


    /*
       TODOS os documentos são transformados
       em objetos.
    */

    const allVideos =
      snapshot.docs.map(
        videoDoc => ({

          id:
            videoDoc.id,

          ...videoDoc.data()

        })
      );


    /*
       Mantemos o filtro existente:

       publicado
       publicada
       ou sem status.

       Portanto não retiramos a regra
       de publicação que já existia.
    */

    const videos =
      allVideos.filter(
        video => {

          return (

            video.status ===
              "publicado"

            ||

            video.status ===
              "publicada"

            ||

            !video.status

          );

        }
      );


    /*
       Ordenamos depois de carregar
       todos os vídeos.

       Mais recentes primeiro.

       Vídeos sem data ficam no fim.
    */

    videos.sort(
      (a,b) => {

        return (
          getVideoDate(b) -
          getVideoDate(a)
        );

      }
    );


    console.log(
      "Total de documentos na coleção videos:",
      allVideos.length
    );


    console.log(
      "Total de vídeos publicados:",
      videos.length
    );


    if(
      videos.length === 0
    ){

      container.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            🎬
          </div>

          <h2>
            Ainda não existem vídeos.
          </h2>

          <p>
            Os próximos vídeos aparecerão aqui.
          </p>

        </div>

      `;

      return;

    }


    renderVideos(
      videos
    );

  }

  catch(error){

    console.error(
      "Erro ao carregar vídeos:",
      error
    );


    container.innerHTML = `

      <div class="error">

        ⚠️

        <br><br>

        Não foi possível carregar os vídeos.

        <br><br>

        <small>

          ${escapeHTML(
            error.message
          )}

        </small>

      </div>

    `;

  }

}


/* =========================================
   RENDERIZAR VÍDEOS
========================================= */

function renderVideos(videos){

  container.innerHTML =

    videos.map(
      video => {

        const title =
          video.titulo
          ||
          video.title
          ||
          video.nomeVideo
          ||
          video.nome
          ||

        const artist =
          video.artistaNome
          ||
          video.artistName
          ||
          video.nomeArtistico
          ||
          video.artista
          ||
          video.nomeArtista
          ||
          "Artista Prime";


        const description =
          video.descricao
          ||
          video.description
          ||
          "Novo vídeo no KUDURO PRIME.";


        const category =
          video.categoria
          ||
          video.tipo
          ||
          video.category
          ||
          "Kuduro";


        const cover =
          video.capa
          ||
          video.cover
          ||
          video.coverUrl
          ||
          video.capaUrl
          ||
          video.imagem
          ||
          video.thumbnail
          ||
          "";


        const views =
          Number(
            video.views
          )
          ||

          Number(
            video.visualizacoes
          )
          ||

          0;


        const durationSeconds =
          Number(
            video.duracaoSegundos
          )
          ||

          Number(
            video.duracao
          )
          ||

          0;


        const duration =
          video.duracaoFormatada
          ||

          formatDuration(
            durationSeconds
          );


        const date =
          video.dataLancamento
          ||

          video.dataPublicacao
          ||

          formatDate(
            video.criadoEm
          );


        const artistId =
          video.artistaId
          ||
          video.artistId
          ||
          video.userId
          ||
          video.uid
          ||
          video.artistaUID
          ||
          "";


        const publicId =
          getPublicId(
            video
          );


        let playerHTML;


        if(publicId){

          const playerId =
            "cld-player-" +
            video.id;


          playerHTML = `

            <video

              data-video-id="${escapeHTML(video.id)}"

              data-owner-id="${escapeHTML(artistId)}"

              ${

                ?
                `poster="${escapeHTML(cover)}"`
                :
                ""
              }

            ></video>

          `;

        }

        else{

          playerHTML = `

            <div
              style="
                width:100%;
                height:100%;
                display:flex;
                align-items:center;
                justify-content:center;
                flex-direction:column;
                color:#777;
                font-size:15px;
                text-align:center;
                padding:20px;
              "
            >

              <div
                style="
                  font-size:40px;
                  margin-bottom:10px;
                "
              >
                🎬
              </div>

              Vídeo indisponível.

            </div>

          `;

        }


        return `

          <article
            class="video-card"
            data-id="${escapeHTML(video.id)}"
          >

            <div class="video-container">

              ${playerHTML}

            </div>


            <h2>
              ${escapeHTML(title)}
            </h2>


            <div class="artista">

              👑
              ${escapeHTML(artist)}

            </div>


            <div class="categoria">

              ${escapeHTML(category)}

            </div>


            <p class="descricao">

              ${escapeHTML(description)}

            </p>


            <div
              class="view-status"
              id="status-${escapeHTML(video.id)}"
            ></div>


            <div class="info">

              <span class="views">

                👁

                <span
                  class="view-number"
                  id="views-${escapeHTML(video.id)}"
                >

                  ${formatNumber(views)}

                </span>

                visualizações

              </span>


              <span class="duracao">

                ⏱
                ${escapeHTML(duration)}

              </span>

            </div>


            <div
              style="
                margin-top:8px;
                color:#666;
                font-size:10px;
              "
            >

              ${escapeHTML(date)}

            </div>


            ${
              artistId

              ?

              `

                <a
                  class="perfil-btn"
                  href="perfil.html?id=${encodeURIComponent(artistId)}"
                >

                  VER PERFIL DO ARTISTA →

                </a>

              `

              :

              ""

            }


          </article>

        `;

      }

    )

    .join("");


  initializeCloudinaryPlayers();

}


/* =========================================
   INICIAR PLAYERS CLOUDINARY
========================================= */

function initializeCloudinaryPlayers(){

  const playerElements =
    document.querySelectorAll(
      ".cld-video-player[data-public-id]"
    );


  playerElements.forEach(
    element => {

      const publicId =
        element.dataset.publicId;


      if(!publicId){

        return;

      }


      try{

        const player =
          cloudinary.videoPlayer(
            element.id,
            {

              cloudName:
                CLOUDINARY_CLOUD_NAME,

              controls:true,

              fluid:true,

              responsive:true,

              showLogo:false,

              autoplay:false,

              muted:false,

              loop:false,

              seekThumbnails:false

            }
          );


        player.source(
          publicId,
          {

            sourceTypes:[
              "mp4"
            ]

          }
        );


        player.on(
          "play",
          async () => {

            const videoId =
              element.dataset.videoId;


            const ownerId =
              element.dataset.ownerId;


            await registerVideoView(

              videoId,

              ownerId

            );

          }
        );


      }

      catch(error){

        console.error(
          "Erro ao iniciar player:",
          error
        );

      }

    }
  );

}


/* =========================================
   REGISTRAR VIEW
========================================= */

async function registerVideoView(
  videoId,
  ownerId
){

  if(!currentUser){

    return;

  }


  /*
     Artista não conta
     a própria view.
  */

  if(
    ownerId &&
    currentUser.uid === ownerId
  ){

    const status =
      document.querySelector(
        "#status-" +
        CSS.escape(videoId)
      );


    if(status){

      status.textContent =
        "Sua própria reprodução não conta como view.";

    }


    return;

  }


  try{

    const viewerRef =
      doc(

        db,

        "videos",

        videoId,

        "viewers",

        currentUser.uid

      );


    const viewerSnapshot =
      await getDoc(
        viewerRef
      );


    /*
       Já contou anteriormente.
    */

    if(
      viewerSnapshot.exists()
    ){

      return;

    }


    /*
       Guardar espectador.
    */

    await setDoc(

      viewerRef,

      {

        userId:
          currentUser.uid,

        criadoEm:
          serverTimestamp()

      }

    );


    /*
       Incrementar view.
    */

    const videoRef =
      doc(

        db,

        "videos",

        videoId

      );


    await updateDoc(

      videoRef,

      {

        views:
          increment(1),

        visualizacoes:
          increment(1)

      }

    );


    /*
       Atualizar número
       na tela.
    */

    const viewElement =
      document.querySelector(

        "#views-" +

        CSS.escape(
          videoId
        )

      );


    if(viewElement){

      const current =
        Number(

          viewElement
            .textContent
            .replace(/\D/g,"")

        )
        || 0;


      viewElement.textContent =
        formatNumber(
          current + 1
        );

    }

  }

  catch(error){

    console.error(
      "Erro ao registrar view:",
      error
    );

  }

}


/* =========================================
   AUTENTICAÇÃO
========================================= */

onAuthStateChanged(

  auth,

  user => {

    currentUser =
      user || null;


    loadVideos();

  }

);

</script>
