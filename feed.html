<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feed | KUDURO PRIME</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080808;
  color:#fff;
  font-family:Arial, Helvetica, sans-serif;
}

/* TOPO */

.topo{
  height:70px;
  background:#111;
  border-bottom:1px solid #292929;
  position:sticky;
  top:0;
  z-index:100;
}

.topo-in{
  max-width:1100px;
  height:100%;
  margin:auto;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  color:#d4af37;
  font-size:22px;
  font-weight:bold;
  text-decoration:none;
}

.acoes{
  display:flex;
  align-items:center;
  gap:10px;
}

.botao{
  background:#222;
  border:1px solid #444;
  color:white;
  padding:10px 14px;
  border-radius:8px;
  text-decoration:none;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
}

.botao:hover{
  border-color:#d4af37;
  color:#d4af37;
}

.botao-dourado{
  background:#d4af37;
  border-color:#d4af37;
  color:#111;
}

.botao-dourado:hover{
  color:#111;
  background:#f4c842;
}

/* CONTEÚDO */

main{
  max-width:1100px;
  margin:auto;
  padding:40px 20px 70px;
}

.cabecalho{
  margin-bottom:30px;
}

.cabecalho h1{
  margin:0;
  font-size:32px;
  color:#d4af37;
}

.cabecalho p{
  color:#999;
  margin-top:8px;
}

/* CARREGAMENTO */

#carregando{
  text-align:center;
  color:#d4af37;
  padding:60px 20px;
  font-size:18px;
}

/* FEED */

.feed{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

/* CARD */

.artista-card{
  background:#121212;
  border:1px solid #292929;
  border-radius:15px;
  overflow:hidden;
  transition:.25s;
}

.artista-card:hover{
  transform:translateY(-5px);
  border-color:#d4af37;
}

.capa{
  height:260px;
  position:relative;
  overflow:hidden;
  background:#1a1a1a;
}

.capa img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.capa::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:90px;
  background:linear-gradient(
    transparent,
    rgba(0,0,0,.8)
  );
}

/* INFORMAÇÃO */

.info{
  padding:16px;
}

.nome{
  font-size:18px;
  font-weight:bold;
  margin-bottom:7px;
}

.provincia{
  color:#aaa;
  font-size:13px;
  margin-bottom:16px;
}

.ver-perfil{
  display:block;
  text-align:center;
  padding:11px;
  border:1px solid #d4af37;
  color:#d4af37;
  border-radius:8px;
  text-decoration:none;
  font-size:12px;
  font-weight:bold;
}

.ver-perfil:hover{
  background:#d4af37;
  color:#111;
}

/* SEM ARTISTAS */

.vazio{
  grid-column:1/-1;
  background:#111;
  border:1px solid #292929;
  border-radius:15px;
  padding:50px 20px;
  text-align:center;
}

.vazio h2{
  color:#d4af37;
  margin-top:0;
}

.vazio p{
  color:#999;
}

/* RESPONSIVO */

@media(max-width:850px){

  .feed{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:600px){

  .topo{
    height:auto;
  }

  .topo-in{
    padding:15px;
    flex-wrap:wrap;
  }

  .logo{
    width:100%;
    text-align:center;
  }

  .acoes{
    width:100%;
    justify-content:center;
    flex-wrap:wrap;
  }

  main{
    padding:30px 15px 60px;
  }

  .cabecalho h1{
    font-size:26px;
  }

  .feed{
    grid-template-columns:1fr;
  }

  .capa{
    height:330px;
  }

}

</style>

</head>

<body>


<header class="topo">

  <div class="topo-in">

    <a href="index.html" class="logo">
      👑 KUDURO PRIME
    </a>


    <div class="acoes">

      <a
        href="meu-perfil.html"
        class="botao botao-dourado"
      >
        👤 MEU PERFIL
      </a>


      <a
        href="painel-do-artista.html"
        class="botao"
      >
        ⚙️ PAINEL
      </a>


      <button
        id="sair"
        class="botao"
      >
        SAIR
      </button>

    </div>

  </div>

</header>


<main>


  <div class="cabecalho">

    <h1>
      👑 ARTISTAS KUDURO PRIME
    </h1>

    <p>
      Descobre os artistas que fazem parte do movimento.
    </p>

  </div>


  <div id="carregando">

    A carregar artistas... 👑

  </div>


  <div
    id="feed"
    class="feed"
  ></div>


</main>


<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyDoitCcLeLDNBNPCP6fG1s_xbHr4UmohSo",

  authDomain:
  "kuduro-prime.firebaseapp.com",

  projectId:
  "kuduro-prime",

  storageBucket:
  "kuduro-prime.firebasestorage.app",

  messagingSenderId:
  "299776559545",

  appId:
  "1:299776559545:web:04aced1ba25391eb3fce68"

};


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);


const feed =
  document.getElementById("feed");


const carregando =
  document.getElementById("carregando");


/* VERIFICA LOGIN */

onAuthStateChanged(
  auth,
  async (user) => {

    if(!user){

      window.location.href =
        "area-do-artista.html";

      return;

    }


    try{


      const artistasRef =
        collection(
          db,
          "artistas"
        );


      const artistasSnapshot =
        await getDocs(
          artistasRef
        );


      carregando.style.display =
        "none";


      if(
        artistasSnapshot.empty
      ){

        feed.innerHTML = `

          <div class="vazio">

            <h2>
              Ainda não existem artistas.
            </h2>

            <p>
              Sê o primeiro artista a criar um perfil
              no KUDURO PRIME.
            </p>

          </div>

        `;

        return;

      }


      artistasSnapshot.forEach(
        (docArtista) => {


          const artista =
            docArtista.data();


          const uid =
            docArtista.id;


          const foto =
            artista.foto || "";


          const nome =
            artista.nome ||
            "Artista KUDURO PRIME";


          const provincia =
            artista.provincia ||
            "Angola";


          feed.innerHTML += `

            <article
              class="artista-card"
            >


              <div class="capa">

                <img
                  src="${foto}"
                  alt="${nome}"
                  onerror="
                    this.style.display='none'
                  "
                >

              </div>


              <div class="info">


                <div class="nome">

                  ${nome}

                </div>


                <div class="provincia">

                  📍 ${provincia}

                </div>


                <a
                  href="perfil.html?id=${uid}"
                  class="ver-perfil"
                >

                  VER PERFIL

                </a>


              </div>


            </article>

          `;


        }

      );


    }
    catch(erro){


      console.error(
        erro
      );


      carregando.textContent =
        "Erro ao carregar os artistas.";


    }


  }

);


/* SAIR */

document
  .getElementById("sair")
  .addEventListener(
    "click",
    async () => {


      await signOut(auth);


      window.location.href =
        "index.html";


    }
  );


</script>


</body>
</html>
