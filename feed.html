<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KUDURO PRIME — Feed</title>

<style>

:root{
  --bg:#080808;
  --panel:#121212;
  --panel2:#181818;
  --gold:#f4bf31;
  --text:#ffffff;
  --muted:#a8a8a8;
  --line:#292929;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

/* TOPO */

.topo{
  position:sticky;
  top:0;
  z-index:100;
  height:72px;
  background:rgba(8,8,8,.96);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--line);
}

.topo-in{
  max-width:1000px;
  height:100%;
  margin:auto;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:19px;
  font-weight:900;
  line-height:.9;
  color:white;
}

.logo span{
  display:block;
  color:var(--gold);
}

.logo small{
  display:block;
  text-align:center;
  color:var(--gold);
  font-size:18px;
}

/* PESQUISA */

.pesquisa{
  flex:1;
  max-width:350px;
}

.pesquisa input{
  width:100%;
  padding:12px 15px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#151515;
  color:white;
  outline:none;
}

.pesquisa input:focus{
  border-color:var(--gold);
}

/* AÇÕES */

.acoes{
  display:flex;
  align-items:center;
  gap:14px;
}

.icon-btn{
  background:none;
  border:0;
  color:white;
  font-size:20px;
  cursor:pointer;
}

.perfil-btn{
  background:var(--gold);
  color:#15100a;
  padding:10px 15px;
  border-radius:8px;
  font-weight:bold;
  font-size:12px;
}

/* CONTEÚDO */

.app{
  max-width:1000px;
  margin:auto;
  padding:30px 20px;
  display:grid;
  grid-template-columns:620px 1fr;
  gap:35px;
}

/* STORIES */

.stories{
  display:flex;
  gap:15px;
  overflow-x:auto;
  padding-bottom:18px;
}

.story{
  min-width:72px;
  text-align:center;
  cursor:pointer;
}

.story-foto{
  width:64px;
  height:64px;
  border-radius:50%;
  padding:3px;
  background:linear-gradient(135deg,var(--gold),#ffffff,#d18b15);
  margin:auto;
}

.story-foto img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  border:3px solid var(--bg);
}

.story-nome{
  margin-top:7px;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* FEED */

.feed{
  display:flex;
  flex-direction:column;
  gap:22px;
}

.publicacao{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
}

.publicacao-topo{
  padding:14px;
  display:flex;
  align-items:center;
  gap:11px;
}

.publicacao-foto{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid var(--gold);
}

.publicacao-info{
  flex:1;
}

.publicacao-nome{
  font-size:14px;
  font-weight:800;
}

.publicacao-local{
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
}

.publicacao-img{
  width:100%;
  height:430px;
  display:block;
  object-fit:cover;
  background:#111;
}

.publicacao-acoes{
  display:flex;
  gap:20px;
  padding:14px 16px 8px;
}

.acao{
  background:none;
  border:0;
  color:white;
  font-size:22px;
  cursor:pointer;
}

.acao:hover{
  color:var(--gold);
}

.publicacao-texto{
  padding:0 16px 18px;
  font-size:14px;
  line-height:1.5;
}

.publicacao-texto b{
  margin-right:5px;
}

/* LATERAL */

.lateral{
  position:sticky;
  top:100px;
  height:max-content;
}

.meu-perfil{
  display:flex;
  align-items:center;
  gap:12px;
  padding-bottom:25px;
  border-bottom:1px solid var(--line);
}

.meu-perfil img{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid var(--gold);
}

.meu-nome{
  font-size:14px;
  font-weight:bold;
}

.meu-info{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.ver-perfil{
  margin-left:auto;
  color:var(--gold);
  font-size:11px;
  font-weight:bold;
}

.sugestoes{
  margin-top:28px;
}

.sugestoes h3{
  font-size:12px;
  color:var(--muted);
  letter-spacing:1px;
}

.sugestao{
  display:flex;
  align-items:center;
  gap:10px;
  margin:18px 0;
}

.sugestao img{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
}

.sugestao-info{
  flex:1;
}

.sugestao-nome{
  font-size:13px;
  font-weight:bold;
}

.sugestao-provincia{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.ver{
  color:var(--gold);
  font-size:11px;
  font-weight:bold;
}

/* CARREGAMENTO */

.carregando{
  text-align:center;
  padding:50px 20px;
  color:var(--gold);
}

/* MOBILE */

@media(max-width:850px){

  .app{
    grid-template-columns:1fr;
    max-width:650px;
  }

  .lateral{
    display:none;
  }

}

@media(max-width:600px){

  .topo{
    height:65px;
  }

  .topo-in{
    padding:0 12px;
    gap:10px;
  }

  .logo{
    font-size:15px;
  }

  .pesquisa{
    display:none;
  }

  .publicacao-img{
    height:420px;
  }

  .app{
    padding:18px 0;
  }

  .stories{
    padding-left:14px;
  }

  .publicacao{
    border-radius:0;
    border-left:0;
    border-right:0;
  }

  .perfil-btn{
    padding:9px 10px;
  }

}

</style>

</head>

<body>

<header class="topo">

  <div class="topo-in">

    <a href="feed.html" class="logo">
      <small>♕</small>
      KUDURO
      <span>PRIME</span>
    </a>

    <div class="pesquisa">
      <input
        type="search"
        id="pesquisa"
        placeholder="🔍 Pesquisar artistas..."
      >
    </div>

    <div class="acoes">

      <a
        href="meu-perfil.html"
        class="perfil-btn"
      >
        👤 MEU PERFIL
      </a>

      <button
        class="icon-btn"
        id="sair"
        title="Sair"
      >
        ↪
      </button>

    </div>

  </div>

</header>


<main class="app">

  <div>

    <div
      class="stories"
      id="stories"
    >
      <div class="carregando">
        A carregar artistas...
      </div>
    </div>

    <div
      class="feed"
      id="feed"
    >
      <div class="carregando">
        A carregar o feed...
      </div>
    </div>

  </div>


  <aside class="lateral">

    <div
      class="meu-perfil"
      id="meuPerfil"
    >
      A carregar...
    </div>

    <div class="sugestoes">

      <h3>
        ARTISTAS SUGERIDOS
      </h3>

      <div
        id="sugestoes"
      ></div>

    </div>

  </aside>

</main>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyDoitCcLeLDNBNPCP6fG1s_xbHr4UmohSo",

  authDomain: "kuduro-prime.firebaseapp.com",

  projectId: "kuduro-prime",

  storageBucket:
  "kuduro-prime.firebasestorage.app",

  messagingSenderId:
  "299776559545",

  appId:
  "1:299776559545:web:04aced1ba25391eb3fce68"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* ELEMENTOS */

const stories =
  document.getElementById("stories");

const feed =
  document.getElementById("feed");

const sugestoes =
  document.getElementById("sugestoes");

const meuPerfil =
  document.getElementById("meuPerfil");

const pesquisa =
  document.getElementById("pesquisa");


/* PESQUISA */

let todosArtistas = [];


pesquisa.addEventListener(
  "input",
  () => {

    const texto =
      pesquisa.value.toLowerCase();

    const filtrados =
      todosArtistas.filter(artista =>

        (artista.nome || "")
        .toLowerCase()
        .includes(texto)

    );

    mostrarFeed(filtrados);

  }
);


/* MOSTRAR ARTISTAS */

function mostrarFeed(artistas){

  if(!artistas.length){

    feed.innerHTML = `
      <div class="carregando">
        Nenhum artista encontrado.
      </div>
    `;

    return;

  }


  feed.innerHTML =
    artistas.map(artista => `

      <article class="publicacao">

        <a
          href="perfil.html?id=${artista.id}"
          class="publicacao-topo"
        >

          <img
            class="publicacao-foto"
            src="${artista.foto || ''}"
            alt="${artista.nome || 'Artista'}"
          >

          <div class="publicacao-info">

            <div class="publicacao-nome">
              ${artista.nome || 'Artista'}
            </div>

            <div class="publicacao-local">
              📍 ${artista.provincia || 'Angola'}
            </div>

          </div>

          <span style="font-size:22px;color:#aaa">
            •••
          </span>

        </a>


        <a
          href="perfil.html?id=${artista.id}"
        >

          <img
            class="publicacao-img"
            src="${artista.foto || ''}"
            alt="Publicação de ${artista.nome || 'artista'}"
          >

        </a>


        <div class="publicacao-acoes">

          <button class="acao">
            ♡
          </button>

          <button class="acao">
            💬
          </button>

          <button class="acao">
            ↗
          </button>

        </div>


        <div class="publicacao-texto">

          <b>
            ${artista.nome || 'Artista'}
          </b>

          ${artista.bio || 'Artista do movimento Kuduro.'}

        </div>

      </article>

    `).join("");

}


/* STORIES */

function mostrarStories(artistas){

  stories.innerHTML =
    artistas.map(artista => `

      <a
        href="perfil.html?id=${artista.id}"
        class="story"
      >

        <div class="story-foto">

          <img
            src="${artista.foto || ''}"
            alt="${artista.nome || 'Artista'}"
          >

        </div>

        <div class="story-nome">

          ${(artista.nome || 'Artista')
          .split(" ")[0]}

        </div>

      </a>

    `).join("");

}


/* SUGESTÕES */

function mostrarSugestoes(artistas){

  sugestoes.innerHTML =
    artistas
    .slice(0,5)
    .map(artista => `

      <div class="sugestao">

        <a
          href="perfil.html?id=${artista.id}"
        >

          <img
            src="${artista.foto || ''}"
            alt="${artista.nome || 'Artista'}"
          >

        </a>


        <div class="sugestao-info">

          <a
            href="perfil.html?id=${artista.id}"
            class="sugestao-nome"
          >
            ${artista.nome || 'Artista'}
          </a>

          <div class="sugestao-provincia">

            ${artista.provincia || 'Angola'}

          </div>

        </div>


        <a
          class="ver"
          href="perfil.html?id=${artista.id}"
        >
          VER
        </a>

      </div>

    `).join("");

}


/* LOGIN */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      window.location.href =
        "area-do-artista.html";

      return;

    }


    try{

      /* PERFIL DO UTILIZADOR */

      const meuDoc =
        await getDoc(
          doc(
            db,
            "artistas",
            user.uid
          )
        );


      if(
        meuDoc.exists()
      ){

        const dados =
          meuDoc.data();


        meuPerfil.innerHTML = `

          <img
            src="${dados.foto || ''}"
            alt="${dados.nome || 'Meu perfil'}"
          >

          <div>

            <div class="meu-nome">
              ${dados.nome || 'Artista'}
            </div>

            <div class="meu-info">
              ${dados.provincia || 'Angola'}
            </div>

          </div>

          <a
            href="meu-perfil.html"
            class="ver-perfil"
          >
            VER
          </a>

        `;

      }else{

        window.location.href =
          "criar-perfil.html";

        return;

      }


      /* TODOS OS ARTISTAS */

      const resultado =
        await getDocs(
          collection(
            db,
            "artistas"
          )
        );


      todosArtistas =
        resultado.docs
        .map(documento => ({

          id:documento.id,

          ...documento.data()

        }))
        .filter(
          artista =>
            artista.id !== user.uid
        );


      mostrarStories(
        todosArtistas
      );

      mostrarFeed(
        todosArtistas
      );

      mostrarSugestoes(
        todosArtistas
      );


    }catch(erro){

      console.error(erro);

      feed.innerHTML = `
        <div class="carregando">
          Erro ao carregar o feed.
        </div>
      `;

    }

  }
);


/* SAIR */

document
.getElementById("sair")
.addEventListener(
  "click",
  async () => {

    await signOut(auth);

    window.location.href =
      "index.html";

  }
);


</script>

</body>
</html>
