/* =====================================

onAuthStateChanged(
  auth,
  async function(user){

    if(!user){

      loadingScreen.style.display = "none";

      sessionError.style.display = "flex";

    usuarioAtual = user;

      "kpArtistLoggedIn",
      "true"

        user.email

        "kpArtistStageName"

      localStorage.getItem(
        "kpArtistPhoto"
      )

      ||

      user.photoURL

      ||

      "kpArtistStageName",
      artistName

    localStorage.setItem(
      "kpArtistUsername",
      artistUser
    );


    if(artistPhoto){

        "kpArtistPhoto",
        artistPhoto

      "navName"

    document.getElementById(
      "sideName"

    document.getElementById(

    colocarFoto("navAvatar");

    colocarFoto("sideAvatar");

    colocarFoto("postAvatar");


    /* CARREGAR POSTS */

    loadingText.textContent =
      "A carregar publicações... 👑";


    await carregarPosts();

/* =====================================
   FOTO DO ARTISTA
===================================== */

function colocarFoto(id){

  if(!artistPhoto){

    return;

  }


  const elemento =
    document.getElementById(id);


  if(!elemento){

    return;

  }


  const img =
    document.createElement("img");


  img.src = artistPhoto;

  img.alt = "Foto do artista";


  elemento.innerHTML = "";

  elemento.appendChild(img);

}


/* =====================================
   ESCAPAR HTML
===================================== */

function escaparHTML(text){

  const div =
    document.createElement("div");

  div.textContent =
    String(text ?? "");

  return div.innerHTML;

}


/* =====================================

===================================== */

window.abrirMidia =
function(type){

  const boxes = {

    photo:
      document.getElementById("photoBox"),

    video:
      document.getElementById("videoBox"),

    music:
      document.getElementById("musicBox")

  };


  const buttons = {

    photo:
      document.getElementById("photoBtn"),

    video:
      document.getElementById("videoBtn"),

    music:
      document.getElementById("musicBtn")

  };


  Object.keys(boxes).forEach(
    function(key){

      boxes[key]
        .classList
        .remove("show");

      buttons[key]
        .classList
        .remove("active");

    }
  );


  if(selectedType === type){

    selectedType = "";

    return;

  }


  selectedType = type;


  boxes[type]
    .classList
    .add("show");


  buttons[type]
    .classList
    .add("active");

};


/* =====================================
   PREVIEW FOTO
===================================== */

window.previewPhoto =
function(event){

  const file =
    event.target.files[0];


  if(!file){

    return;

  }


  photoFile = file;


  if(photoPreviewURL){

    URL.revokeObjectURL(
      photoPreviewURL
    );

  }


  photoPreviewURL =
    URL.createObjectURL(file);


  document.getElementById(
    "photoPreview"
  ).innerHTML =

    `
    <img
      src="${photoPreviewURL}"
      alt="Foto selecionada"
    >

    <button
      class="remove-media"
      type="button"
      onclick="removerFoto()"
    >
      REMOVER FOTO
    </button>
    `;


  document.getElementById(
    "photoPreview"
  )

};

/* =====================================
   UPLOAD CLOUDINARY
===================================== */

async function enviarCloudinary(file, tipo){

  const formData =
    new FormData();


  formData.append(
    "file",
    file
  );


  formData.append(
    "upload_preset",
    UPLOAD_PRESET
  );


  formData.append(
    "resource_type",
    tipo
  );


  const resposta =
    await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${tipo}/upload`,
      {

        method:
          "POST",

        body:
          formData

      }
    );


  const dados =
    await resposta.json();


  if(!resposta.ok){

    console.error(
      "Erro Cloudinary:",
      dados
    );


    throw new Error(
      dados.error?.message ||
      "Erro ao enviar ficheiro."
    );

  }


  return dados.secure_url;

}


/* =====================================
   PUBLICAR
===================================== */

window.publicar =
async function(){

  if(!usuarioAtual){

    alert(
      "A tua conta ainda está a carregar."
    );

    return;

  }


  const text =
    document.getElementById(
      "postText"
    )
    .value
    .trim();


  if(
    !text &&
    !photoFile &&
    !videoFile &&
    !musicFile &&
    !musicData
  ){

    alert(
      "Escreve algo ou adiciona uma foto, vídeo ou música."
    );

    return;

  }


  try{


    publishBtn.disabled = true;

    publishBtn.textContent =
      "A PUBLICAR...";


    let tipo = "text";

    let mediaURL = "";

    let musicName = "";


    /* FOTO */

    if(photoFile){

      tipo = "photo";


      publishBtn.textContent =
        "A ENVIAR FOTO...";


      mediaURL =
        await enviarCloudinary(
          photoFile,
          "image"
        );

    }


    /* VÍDEO */

    else if(videoFile){

      tipo = "video";


      publishBtn.textContent =
        "A ENVIAR VÍDEO...";


      mediaURL =
        await enviarCloudinary(
          videoFile,
          "video"
        );

    }


    /* MÚSICA FICHEIRO */

    else if(musicFile){

      tipo = "music";


      musicName =
        musicFile.name;


      publishBtn.textContent =
        "A ENVIAR MÚSICA...";


      mediaURL =
        await enviarCloudinary(
          musicFile,
          "video"
        );

    }


    /* MÚSICA POR LINK */

    else if(musicData){

      tipo = "music";

      mediaURL = musicData;

      musicName =
        "Música partilhada";

    }


    publishBtn.textContent =
      "A GUARDAR...";


    await addDoc(
      collection(
        db,
        "publicacoes"
      ),
      {

        artistaId:
          usuarioAtual.uid,

        artistaNome:
          artistName,

        artistaUsername:
          artistUser,

        artistaFoto:
          artistPhoto,

        texto:
          text,

        tipo:
          tipo,

        mediaURL:
          mediaURL,

        musicName:
          musicName,

        likes:
          0,

        comentarios:
          0,

        criadoEm:
          serverTimestamp()

      }
    );


    /* LIMPAR */

    document.getElementById(
      "postText"
    ).value = "";


    removerFoto();

    removerVideo();

    removerMusica();


    selectedType = "";


    document.querySelectorAll(
      ".media-box"
    )
    .forEach(
      function(box){

        box.classList.remove(
          "show"
        );

      }
    );


    document.querySelectorAll(
      ".tool-btn"
    )
    .forEach(
      function(button){

        button.classList.remove(
          "active"
        );

      }
    );


    alert(
      "Publicação feita com sucesso! 👑🔥"
    );


    await carregarPosts();


  }catch(erro){

    console.error(
      "Erro ao publicar:",
      erro
    );


    alert(
      "Erro ao publicar: " +
      erro.message
    );

  }finally{


    publishBtn.disabled = false;

    publishBtn.textContent =
      "PUBLICAR";

  }

};


/* =====================================
   CARREGAR POSTS
===================================== */

async function carregarPosts(){

  feedPosts.innerHTML =

    `
    <div
      class="loading-feed"
      style="
        padding:25px;
        text-align:center;
        color:#aaa59a;
      "
    >
      A carregar publicações... 👑
    </div>
    `;


  try{


    const q =
      query(
        collection(
          db,
          "publicacoes"
        ),
        orderBy(
          "criadoEm",
          "desc"
        )
      );


    const snapshot =
      await getDocs(q);


    if(snapshot.empty){

      feedPosts.innerHTML =

        `
        <div
          class="panel"
          style="
            padding:30px;
            text-align:center;
            color:#aaa59a;
          "
        >
          Ainda não existem publicações.<br><br>
          Sê o primeiro a publicar! 👑
        </div>
        `;

      return;

    }


    feedPosts.innerHTML = "";


    snapshot.forEach(
      function(postDoc){

        const post =
          postDoc.data();


        mostrarPost(
          post,
          postDoc.id
        );

      }
    );


  }catch(erro){

    console.error(
      "Erro ao carregar feed:",
      erro
    );


    feedPosts.innerHTML =

      `
      <div
        class="panel"
        style="
          padding:30px;
          text-align:center;
          color:#ff887a;
        "
      >
        Erro ao carregar o feed.<br><br>
        Verifica as regras do Firestore.
      </div>
      `;

  }

}


/* =====================================
   MOSTRAR POST
===================================== */

function mostrarPost(post,id){

  let mediaHTML = "";


  if(
    post.tipo === "photo" &&
    post.mediaURL
  ){

    mediaHTML =

      `
      <img
        src="${escaparHTML(post.mediaURL)}"
        class="post-image"
        style="
          object-fit:cover;
          display:block;
          background:none;
        "
        alt="Publicação"
      >
      `;

  }


  if(
    post.tipo === "video" &&
    post.mediaURL
  ){

    mediaHTML =

      `
      <video
        class="post-video"
        controls
        preload="metadata"
      >

        <source
          src="${escaparHTML(post.mediaURL)}"
        >

      </video>
      `;

  }


  if(
    post.tipo === "music" &&
    post.mediaURL
  ){

    mediaHTML =

      `
      <div class="music-post">

        <div class="music-cover">
          🎵
        </div>

        <div class="music-info">

          <div class="music-name">
            ${escaparHTML(
              post.musicName ||
              "Música partilhada"
            )}
          </div>

          <div class="music-artist">
            ${escaparHTML(
              post.artistaNome ||
              "Artista"
            )}
          </div>

          <audio
            class="music-player"
            controls
            preload="metadata"
            src="${escaparHTML(post.mediaURL)}"
          ></audio>

        </div>

      </div>
      `;

  }


  const avatarHTML =
    post.artistaFoto
    ?
    `
    <img
      src="${escaparHTML(post.artistaFoto)}"
      alt="Foto do artista"
    >
    `
    :
    "👤";


  const postHTML =

    `
    <article
      class="post panel"
      data-post-id="${id}"
    >

      <div class="post-top">

        <div
          class="post-author-img"
          style="
            display:grid;
            place-items:center;
            overflow:hidden;
            color:#f4bf31;
          "
        >

          ${avatarHTML}

        </div>


        <div>

          <div class="post-name">

            ${escaparHTML(
              post.artistaNome ||
              "Artista Prime"
            )}

            <span class="verified">
              ●
            </span>

          </div>


          <div class="post-meta">

            @${escaparHTML(
              post.artistaUsername ||
              "artista"
            )}

            · ${formatarData(
              post.criadoEm
            )}

          </div>

        </div>


        <div class="more">
          ⋯
        </div>

      </div>


      ${
        post.texto
        ?
        `
        <div class="post-text">
          ${escaparHTML(post.texto)}
        </div>
        `
        :
        ""
      }


      ${mediaHTML}


      <div class="post-stats">

        <span>
          🔥 ${post.likes || 0} reações
        </span>

        <span>
          ${post.comentarios || 0} comentários
        </span>

      </div>


      <div class="post-buttons">

        <button
          onclick="like(this)"
        >
          ♡ GOSTAR
        </button>


        <button
          onclick="comentar()"
        >
          💬 COMENTAR
        </button>


        <button
          onclick="partilhar()"
        >
          ↗ PARTILHAR
        </button>

      </div>

    </article>
    `;


  feedPosts.insertAdjacentHTML(
    "beforeend",
    postHTML
  );

}


/* =====================================
   DATA
===================================== */

function formatarData(data){

  if(!data){

    return "agora";

  }


  try{

    const date =
      data.toDate();


    const diff =
      Date.now() -
      date.getTime();


    const minutes =
      Math.floor(
        diff / 60000
      );


    if(minutes < 1){

      return "agora";

    }


    if(minutes < 60){

      return minutes + " min";

    }


    const hours =
      Math.floor(
        minutes / 60
      );


    if(hours < 24){

      return hours + " h";

    }


    const days =
      Math.floor(
        hours / 24
      );


    return days + " d";


  }catch(erro){

    return "agora";

  }

}
