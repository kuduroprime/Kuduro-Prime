<head>

<style>

}

body{

header{

  border-bottom:2px solid #d4af37;

nav{

  justify-content:center;
  flex-wrap:wrap;

nav a{
  color:#fff;

.hero{

.musica{

}

.capa{
  height:200px;
  border-radius:11px;
  margin-bottom:16px;
  background:

      135deg,
      #d4af37,
      #5b4100
    );
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:70px;
  overflow:hidden;
}

.capa img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.musica h2{
  margin:8px 0 5px;
  font-size:20px;
}

.artista{
  color:#d4af37;
  font-size:13px;
  font-weight:900;
}

.descricao{
  color:#aaa;
  font-size:12px;
  line-height:1.5;
  min-height:36px;
}

audio{
  width:100%;
  margin-top:15px;
}

.info{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:13px;
  padding-top:12px;
  border-top:1px solid #292929;
  color:#888;
  font-size:11px;
}

.views{
  color:#d4af37;
  font-weight:900;
}

.perfil-btn{
  display:inline-block;
  margin-top:12px;
  color:#d4af37;
  font-size:11px;
  font-weight:900;
  text-decoration:none;
}

.perfil-btn:hover{
  text-decoration:underline;
}

.view-status{
  margin-top:8px;
  min-height:15px;
  color:#666;
  font-size:10px;
}

.loading{
  text-align:center;
  padding:60px 20px;
  color:#aaa;
}

.loading-icon{
  font-size:40px;
  margin-bottom:10px;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:70px 20px;
  color:#888;
}

.empty-icon{
  font-size:55px;
  margin-bottom:15px;
}

.error{
  grid-column:1/-1;
  text-align:center;
  padding:50px 20px;
  color:#ff7464;
  background:#170c0a;
  border:1px solid #4a1d17;
  border-radius:12px;
}

footer{
  margin-top:50px;
  background:#111;
  text-align:center;
  padding:30px;
  color:#777;
  font-size:12px;
}

@media(max-width:600px){

  .logo{
    font-size:24px;
  }

  nav a{
    font-size:11px;
    margin:4px;
  }

  h1{
    font-size:29px;
  }

  .hero{
    padding-top:40px;
  }

  .musicas{
    grid-template-columns:1fr;
    padding:15px;
  }

  .capa{
    height:190px;
  }

}
</style>

</head>

<body>

<header>

  <nav>

    <a href="artistas.html">ARTISTAS</a>

    <a href="ranking.html">RANKING</a>
    <a href="eventos.html">EVENTOS</a>
    <a href="videos.html">VÍDEOS</a>
  </nav>

</header>

<section class="hero">

  <h1>

  </h1>

  <p class="subtitulo">
    Os lançamentos que estão a movimentar o Kuduro.
  </p>

</section>

<section
  class="musicas"
  id="musicasContainer"
>

  <div class="loading">

<div class="loading-icon">
  ⏳
</div>

A carregar músicas...
```

  </div>

</section>

<footer>

© 2026 KUDURO PRIME — O KUDURO VIVE AQUI 👑

</footer>

<script type="module">

/* =========================================
   FIREBASE
========================================= */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  increment,
  query,
  orderBy,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyDoitCcLeLDNBNPCP6fG1s_xbHr4UmohSo",

  authDomain:
    "kuduro-prime.firebaseapp.com",

  projectId:
    "kuduro-prime",

  storageBucket:
    "kuduro-prime.firebasestorage.app",

  messagingSenderId:
    "299776559545",

  appId:
    "1:299776559545:web:04aced1ba25391eb3fce68"

};


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =========================================
   ELEMENTOS
========================================= */

const container =
  document.querySelector(
    "#musicasContainer"
  );


let currentUser = null;


/* =========================================
   SEGURANÇA HTML
========================================= */

function escapeHTML(value){

  const div =
    document.createElement("div");

  div.textContent =
    value || "";

  return div.innerHTML;

}


/* =========================================
   FORMATAR DATA
========================================= */

function formatDate(timestamp){

  if(!timestamp){
    return "";
  }

  if(timestamp.seconds){

    const date =
      new Date(
        timestamp.seconds * 1000
      );

    return date.toLocaleDateString(
      "pt-PT"
    );

  }

  return "";

}


/* =========================================
   FORMATAR NÚMEROS
========================================= */

function formatNumber(number){

  number =
    Number(number) || 0;

  return number.toLocaleString(
    "pt-PT"
  );

}


/* =========================================
   CARREGAR MÚSICAS
========================================= */

async function loadSongs(){

  try{

    const musicQuery =
      query(
        collection(
          db,
          "musicas"
        ),
        orderBy(
          "criadoEm",
          "desc"
        )
      );


    const snapshot =
      await getDocs(
        musicQuery
      );


    if(snapshot.empty){

      container.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            🎵
          </div>

          <h2>
            Ainda não existem músicas.
          </h2>

          <p>
            Os próximos lançamentos aparecerão aqui.
          </p>

        </div>

      `;

      return;

    }


    const songs =
      snapshot.docs.map(
        musicDoc => ({

          id:
            musicDoc.id,

          ...musicDoc.data()

        })
      );


    renderSongs(
      songs
    );

  }
  catch(error){

    console.error(
      "Erro ao carregar músicas:",
      error
    );


    container.innerHTML = `

      <div class="error">

        ⚠️
        <br><br>

        Não foi possível carregar as músicas.

        <br><br>

        <small>
          ${escapeHTML(error.message)}
        </small>

      </div>

    `;

  }

}


/* =========================================
   RENDERIZAR MÚSICAS
========================================= */

function renderSongs(songs){

  container.innerHTML =
    songs.map(
      song => {

        const title =
          song.titulo
          ||
          song.title
          ||
          "Música sem título";


        const artist =
          song.artistaNome
          ||
          song.artistName
          ||
          song.nomeArtistico
          ||
          "Artista Prime";


        const description =
          song.descricao
          ||
          song.description
          ||
          "Novo lançamento no KUDURO PRIME.";


        const cover =
          song.capa
          ||
          song.cover
          ||
          song.coverUrl
          ||
          "";


        const audio =
          song.audio
          ||
          song.audioUrl
          ||
          song.url
          ||
          song.musicUrl
          ||
          "";


        const views =
          Number(
            song.views
          )
          ||
          0;


        const date =
          song.dataLancamento
          ||
          formatDate(
            song.criadoEm
          );


        const artistId =
          song.artistaId
          ||
          song.artistId
          ||
          song.userId
          ||
          song.uid
          ||
          "";


        const coverHTML =
          cover
          ?

          `
            <img
              src="${escapeHTML(cover)}"
              alt="${escapeHTML(title)}"
              loading="lazy"
              onerror="this.style.display='none'"
            >
          `

          :

          `🎵`;


        const audioHTML =
          audio

          ?

          `
            <audio
              controls
              preload="none"
              data-song-id="${escapeHTML(song.id)}"
              data-owner-id="${escapeHTML(artistId)}"
            >

              <source
                src="${escapeHTML(audio)}"
              >

              Seu navegador não suporta áudio.

            </audio>

            <div
              class="view-status"
              id="status-${escapeHTML(song.id)}"
            ></div>
          `

          :

          `
            <p
              style="
                color:#777;
                font-size:11px;
                margin-top:15px;
              "
            >
              Áudio indisponível.
            </p>
          `;


        return `

          <article
            class="musica"
            data-id="${escapeHTML(song.id)}"
          >

            <div class="capa">

              ${coverHTML}

            </div>


            <h2>
              ${escapeHTML(title)}
            </h2>


            <div class="artista">

              👑
              ${escapeHTML(artist)}

            </div>


            <p class="descricao">

              ${escapeHTML(description)}

            </p>


            ${audioHTML}


            <div class="info">

              <span class="views">

                👁

                <span
                  class="view-number"
                  id="views-${escapeHTML(song.id)}"
                >
                  ${formatNumber(views)}
                </span>

                visualizações

              </span>


              <span>

                ${escapeHTML(date)}

              </span>

            </div>


            ${
              artistId

              ?

              `
                <a
                  class="perfil-btn"
                  href="perfil.html?id=${encodeURIComponent(artistId)}"
                >
                  VER PERFIL DO ARTISTA →
                </a>
              `

              :

              ""
            }

          </article>

        `;

      }
    )
    .join("");


  activateViewTracking();

}


/* =========================================
   REGISTRAR VISUALIZAÇÃO
========================================= */

async function registerView(
  songId,
  ownerId,
  audio
){

  /*
     Sem login:

     Não contabilizamos.
  */

  if(!currentUser){

    console.log(
      "Utilizador não autenticado."
    );

    return;

  }


  /*
     O próprio artista não conta
     a sua própria visualização.
  */

  if(
    ownerId &&
    currentUser.uid === ownerId
  ){

    console.log(
      "Próprio artista. View não contabilizada."
    );

    const status =
      document.querySelector(
        "#status-" +
        CSS.escape(songId)
      );

    if(status){

      status.textContent =
        "Sua própria reprodução não conta como view.";

    }

    return;

  }


  try{

    /*
       Criamos um documento único para
       este utilizador nesta música.

       Estrutura:

       musicas/{songId}/viewers/{userId}
    */

    const viewerRef =
      doc(
        db,
        "musicas",
        songId,
        "viewers",
        currentUser.uid
      );


    const viewerSnapshot =
      await getDoc(
        viewerRef
      );


    /*
       Se já viu esta música,
       não contamos novamente.
    */

    if(
      viewerSnapshot.exists()
    ){

      console.log(
        "Este utilizador já contou esta música."
      );

      return;

    }


    /*
       Marcamos o utilizador como
       espectador desta música.
    */

    await setDoc(
      viewerRef,
      {

        userId:
          currentUser.uid,

        criadoEm:
          serverTimestamp()

      }
    );


    /*
       Só depois aumentamos
       a quantidade de views.
    */

    const songRef =
      doc(
        db,
        "musicas",
        songId
      );


    await updateDoc(
      songRef,
      {

        views:
          increment(1)

      }
    );


    /*
       Atualiza o número mostrado
       na tela.
    */

    const viewElement =
      document.querySelector(
        "#views-" +
        CSS.escape(songId)
      );


    if(viewElement){

      const current =
        Number(
          viewElement.textContent
            .replace(/\D/g,"")
        )
        ||
        0;


      viewElement.textContent =
        formatNumber(
          current + 1
        );

    }


    console.log(
      "Nova visualização contabilizada."
    );

  }
  catch(error){

    console.error(
      "Erro ao registrar visualização:",
      error
    );

  }

}


/* =========================================
   CONTROLO DO PLAYER
========================================= */

function activateViewTracking(){

  const audios =
    document.querySelectorAll(
      "audio[data-song-id]"
    );


  audios.forEach(
    audio => {

      let sessionChecked =
        false;


      audio.addEventListener(
        "play",
        async () => {

          /*
             Evita várias chamadas durante
             a mesma abertura da página.
          */

          if(sessionChecked){

            return;

          }


          sessionChecked =
            true;


          const songId =
            audio.dataset.songId;


          const ownerId =
            audio.dataset.ownerId;


          await registerView(
            songId,
            ownerId,
            audio
          );

        }
      );

    }
  );

}


/* =========================================
   AUTENTICAÇÃO
========================================= */

onAuthStateChanged(
  auth,
  user => {

    currentUser =
      user || null;


    /*
       Só carregamos as músicas depois
       de saber quem está autenticado.
    */

    loadSongs();

  }
);

</script>

</body>
</html>
